<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Step Deployment Loader Preview</title>
  
  <!-- Google Fonts: Onest & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* ============================================================
       DESIGN SYSTEM TOKENS WITH ACCENT COLOR (#C7F464)
       ============================================================ */
    :root {
      --color-bg: #FFFFFF;
      --color-surface: #F5F6F4;
      --color-surface-hover: #EAECE8;
      --color-text: #0F1720;
      --color-muted: #6B7280;
      --color-line: #E2E4DC;
      --color-accent: #C7F464;
      --color-accent-dark: #9EE01A;
      --color-accent-text: #0F1720;
      --color-neutral: #111111;
      --color-neutral-text: #FFFFFF;
      --color-secondary-btn: #E4E6E0;
      --color-secondary-hover: #D6D9D0;
      --font-body: 'Onest', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    [data-theme="dark"] {
      --color-bg: #0F1720;
      --color-surface: #141D27;
      --color-surface-hover: #1E293B;
      --color-text: #FFFFFF;
      --color-muted: #9CA3AF;
      --color-line: rgba(255, 255, 255, 0.14);
      --color-accent: #C7F464;
      --color-accent-dark: #A8E04A;
      --color-accent-text: #0F1720;
      --color-neutral: #FFFFFF;
      --color-neutral-text: #0F1720;
      --color-secondary-btn: #222E3C;
      --color-secondary-hover: #2B3B4E;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
      box-shadow: none !important;
      text-decoration: none !important;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */
    .top-bar {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-line);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .top-title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle-btn {
      background: var(--color-secondary-btn);
      border: 1px solid var(--color-line);
      color: var(--color-text);
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .main-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn--accent {
      background: var(--color-accent);
      color: var(--color-accent-text);
    }

    .btn--accent:hover {
      background: var(--color-accent-dark);
    }

    /* ============================================================
       MULTI-STEP LOADER MODAL (ACETERNITY UI STYLE)
       ============================================================ */
    .loader-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 32, 0.85);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .loader-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .loader-close-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      background: transparent;
      border: none;
      color: #FFFFFF;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .loader-close-btn:hover {
      opacity: 1;
    }

    .loader-card {
      width: 100%;
      max-width: 460px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .loader-header {
      margin-bottom: 8px;
    }

    .loader-header-title {
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 4px;
    }

    .loader-header-sub {
      font-size: 13px;
      color: #9CA3AF;
    }

    .loader-steps {
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: relative;
    }

    .loader-step-row {
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.3s ease;
    }

    .step-icon-wrap {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* STATES: PENDING, ACTIVE, COMPLETED */
    .loader-step-row.pending {
      opacity: 0.35;
    }

    .loader-step-row.pending .step-text {
      color: #9CA3AF;
      font-weight: 500;
    }

    .loader-step-row.pending .step-icon-dot {
      width: 8px;
      height: 8px;
      border: 2px solid #6B7280;
    }

    .loader-step-row.active {
      opacity: 1;
      transform: scale(1.03);
    }

    .loader-step-row.active .step-text {
      color: var(--color-accent);
      font-weight: 700;
      font-size: 16px;
    }

    .loader-step-row.completed {
      opacity: 0.7;
    }

    .loader-step-row.completed .step-text {
      color: #E5E7EB;
      font-weight: 600;
      font-size: 14px;
    }

    .step-check-icon {
      color: var(--color-accent);
      width: 20px;
      height: 20px;
    }

    .step-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(199, 244, 100, 0.3);
      border-top-color: var(--color-accent);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="top-title">
      <i data-lucide="loader" style="width:18px;height:18px; color:var(--color-accent);"></i>
      <span>Multi-Step Loader Demo (Aceternity UI Style)</span>
    </div>

    <button class="theme-toggle-btn" onclick="toggleTheme()">
      <i data-lucide="sun" id="theme-icon" style="width:14px;height:14px;"></i>
      <span id="theme-text">Light Mode</span>
    </button>
  </header>

  <!-- MAIN HERO DEMO TRIGGER -->
  <main class="main-hero">
    <h1 style="font-size: 28px; font-weight: 800; margin-bottom: 12px;">Python App Multi-Step Deployment Loader</h1>
    <p style="font-size: 15px; color: var(--color-muted); max-width: 540px; margin-bottom: 32px;">
      Simulates an animated step-by-step progress loader when deploying or inspecting a Python application.
    </p>

    <button class="btn btn--accent" onclick="startLoader()">
      <i data-lucide="rocket" style="width:18px;height:18px;"></i> Trigger Multi-Step Loader
    </button>
  </main>

  <!-- FULL-SCREEN MULTI-STEP LOADER OVERLAY -->
  <div class="loader-overlay" id="multi-loader-overlay">
    <button class="loader-close-btn" onclick="stopLoader()" title="Cancel">
      <i data-lucide="x" style="width:28px;height:28px;"></i>
    </button>

    <div class="loader-card">
      <div class="loader-header">
        <h2 class="loader-header-title">Deploying Application...</h2>
        <p class="loader-header-sub" id="loader-sub-text">Please wait while the server provisions your service.</p>
      </div>

      <div class="loader-steps" id="loader-steps-container">
        <!-- Steps rendered dynamically via JS -->
      </div>
    </div>
  </div>

  <script>
    const deploymentSteps = [
      { id: 1, text: "Cloning Git repository (origin/main)" },
      { id: 2, text: "Detecting Python framework & dependencies" },
      { id: 3, text: "Creating isolated Python virtualenv" },
      { id: 4, text: "Installing requirements via pip" },
      { id: 5, text: "Configuring Nginx reverse proxy" },
      { id: 6, text: "Provisioning systemd service unit" },
      { id: 7, text: "Starting FastAPI Uvicorn process" },
      { id: 8, text: "Verifying HTTP health response on port 8004" }
    ];

    let currentStepIndex = 0;
    let stepInterval = null;

    function renderSteps() {
      const container = document.getElementById('loader-steps-container');
      container.innerHTML = '';

      deploymentSteps.forEach((step, index) => {
        const row = document.createElement('div');
        row.className = 'loader-step-row';

        if (index < currentStepIndex) {
          row.classList.add('completed');
          row.innerHTML = `
            <div class="step-icon-wrap">
              <i data-lucide="check-circle-2" class="step-check-icon"></i>
            </div>
            <span class="step-text">${step.text}</span>
          `;
        } else if (index === currentStepIndex) {
          row.classList.add('active');
          row.innerHTML = `
            <div class="step-icon-wrap">
              <div class="step-spinner"></div>
            </div>
            <span class="step-text">${step.text}</span>
          `;
        } else {
          row.classList.add('pending');
          row.innerHTML = `
            <div class="step-icon-wrap">
              <div class="step-icon-dot"></div>
            </div>
            <span class="step-text">${step.text}</span>
          `;
        }

        container.appendChild(row);
      });

      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function startLoader() {
      currentStepIndex = 0;
      document.getElementById('multi-loader-overlay').classList.add('active');
      document.getElementById('loader-sub-text').textContent = 'Please wait while the server provisions your service.';
      renderSteps();

      if (stepInterval) clearInterval(stepInterval);

      stepInterval = setInterval(() => {
        currentStepIndex++;
        if (currentStepIndex >= deploymentSteps.length) {
          clearInterval(stepInterval);
          document.getElementById('loader-sub-text').textContent = '🎉 Deployment completed successfully!';
          setTimeout(() => {
            stopLoader();
          }, 1800);
        } else {
          renderSteps();
        }
      }, 1600);
    }

    function stopLoader() {
      if (stepInterval) clearInterval(stepInterval);
      document.getElementById('multi-loader-overlay').classList.remove('active');
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', next);

      document.getElementById('theme-text').textContent = next === 'light' ? 'Light Mode' : 'Dark Mode';
      const icon = document.getElementById('theme-icon');
      if (next === 'light') {
        icon.setAttribute('data-lucide', 'sun');
      } else {
        icon.setAttribute('data-lucide', 'moon');
      }
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
    });
  </script>
</body>
</html>
