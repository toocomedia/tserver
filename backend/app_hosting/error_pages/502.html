<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>502 — Service Unavailable</title>
  <link rel="stylesheet" href="/_srv-errors/error.css">
</head>
<body class="error-page error-page--warning">
  <header class="error-header">
    <a class="error-brand" href="/" aria-label="SRV Panel home">
      <img src="/_srv-errors/logobarq.png" alt="SRV Panel" class="error-brand__logo">
    </a>
    <span class="error-header__label">Service response</span>
  </header>
  <main class="error-main">
    <section class="error-panel" aria-labelledby="error-title">
      <span class="error-status">HTTP 502</span>
      <div class="error-code">502</div>
      <h1 id="error-title">Service unavailable</h1>
      <p>The application service is starting, restarting, or temporarily unreachable. Please try again shortly.</p>
      <div class="error-actions">
        <a href="javascript:location.reload()" class="error-button error-button--primary">Retry connection</a>
        <a href="/" class="error-button error-button--secondary">Return home</a>
      </div>
      <div class="error-meta"><span>Response code</span><strong>502 BAD GATEWAY</strong></div>
    </section>
  </main>
</body>
</html>
