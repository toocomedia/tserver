<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/_srv-errors/error.css">
</head>
<body>
  <header class="error-header">
    <div class="error-header__brand">
      <img src="/_srv-errors/logobarq.png" alt="SRV Panel Logo" class="error-header__logo">
      <span class="error-header__title">SRV Panel</span>
    </div>
    <div class="error-header__status">
      <span class="pulse-dot"></span>
      Website Response
    </div>
  </header>

  <main class="error-container">
    <div class="error-card">
      <div class="error-card__badge">HTTP 404</div>
      <div class="error-code">404</div>
      <h1>Page Not Found</h1>
      <p>The requested page or resource could not be found. It may have been moved, deleted, or the URL might be mistyped.</p>
      <div class="error-actions">
        <a href="javascript:history.back()" class="btn btn--primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Go Back
        </a>
        <a href="/" class="btn btn--secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Home Page
        </a>
      </div>
      <div class="error-info">
        <span class="error-info__label">Response Code</span>
        <span class="error-info__val">404 NOT FOUND</span>
      </div>
    </div>
  </main>
</body>
</html>
