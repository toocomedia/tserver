{# Shared Cards / Compact / List view switcher. #}
<div class="layout-switcher-wrap">
  <div class="layout-switcher layout-switcher--three" data-resource-switcher="{{ resource_id }}" role="radiogroup" aria-label="{{ resource_label }} layout view">
    <button type="button" class="layout-switcher__btn{% if active_view == 'cards' %} is-active{% endif %}" data-resource-view="cards" role="radio" aria-checked="{{ 'true' if active_view == 'cards' else 'false' }}">
      <svg viewbox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      {{ _('cards') }}
    </button>
    <button type="button" class="layout-switcher__btn{% if active_view == 'compact' %} is-active{% endif %}" data-resource-view="compact" role="radio" aria-checked="{{ 'true' if active_view == 'compact' else 'false' }}">
      <svg viewbox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16"></rect></svg>
      {{ compact_label or 'Compact' }}
    </button>
    <button type="button" class="layout-switcher__btn{% if active_view == 'list' %} is-active{% endif %}" data-resource-view="list" role="radio" aria-checked="{{ 'true' if active_view == 'list' else 'false' }}">
      <svg viewbox="0 0 24 24" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
      {{ _('list') }}
    </button>
  </div>
</div>
