<!-- dependency_card_compact.html partial (Compact 230px 1:1 Overlay Box) -->
<div class="compact-card-1x1">
  <div class="compact-card-1x1__icon">
    {% if dependency.icon %}
      <img src="{{ dependency.icon }}" alt="{{ dependency.name }} icon" onerror="this.onerror=null; this.style.display='none'; this.nextElementSibling.style.display='block';">
      <svg style="display: none; width:56px; height:56px; stroke:var(--color-text);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="1.5" d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
    {% else %}
      <svg style="width:56px; height:56px; stroke:var(--color-text);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="1.5" d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
    {% endif %}
  </div>
  <div class="compact-card-1x1__overlay"></div>
  <div class="compact-card-1x1__content">
    <div class="compact-card-1x1__top">
      <div class="status-inline" style="color:#FFF;">
        {% if dependency.healthy and dependency.desired_enabled %}
          <span class="status-dot status-dot--active"></span> Healthy
        {% else %}
          <span class="status-dot status-dot--danger"></span> {{ dependency.effective_state }}
        {% endif %}
      </div>
    </div>
    <div class="compact-card-1x1__bottom">
      <div class="compact-card-1x1__title">{{ dependency.name }}</div>
      <div class="compact-card-1x1__meta">v{{ dependency.version }}</div>
      <div class="compact-card-1x1__actions">
        <a href="/dependencies/{{ dependency.id }}" class="btn btn--secondary btn--sm" style="height:26px; font-size:11px; padding:0 8px;">View Info</a>
      </div>
    </div>
  </div>
</div>
