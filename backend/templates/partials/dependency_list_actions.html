{% if dependency.installed and dependency.can_toggle %}
  <form method="post" action="/api/dependencies/{{ dependency.id }}/toggle" class="inline-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    {% if dependency.running %}
      <input type="hidden" name="enabled" value="false">
      <input type="hidden" name="confirmed" value="true">
      <button class="btn btn--ghost btn--sm" type="submit" onclick="return confirm('Disable {{ dependency.name }}? Dependent plugins will be paused.')">Disable</button>
    {% else %}
      <input type="hidden" name="enabled" value="true">
      <button class="btn btn--primary btn--sm" type="submit">Enable</button>
    {% endif %}
  </form>
{% endif %}
<a href="/dependencies/{{ dependency.id }}" class="btn btn--secondary btn--sm">View Info</a>
