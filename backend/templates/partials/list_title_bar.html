{{ _('list_title_bar_html_reusable_background_') }}
<div class="list-title-bar">
  <h3>
    {% if icon_svg %}
      {{ icon_svg | safe }}
    {% endif %}
    {{ title }}
  </h3>

  <div style="display: flex; align-items: center; gap: 12px;">
    {% if item_count is not none %}
    <span style="font-size: 11px; color: var(--color-muted); font-weight: 700;">
      {{ item_count }} Total
    </span>
    {% endif %}

    {% if right_action %}
    <a href="{{ right_action.url }}" class="btn btn--primary btn--sm" style="height: 28px; padding: 0 10px; font-size: 10px;">
      {{ right_action.label }}
    </a>
    {% endif %}
  </div>
</div>
