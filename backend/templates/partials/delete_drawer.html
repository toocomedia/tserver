<!-- SHARED DELETE BOTTOM DRAWER (Modular Component) -->
<div id="delete-drawer-backdrop" class="delete-drawer-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="delete-drawer-title" aria-describedby="delete-drawer-message">
  <div class="delete-drawer" id="delete-drawer">
    <div class="delete-drawer__inner">
      <div class="delete-drawer__main">
        <div class="delete-drawer__badge-icon">
          <i data-lucide="alert-triangle"></i>
        </div>
        <div class="delete-drawer__details">
          <div class="delete-drawer__heading-row">
            <h2 id="delete-drawer-title" class="delete-drawer__title" data-delete-drawer-title>{{ _('confirm_delete') }}</h2>
            <div class="delete-drawer__target-box" data-delete-drawer-item-box hidden>
              <span class="delete-drawer__target-name" data-delete-drawer-item></span>
            </div>
          </div>
          <p id="delete-drawer-message" class="delete-drawer__message" data-delete-drawer-message>{{ _('delete_warning_permanent') }}</p>
          <div class="delete-drawer__extra" data-delete-drawer-extra hidden></div>
        </div>
      </div>

      <div class="delete-drawer__actions">
        <button type="button" class="btn btn--secondary delete-drawer__btn delete-drawer__cancel-btn" data-delete-drawer-close>
          {{ _('cancel') }}
        </button>
        <button type="button" class="btn btn--danger delete-drawer__btn delete-drawer__confirm-btn" id="delete-drawer-confirm-btn" data-delete-drawer-confirm disabled data-base-label="{{ _('delete') }}">
          <span class="delete-drawer__progress-fill" data-delete-drawer-progress></span>
          <span class="delete-drawer__btn-content">
            <i data-lucide="trash-2"></i>
            <span data-delete-drawer-btn-text>{{ _('delete') }}</span>
          </span>
        </button>
      </div>

      <button type="button" class="btn btn--ghost btn--icon delete-drawer__close-btn" data-delete-drawer-close aria-label="{{ _('close') }}">
        <i data-lucide="x"></i>
      </button>
    </div>
  </div>
</div>
