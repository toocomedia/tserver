{{ _('stat_cards_html_reusable_dashboard_overv') }}
<div class="stat-grid">
  {% for s in stats %}
  <div class="stat-card-box">
    <div class="stat-card-box__label">
      <span>{{ s.label }}</span>
      {% if s.icon %}
      <span style="display: flex; align-items: center;">{{ s.icon | safe }}</span>
      {% endif %}
    </div>
    <div class="stat-card-box__val">{{ s.value }}</div>
    {% if s.meta %}
    <div class="stat-card-box__meta">{{ s.meta }}</div>
    {% endif %}
  </div>
  {% endfor %}
</div>
