{% extends "layout.html" %}
{% block title %}App Logs — {{ PANEL_NAME }}{% endblock %}
{% block page_title %}Python App Logs{% endblock %}
{% block content %}
<section class="section"><div class="section__header"><h3>{{ app.service_name }}</h3><a class="btn btn--secondary" href="/apps/{{ app.id }}">{{ _('back_to_app') }}</a></div><div class="section__body"><p class="text-muted">{{ _('latest_200_lines_from_the_system_service') }}</p><pre class="clean-cmd-box">{{ logs }}</pre></div></section>
{% endblock %}
