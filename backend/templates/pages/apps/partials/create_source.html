<section class="app-wizard__panel" data-wizard-panel="1">
  <header class="app-wizard__panel-header">
    <h2>Connect Git repository</h2>
    <p>Enter a Git URL to load its default branch and available branches.</p>
  </header>

  <div class="form-group">
    <label class="form-label" for="repository_url">Repository URL</label>
    <input class="form-input form-input--code" id="repository_url" name="repository_url" placeholder="https://github.com/owner/project.git" autocomplete="url" required data-repository-url>
    <p class="form-hint">The panel only reads repository metadata and source files. It never runs repository code during detection.</p>
  </div>

  <div class="form-group">
    <label class="form-label" for="branch">Branch</label>
    <div class="form-select-wrap">
      <select class="form-select" id="branch" name="branch" disabled required data-branch-select>
        <option>Enter a repository URL first</option>
      </select>
    </div>
    <p class="form-hint" data-branch-message>Branches load after the repository URL is valid.</p>
  </div>
</section>
