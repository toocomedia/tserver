<section class="unboxed-step-container" data-wizard-panel="1">
  <div class="unboxed-step-header">
    <span>Step 1: Connect Git Repository</span>
    <span class="badge-pill">Safe Inspection Mode</span>
  </div>
  <p class="form-hint">Enter a Git URL to load its default branch and available branches.</p>

  <div class="form-group wizard-grid-2-1">
    <div>
      <label class="form-label" for="repository_url">Repository URL</label>
      <input class="form-input form-input--code" id="repository_url" name="repository_url" type="url" placeholder="https://github.com/owner/project.git" autocomplete="url" autocapitalize="none" spellcheck="false" required data-repository-url>
      <p class="form-hint">The panel only reads repository metadata and source files.</p>
    </div>
    <div>
      <label class="form-label" for="branch">Branch</label>
      <div class="form-select-wrap">
        <select class="form-select" id="branch" name="branch" disabled required data-branch-select>
          <option>Enter a repository URL first</option>
        </select>
      </div>
      <p class="form-hint" data-branch-message>Branches load after the repository URL is valid.</p>
    </div>
  </div>
</section>
