<section class="unboxed-step-container" data-wizard-panel="3" hidden>
  <div class="unboxed-step-header">
    <span>Step 3: Runtime Commands & Managed Database</span>
    <span class="badge-pill">Review Required</span>
  </div>
  <p class="form-hint">Review detected commands and database connection.</p>

  <div class="form-group">
    <label class="form-label" for="build_command">Build command</label>
    <input class="form-input form-input--code" id="build_command" name="build_command" required>
  </div>
  <div class="form-group">
    <label class="form-label" for="start_command">Start command</label>
    <input class="form-input form-input--code" id="start_command" name="start_command" required>
  </div>
  <div class="form-group">
    <label class="form-label" for="postgres_mode">PostgreSQL database</label>
    <div class="form-select-wrap">
      <select class="form-select" id="postgres_mode" name="postgres_mode" data-postgres-mode>
        <option value="none" selected>No managed database</option>
        <option value="create">Create managed PostgreSQL database</option>
        {% if supabase_projects %}<option value="supabase" data-supabase-option hidden>Use Supabase PostgreSQL</option>{% endif %}
        <option value="external">Use external DATABASE_URL</option>
      </select>
    </div>
    <p class="form-hint" data-database-hint>No database was detected.</p>
  </div>
  <div class="form-group" data-external-database hidden>
    <label class="form-label" for="database_url">External DATABASE_URL</label>
    <input class="form-input form-input--code" id="database_url" name="database_url" type="password" autocomplete="off">
  </div>
  {% if supabase_projects %}<div class="form-group" data-supabase-picker hidden>
    <label class="form-label" for="supabase_project_id">Supabase project</label>
    <div class="form-select-wrap">
      <select class="form-select" id="supabase_project_id" name="supabase_project_id" data-supabase-project>
        <option value="">Select Supabase project</option>
        {% for project in supabase_projects %}<option value="{{ project.id }}">{{ project.name }} ({{ project.db_host }})</option>{% endfor %}
      </select>
    </div>
    <p class="form-hint">Panel creates a dedicated database and user, then adds its DATABASE_URL.</p>
  </div>
  {% endif %}
  <div class="alert alert--danger" data-configuration-error hidden></div>
</section>
