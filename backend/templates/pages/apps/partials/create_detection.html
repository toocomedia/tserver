<section class="unboxed-step-container" data-wizard-panel="2" hidden>
  <div class="unboxed-step-header">
    <span>{{ _('step_2_auto_detection_summary') }}</span>
    <span class="badge-pill badge-pill--accent">{{ _('project_inspection') }}</span>
  </div>
  <p class="form-hint" data-detection-summary>{{ _('inspecting_the_selected_git_branch_safel') }}</p>

  <div class="d-flex gap-sm align-center" data-detection-loading hidden>
    <span class="step-spinner" aria-hidden="true"></span>
    <span>{{ _('reading_project_files') }}</span>
  </div>

  <div class="alert alert--danger" data-detection-error hidden>
    <span data-detection-error-text></span>
    <button class="btn btn--danger btn--sm" type="button" data-detection-retry>{{ _('retry_detection') }}</button>
  </div>

  <div data-detection-results hidden>
    <div class="info-row"><span class="info-row__label">{{ _('framework') }}</span><span class="info-row__value" data-detection-framework></span></div>
    <div class="info-row"><span class="info-row__label">{{ _('entrypoint') }}</span><span class="info-row__value mono" data-detection-entrypoint></span></div>
    <div class="info-row"><span class="info-row__label">{{ _('package_manager') }}</span><span class="info-row__value" data-detection-package></span></div>
    <div class="info-row"><span class="info-row__label">{{ _('environment_keys_1') }}</span><span class="info-row__value" data-detection-environment></span></div>
    <div class="info-row"><span class="info-row__label">{{ _('database_evidence') }}</span><span class="info-row__value" data-detection-database></span></div>
    <div class="alert alert--warning" data-detection-warnings hidden><span data-detection-warnings-text></span></div>
  </div>
</section>
