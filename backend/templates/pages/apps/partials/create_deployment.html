<section class="app-wizard__panel" data-wizard-panel="4" hidden>
  <header class="app-wizard__panel-header">
    <h2>Deployment</h2>
    <p data-deployment-summary>Creating the deployment.</p>
  </header>
  <div class="info-row"><span class="info-row__label">Current stage</span><span class="info-row__value" data-deployment-stage>Queued</span></div>
  <div class="terminal-fluid" data-deployment-output aria-live="polite"></div>
  <div class="alert alert--danger" data-deployment-error hidden>
    <span data-deployment-error-text></span>
    <a class="btn btn--danger btn--sm" data-deployment-details>Open app details</a>
  </div>
  <a class="btn btn--primary" data-deployment-dashboard hidden>Open App Dashboard</a>
</section>
