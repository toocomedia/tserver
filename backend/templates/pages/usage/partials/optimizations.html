<!-- SERVER OPTIMIZATIONS -->
<div class="section mb-xl">
  <div class="section__header">
    <h3 style="display:flex; align-items:center; gap:8px;">
      <svg viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px; height:15px;"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>
      {{ _('server_optimizations') }}
    </h3>
  </div>
  <div class="section__body" data-live-section="optimizations">
    <div class="optimization-list">

      <!-- Control 1: Low-RAM Optimization Mode -->
      <div class="optimization-row">
        <div class="optimization-row__copy">
          <div class="optimization-row__title">
            <strong>{{ _('low_ram_optimization_mode') }}</strong>
          </div>
          <div class="text-small text-muted">{{ _('zram_compressed_swap_500mb_swappiness_10') }}</div>
        </div>
        <div class="optimization-row__control">
          <div class="layout-switcher layout-switcher--two" id="group-opt-mode" role="group" aria-label="Low-RAM Optimization Mode">
            <button type="button" class="layout-switcher__btn is-active" id="btn-opt-off" data-optimization-action="ram-off">{{ _('inactive') }}</button>
            <button type="button" class="layout-switcher__btn" id="btn-opt-on" data-optimization-action="ram-on">{{ _('active_1') }}</button>
          </div>
        </div>
      </div>

      <!-- Control 2: Single Nginx Worker Mode -->
      <div class="optimization-row">
        <div class="optimization-row__copy">
          <div class="optimization-row__title">
            <strong>{{ _('single_nginx_worker_mode') }}</strong>
          </div>
          <div class="text-small text-muted">{{ _('forces_nginx_worker_processes_to_1_recom') }}</div>
        </div>
        <div class="optimization-row__control">
          <div class="layout-switcher layout-switcher--two" id="group-nginx-worker" role="group" aria-label="Single Nginx Worker Mode">
            <button type="button" class="layout-switcher__btn is-active" id="btn-ngx-auto" data-optimization-action="nginx-auto">{{ _('auto') }}</button>
            <button type="button" class="layout-switcher__btn" id="btn-ngx-single" data-optimization-action="nginx-single">{{ _('1_worker') }}</button>
          </div>
        </div>
      </div>

      <!-- Control 3: Advanced Server Tuning -->
      <div class="optimization-row">
        <div class="optimization-row__copy">
          <div class="optimization-row__title">
            <strong>{{ _('advanced_server_tuning') }}</strong>
          </div>
          <div class="text-small text-muted mb-sm">{{ _('smart_background_service_disabling_tcp_b') }}</div>
          <div class="text-small mt-sm optimization-checks" id="advanced-tuning-checks">
          </div>
        </div>
        <div class="optimization-row__control">
          <div class="layout-switcher layout-switcher--two" id="group-advanced-tuning" role="group" aria-label="Advanced Server Tuning">
            <button type="button" class="layout-switcher__btn is-active" id="btn-adv-off" data-optimization-action="advanced-off">{{ _('inactive') }}</button>
            <button type="button" class="layout-switcher__btn" id="btn-adv-on" data-optimization-action="advanced-on">{{ _('active_1') }}</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
