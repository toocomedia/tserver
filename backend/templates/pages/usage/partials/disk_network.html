<!-- DISK MOUNTS & STORAGE -->
<div class="section mb-xl">
  <div class="section__header">
    <h3 style="display:flex; align-items:center; gap:8px;">
      <svg viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px; height:15px;"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
      {{ _('disk_storage_mount_points') }}
    </h3>
  </div>
  <div class="section__body" id="disk-section" data-live-section="disk">
    <div class="info-row">
      <span class="info-row__label text-muted">{{ _('loading_storage_diagnostics') }}</span>
    </div>
  </div>
</div>

<!-- NETWORK I/O METRICS -->
<div class="section mb-xl">
  <div class="section__header">
    <h3 style="display:flex; align-items:center; gap:8px;">
      <svg viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px; height:15px;"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
      {{ _('network_interfaces_bandwidth_i_o') }}
    </h3>
  </div>
  <div class="section__body" data-live-section="net">
    <div class="info-row">
      <span class="info-row__label">{{ _('total_sent') }}</span>
      <span class="info-row__value" id="net-sent">—</span>
    </div>
    <div class="info-row">
      <span class="info-row__label">{{ _('total_received') }}</span>
      <span class="info-row__value" id="net-recv">—</span>
    </div>
    <div class="info-row">
      <span class="info-row__label">{{ _('packets_sent') }}</span>
      <span class="info-row__value text-muted" id="net-pkts-sent">—</span>
    </div>
    <div class="info-row">
      <span class="info-row__label">{{ _('packets_recv') }}</span>
      <span class="info-row__value text-muted" id="net-pkts-recv">—</span>
    </div>
  </div>
</div>
