<!-- CPU & MEMORY DIAGNOSTICS -->
<div class="section mb-xl">
  <div class="section__header">
    <h3 style="display:flex; align-items:center; gap:8px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px; height:15px;"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/></svg>
      CPU &amp; Memory Diagnostics
    </h3>
  </div>
  <div class="section__body" data-live-section="cpumem">
    <!-- Notice banner for < 2GB RAM -->
    <div id="usage-low-ram-alert" class="recommendation-card mb-md" hidden>
      <div class="recommendation-card__copy">
        <strong>Optimization Recommended:</strong> Your server has <span id="usage-ram-val">less than 2.0 GB</span> RAM. Enable Low-RAM Optimization Mode to activate zRAM, tune the kernel, and lower the memory footprint.
      </div>
      <div class="recommendation-card__actions"><button class="btn btn--sm btn--primary" id="btn-quick-optimize-usage" data-optimization-action="ram-on">Enable</button></div>
    </div>

    <div class="info-row">
      <span class="info-row__label">CPU Usage</span>
      <span class="info-row__value">
        <div class="usage-bar-wrap">
          <div class="usage-bar"><div class="usage-bar__fill" id="bar-cpu" style="width:0%"></div></div>
          <span class="usage-bar__pct" id="pct-cpu">—</span>
        </div>
      </span>
    </div>

    <div class="info-row">
      <span class="info-row__label">RAM</span>
      <span class="info-row__value">
        <div class="usage-bar-wrap">
          <div class="usage-bar"><div class="usage-bar__fill" id="bar-ram" style="width:0%"></div></div>
          <span class="usage-bar__pct" id="pct-ram">—</span>
        </div>
      </span>
    </div>

    <div class="info-row">
      <span class="info-row__label">RAM Detail</span>
      <span class="info-row__value text-muted" id="ram-detail">—</span>
    </div>

    <div class="info-row">
      <span class="info-row__label">Swap</span>
      <span class="info-row__value">
        <div class="usage-bar-wrap">
          <div class="usage-bar"><div class="usage-bar__fill" id="bar-swap" style="width:0%"></div></div>
          <span class="usage-bar__pct" id="pct-swap">—</span>
        </div>
      </span>
    </div>

    <div class="info-row">
      <span class="info-row__label">Swap Detail</span>
      <span class="info-row__value text-muted" id="swap-detail">—</span>
    </div>
  </div>
</div>

<aside id="usage-resource-guard-alert" class="recommendation-card recommendation-card--floating" role="status" hidden>
  <div class="recommendation-card__copy" id="usage-resource-guard-copy"></div>
  <div class="recommendation-card__actions">
    <a class="btn btn--sm btn--primary" href="/settings/">Open Settings</a>
    <button type="button" class="btn btn--sm btn--secondary" data-resource-guard-dismiss="forever">Don’t show again</button>
    <button type="button" class="btn btn--ghost btn--sm" data-resource-guard-dismiss="close" aria-label="Close Resource Guard notice">×</button>
  </div>
</aside>
