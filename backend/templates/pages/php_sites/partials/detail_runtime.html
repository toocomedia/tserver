<div class="section mb-xl">
  <h3 class="section__title mb-md">PHP-FPM Runtime Version</h3>
  <form id="form-change-runtime" class="form-row-grid">
    <div class="form-row-grid__label">
      <label for="select-runtime-version" class="form-label">PHP Version</label>
      <div class="form-hint">Switch FPM version safely without downtime.</div>
    </div>
    <div class="form-row-grid__input d-flex gap-md align-items-center">
      <select id="select-runtime-version" name="php_version" class="form-select" style="max-width: 200px;">
        {% for v in options.php_versions %}
          <option value="{{ v }}" {% if v == site.php_version %}selected{% endif %}>PHP {{ v }}</option>
        {% endfor %}
      </select>
      <button type="submit" class="btn btn--primary" id="btn-save-runtime">Switch Version</button>
    </div>
  </form>
</div>

<div class="section mb-xl">
  <h3 class="section__title mb-md">Document Root Path</h3>
  <form id="form-change-docroot" class="form-row-grid">
    <div class="form-row-grid__label">
      <label for="input-docroot" class="form-label">Relative Document Root</label>
      <div class="form-hint">Path relative to /var/www/{{ site.domain_name }}/ (e.g. public, web, htdocs/public)</div>
    </div>
    <div class="form-row-grid__input d-flex gap-md align-items-center">
      <input type="text" id="input-docroot" name="document_root" class="form-input" value="{{ site.document_root }}" required style="max-width: 300px;">
      <button type="submit" class="btn btn--secondary" id="btn-save-docroot">Update Root</button>
    </div>
  </form>
</div>
