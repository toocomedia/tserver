<!-- Operation Progress Overlay Modal -->
<div id="operation-modal" class="modal-backdrop" style="display: none;">
  <div class="modal modal--md">
    <div class="modal__header">
      <h3 class="modal__title" id="op-modal-title">Executing Operation...</h3>
    </div>
    <div class="modal__body text-center" style="padding: 32px 20px;">
      <div class="spinner spinner--lg mb-md" id="op-spinner" style="margin: 0 auto 16px;"></div>
      <div id="op-stage-badge" class="status-badge status-badge--info mb-sm">INITIALIZING</div>
      <p id="op-message-text" class="text-muted font-body mb-md">Preparing environment...</p>
      <div id="op-error-box" class="alert alert--danger" style="display: none; text-align: left; margin-top: 16px;"></div>
    </div>
    <div class="modal__footer" id="op-modal-footer" style="display: none;">
      <button type="button" class="btn btn--secondary" id="btn-close-op-modal">Close</button>
    </div>
  </div>
</div>
