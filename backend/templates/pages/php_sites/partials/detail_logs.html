<div class="section mb-xl">
  <div class="d-flex justify-content-between align-items-center mb-md">
    <div class="d-flex gap-sm align-items-center">
      <h3 class="section__title">Website Logs</h3>
      <select id="log-stream-select" class="form-select" style="width: 140px;">
        <option value="access">Access Log</option>
        <option value="nginx_error">Nginx Error Log</option>
        <option value="php">PHP-FPM Log</option>
      </select>
      <select id="log-lines-select" class="form-select" style="width: 100px;">
        <option value="100">100 lines</option>
        <option value="200" selected>200 lines</option>
        <option value="500">500 lines</option>
      </select>
    </div>
    <button type="button" class="btn btn--secondary btn--sm" id="btn-fetch-logs">Refresh Logs</button>
  </div>

  <div class="log-container-box" style="background: #0b0c0b; color: #c7f464; font-family: monospace; font-size: 12px; padding: 16px; min-height: 300px; max-height: 500px; overflow-y: auto; white-space: pre-wrap;" id="log-output-content">
Select log stream and click Refresh Logs...
  </div>
</div>
