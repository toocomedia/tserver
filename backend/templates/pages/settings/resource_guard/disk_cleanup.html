<section class="section mb-xl" aria-labelledby="resource-guard-disk-cleanup-title">
  <div class="section__header"><h3 id="resource-guard-disk-cleanup-title">{{ _('disk_cleanup') }}</h3></div>
  <div class="section__body">
    <p class="form-hint mb-md">{{ _('find_stale_build_directories_dangling_im') }}</p>
    <div class="form-actions mb-md"><button type="button" class="btn btn--secondary" id="btn-scan-resource-guard-disk">{{ _('scan_for_reclaimable_space') }}</button></div>
    <div id="resource-guard-disk-results" hidden>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>{{ _('type') }}</th><th>{{ _('description') }}</th><th>{{ _('size') }}</th><th>{{ _('age') }}</th><th>{{ _('protected') }}</th><th><label class="form-check"><input type="checkbox" id="resource-guard-disk-select-all"> {{ _('select_all') }}</label></th></tr></thead>
          <tbody id="resource-guard-disk-items"></tbody>
        </table>
      </div>
      <div class="form-actions mt-md">
        <span id="resource-guard-disk-total" class="form-hint">{{ _('0_mb_selected') }}</span>
        <button type="button" class="btn btn--danger" id="btn-clean-resource-guard-disk" disabled>{{ _('free_selected_space') }}</button>
      </div>
      <p id="resource-guard-disk-result" class="form-hint mt-md" role="status"></p>
    </div>
  </div>
</section>
