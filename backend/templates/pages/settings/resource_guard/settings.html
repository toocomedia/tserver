<section class="section mb-xl" aria-labelledby="resource-guard-title">
  <div class="section__header"><h3 id="resource-guard-title">{{ _('resource_guard') }}</h3></div>
  <div class="section__body">
    <p class="form-hint mb-md">{{ _('protects_vps_by_blocking_or_cancelling_p') }}</p>
    <div id="resource-guard-status" class="info-row mb-md"><span class="info-row__label">{{ _('status') }}</span><span class="info-row__value">{{ _('loading_1') }}</span></div>
    <div class="resource-guard-settings-group">
      <h4 class="resource-guard-settings-group__title">{{ _('operation_blocking') }}</h4>
      <div class="form-group mb-md">
        <label class="form-label" for="resource_guard_reserve">{{ _('protected_ram_reserve_mb') }}</label>
        <input class="form-input" id="resource_guard_reserve" type="number" min="100" max="2048" value="400">
        <p class="form-hint">{{ _('ram_kept_off_limits_at_all_times_every_o') }}</p>
      </div>
    </div>
    <div class="resource-guard-settings-group">
      <h4 class="resource-guard-settings-group__title">{{ _('visual_warnings') }}</h4>
      <div class="form-group mb-md">
        <label class="form-label" for="resource_guard_limit">{{ _('ram_warning_threshold') }}</label>
        <input class="form-input" id="resource_guard_limit" type="number" min="75" max="95" value="90">
        <p class="form-hint">{{ _('when_total_vps_ram_usage_crosses_this_pe') }}</p>
      </div>
      <div class="form-group mb-md">
        <label class="form-label" for="resource_guard_mode">{{ _('mode') }}</label>
        <div class="form-select-wrap"><select class="form-select" id="resource_guard_mode"><option value="auto">{{ _('automatic_below_2_gb') }}</option><option value="enabled">{{ _('always_enabled') }}</option><option value="disabled">{{ _('disabled') }}</option></select></div>
      </div>
    </div>
    <div class="form-actions"><button type="button" class="btn btn--primary" id="btn-save-resource-guard">{{ _('save_resource_guard') }}</button></div>
  </div>
</section>
