<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VPS Control Panel login">
  <meta name="csrf-token" content="{{ csrf_token(request) }}">
  <title>Login — {{ PANEL_NAME }}</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="shortcut icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/components/buttons.css">
  <link rel="stylesheet" href="/static/css/components/forms.css">
  <link rel="stylesheet" href="/static/css/components/alerts.css">
  <link rel="stylesheet" href="/static/css/utils.css">
  <style>
    :root {
      --color-box-bg: rgba(20, 26, 36, 0.95);
      --color-box-border: rgba(255, 255, 255, 0.14);
      --color-input-bg: rgba(255, 255, 255, 0.04);
      --color-input-line: rgba(255, 255, 255, 0.18);
      --color-input-focus-line: #C7F464;
      --color-accent-3d: #92CD26;
      --shape-fill-dark: rgba(255, 255, 255, 0.06);
      --shape-fill-accent: rgba(199, 244, 100, 0.07);
      --shape-border-dark: rgba(255, 255, 255, 0.08);
      --shape-border-accent: rgba(199, 244, 100, 0.12);
    }

    [data-theme="amoled"] {
      --color-box-bg: #0C0E12;
      --color-box-border: rgba(255, 255, 255, 0.16);
      --color-input-bg: rgba(255, 255, 255, 0.05);
      --shape-fill-dark: rgba(255, 255, 255, 0.075);
      --shape-fill-accent: rgba(199, 244, 100, 0.08);
    }

    [data-theme="light"] {
      --color-box-bg: #FFFFFF;
      --color-box-border: rgba(15, 23, 32, 0.14);
      --color-input-bg: rgba(0, 0, 0, 0.035);
      --color-input-line: rgba(0, 0, 0, 0.15);
      --color-input-focus-line: #0F1720;
      --color-accent-3d: #8AC220;
      --shape-fill-dark: rgba(15, 23, 32, 0.05);
      --shape-fill-accent: rgba(199, 244, 100, 0.3);
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--color-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 40px 24px;
      box-sizing: border-box;
    }

    /* Oversized Background Shapes (Toggl Style) */
    .bg-canvas {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .shape-square {
      position: absolute;
      width: 520px;
      height: 520px;
      top: -140px;
      left: -130px;
      border-radius: 56px !important;
      background-color: var(--shape-fill-accent);
      border: 1px solid var(--shape-border-accent) !important;
      transform: rotate(22deg);
    }
    .shape-torus {
      position: absolute;
      width: 580px;
      height: 580px;
      top: -170px;
      right: -140px;
      border-radius: 50% !important;
      border: 56px solid var(--shape-fill-dark) !important;
      outline: 1px solid var(--shape-border-dark);
      transform: rotate(-12deg);
    }
    .shape-circle {
      position: absolute;
      width: 560px;
      height: 560px;
      bottom: -200px;
      left: -160px;
      border-radius: 50% !important;
      background-color: var(--shape-fill-dark);
      border: 1px solid var(--shape-border-dark) !important;
    }
    .shape-triangle {
      position: absolute;
      width: 540px;
      height: 540px;
      bottom: -150px;
      right: -120px;
      background-color: var(--shape-fill-accent);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      transform: rotate(-28deg);
    }

    /* Single Icon Theme Toggle Button */
    .theme-toggle-btn {
      position: fixed;
      top: 24px;
      right: 24px;
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 8px !important;
      background-color: var(--color-box-bg);
      border: 1px solid var(--color-box-border) !important;
      color: var(--color-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
      z-index: 100;
    }
    .theme-toggle-btn:hover {
      transform: scale(1.05);
    }

    /* Minimal Floating Card Container */
    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 340px;
      margin: 0 auto;
    }

    .login-card {
      background-color: var(--color-box-bg);
      border: 1px solid var(--color-box-border) !important;
      border-radius: 18px !important;
      padding: 52px 32px 56px;
      box-shadow: none !important;
    }

    /* Logo & Header */
    .brand-section {
      text-align: center;
      margin-bottom: 36px;
    }
    .brand-logo-img {
      height: 58px;
      width: auto;
      object-fit: contain;
      margin-bottom: 12px;
    }
    .brand-subtitle {
      font-size: 13px;
      color: var(--color-muted);
      font-weight: 400;
      line-height: 1.4;
      margin: 0;
    }

    /* Form Fields & Spacing */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-family: var(--font-main);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text);
    }

    /* Custom Input Style (Sharp 0px Corners) */
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .form-input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: none !important;
      border-radius: 0 !important;
      background-color: var(--color-input-bg);
      border-bottom: 2px solid var(--color-input-line) !important;
      font-family: var(--font-main);
      font-size: 14px;
      color: var(--color-text);
      transition: all 0.2s ease;
      box-shadow: none !important;
    }
    .form-input:focus {
      border-bottom-color: var(--color-input-focus-line) !important;
      background-color: rgba(255, 255, 255, 0.07);
    }
    .eye-btn {
      position: absolute;
      right: 8px;
      background: transparent;
      border: none !important;
      color: var(--color-muted);
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 0 !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .eye-btn:hover {
      color: var(--color-text);
    }

    /* 3D Tactile Submit Button */
    .btn-3d-primary {
      width: 100%;
      height: 46px;
      margin-top: 20px;
      border: none !important;
      border-radius: 0 !important;
      background-color: var(--color-accent);
      color: #111111;
      font-family: var(--font-main);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 4px solid var(--color-accent-3d) !important;
      position: relative;
      top: 0;
      transition: all 0.08s ease-in-out;
      box-shadow: none !important;
    }
    .btn-3d-primary:hover {
      background-color: var(--color-accent-2);
    }
    .btn-3d-primary:active {
      top: 3px;
      border-bottom-width: 1px !important;
    }
  </style>
</head>
<body>

  <!-- Background Geometric Shapes -->
  <div class="bg-canvas">
    <div class="shape-square"></div>
    <div class="shape-torus"></div>
    <div class="shape-circle"></div>
    <div class="shape-triangle"></div>
  </div>

  <!-- Single Icon Theme Toggle Button -->
  <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle Theme" aria-label="Toggle Theme">
    <!-- Icon injected via JS -->
  </button>

  <!-- Centered Login Box -->
  <div class="login-container">
    <div class="login-card">
      
      <!-- Brand Header -->
      <div class="brand-section">
        <img src="/static/images/logobarq.png" alt="{{ PANEL_NAME }}" class="brand-logo-img">
        <p class="brand-subtitle">High-performance server management</p>
      </div>

      {% if error %}
      <div class="alert alert--danger mb-lg" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login" class="login-form" id="login-form" autocomplete="on"{% if locked %} data-locked="1"{% endif %}>
        {% include "partials/csrf_field.html" %}
        <input type="hidden" name="next" value="{{ next or '/' }}">

        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input
            class="form-input{% if error %} form-input--error{% endif %}"
            type="text"
            id="username"
            name="username"
            value="{{ username or '' }}"
            required
            {% if not locked %}autofocus{% endif %}
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            {% if locked %}disabled{% endif %}
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <input
              class="form-input{% if error %} form-input--error{% endif %}"
              type="password"
              id="password"
              name="password"
              required
              autocomplete="current-password"
              {% if locked %}disabled{% endif %}
            >
            <button type="button" class="eye-btn" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
              <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button
          type="submit"
          id="login-submit"
          class="btn-3d-primary"
          {% if locked %}disabled aria-disabled="true"{% endif %}
        >
          {% if locked %}Try again later{% else %}Sign in{% endif %}
        </button>
      </form>

    </div>
  </div>

  <script>
    const themes = ['light', 'dark', 'amoled'];
    let currentTheme = 'dark';

    const icons = {
      light: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`,
      dark: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`,
      amoled: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>`
    };

    function applyTheme(theme) {
      currentTheme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      const btn = document.getElementById('theme-btn');
      if (btn) {
        btn.innerHTML = icons[theme];
        btn.title = `Theme: ${theme.toUpperCase()}`;
      }
    }

    function toggleTheme() {
      const nextIndex = (themes.indexOf(currentTheme) + 1) % themes.length;
      applyTheme(themes[nextIndex]);
    }

    (function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme && themes.includes(savedTheme)) {
        applyTheme(savedTheme);
      } else {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(prefersDark ? 'dark' : 'light');
      }
    })();

    function togglePasswordVisibility() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (!input || !icon) return;
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
      } else {
        input.type = 'password';
        icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
      }
    }

    // Rate-limit / lockout and double-click prevention
    (function () {
      var form = document.getElementById("login-form");
      var btn = document.getElementById("login-submit");
      if (!form || !btn) return;

      if (form.getAttribute("data-locked") === "1") {
        form.addEventListener("submit", function (e) {
          e.preventDefault();
        });
        return;
      }

      form.addEventListener("submit", function (e) {
        if (form.getAttribute("data-submitting") === "1") {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
        form.setAttribute("data-submitting", "1");
        btn.disabled = true;
        btn.setAttribute("aria-disabled", "true");
        btn.textContent = "Signing in…";
      });
    })();
  </script>
</body>
</html>
