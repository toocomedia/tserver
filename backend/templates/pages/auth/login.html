<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VPS Control Panel login">
  <meta name="csrf-token" content="{{ csrf_token(request) }}">
  <title>Login — {{ PANEL_NAME }}</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="shortcut icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/components/buttons.css">
  <link rel="stylesheet" href="/static/css/components/forms.css">
  <link rel="stylesheet" href="/static/css/components/alerts.css">
  <link rel="stylesheet" href="/static/css/utils.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--color-bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
    }

    /* Modern Split-Screen Layout */
    .split-login {
      display: flex;
      min-height: 100vh;
      width: 100vw;
    }

    /* Left Pane: Logo & One Simple Description on Technical Dot Pattern */
    .split-login__pattern-side {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background-color: var(--color-surface);
      /* Subtle CSS Dot Pattern using native line color */
      background-image: radial-gradient(circle, var(--color-line) 1.5px, transparent 1.5px);
      background-size: 28px 28px;
      padding: 40px;
      border-right: 1px solid var(--color-line);
      box-sizing: border-box;
    }

    /* Right Pane: Clean Borderless Form */
    .split-login__form-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background-color: var(--color-bg);
      padding: 40px;
      box-sizing: border-box;
    }

    /* Form Container: ZERO borders, zero box shadows */
    .borderless-form-wrap {
      width: 100%;
      max-width: 340px;
    }

    /* Small Icon Theme Toggle Switch */
    .theme-toggle-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 6px;
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      color: var(--color-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      z-index: 10;
    }
    .theme-toggle-btn:hover {
      background: var(--color-header-bg-bar);
      border-color: var(--color-text);
    }

    /* Responsive mobile stacking */
    @media (max-width: 850px) {
      .split-login {
        flex-direction: column;
      }
      .split-login__pattern-side {
        min-height: 220px;
        flex: none;
        border-right: none;
        border-bottom: 1px solid var(--color-line);
      }
      .split-login__form-side {
        flex: 1;
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>

  <!-- Simple Small Icon Switch by Click -->
  <button class="theme-toggle-btn" onclick="toggleTheme()" title="Switch Theme" id="theme-btn" aria-label="Switch Theme">
    <!-- Icon injected via JavaScript based on active mode -->
  </button>

  <div class="split-login">

    <!-- LEFT SIDE: Logo & One Simple Description on Technical Dot Pattern -->
    <div class="split-login__pattern-side">
      <div style="text-align: center; max-width: 280px;">
        <img src="/static/images/logobarq.png" alt="{{ PANEL_NAME }}" style="height: 56px; width: auto; object-fit: contain; margin-bottom: 20px;">
        <p style="font-size: 13px; color: var(--color-muted); margin: 0; line-height: 1.5;">
          High-performance server management and reverse proxy administration.
        </p>
      </div>
    </div>

    <!-- RIGHT SIDE: Borderless Login Form -->
    <div class="split-login__form-side">
      <div class="borderless-form-wrap">
        
        <h2 style="font-size: 24px; font-weight: 800; color: var(--color-text); margin: 0 0 28px 0;">Sign in</h2>

        {% if error %}
        <div class="alert alert--danger mb-lg" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login" class="form" id="login-form" autocomplete="on"{% if locked %} data-locked="1"{% endif %}>
          {% include "partials/csrf_field.html" %}
          <input type="hidden" name="next" value="{{ next or '/' }}">

          <div class="form-group" style="margin-bottom: 20px;">
            <label class="form-label" for="username" style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;">Username</label>
            <input
              class="form-input{% if error %} form-input--error{% endif %}"
              type="text"
              id="username"
              name="username"
              value="{{ username or '' }}"
              required
              {% if not locked %}autofocus{% endif %}
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              {% if locked %}disabled{% endif %}
              style="margin-top: 6px; height: 42px;"
            >
          </div>

          <div class="form-group" style="margin-bottom: 28px;">
            <label class="form-label" for="password" style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;">Password</label>
            <input
              class="form-input{% if error %} form-input--error{% endif %}"
              type="password"
              id="password"
              name="password"
              required
              autocomplete="current-password"
              {% if locked %}disabled{% endif %}
              style="margin-top: 6px; height: 42px;"
            >
          </div>

          <button
            type="submit"
            id="login-submit"
            class="btn btn--primary"
            style="width: 100%; height: 44px; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em;"
            {% if locked %}disabled aria-disabled="true"{% endif %}
          >
            {% if locked %}Try again later{% else %}Sign in{% endif %}
          </button>
        </form>

      </div>
    </div>

  </div>

  <script>
    // Follow System Mode by default, allow cycling: light -> dark -> amoled -> light
    const themes = ['light', 'dark', 'amoled'];
    let currentTheme = 'dark';

    // SVG icons for each mode
    const icons = {
      light: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`,
      dark: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`,
      amoled: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>`
    };

    function applyTheme(theme) {
      currentTheme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      const btn = document.getElementById('theme-btn');
      if (btn) {
        btn.innerHTML = icons[theme];
        btn.title = `Current: ${theme.toUpperCase()} (Click to switch)`;
      }
    }

    function toggleTheme() {
      const nextIndex = (themes.indexOf(currentTheme) + 1) % themes.length;
      applyTheme(themes[nextIndex]);
    }

    // Initialize with system preference on load
    (function initTheme() {
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(prefersDark ? 'dark' : 'light');
    })();

    // Rate-limit / lockout and double-click prevention
    (function () {
      var form = document.getElementById("login-form");
      var btn = document.getElementById("login-submit");
      if (!form || !btn) return;

      if (form.getAttribute("data-locked") === "1") {
        form.addEventListener("submit", function (e) {
          e.preventDefault();
        });
        return;
      }

      form.addEventListener("submit", function (e) {
        if (form.getAttribute("data-submitting") === "1") {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
        form.setAttribute("data-submitting", "1");
        btn.disabled = true;
        btn.setAttribute("aria-disabled", "true");
        btn.textContent = "Signing in…";
      });

      btn.addEventListener("click", function (e) {
        if (form.getAttribute("data-submitting") === "1" || btn.disabled) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      });
    })();
  </script>
</body>
</html>
