<!DOCTYPE html>
<html lang="{{ get_lang() }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VPS Control Panel login - 2FA">
  <meta name="csrf-token" content="{{ csrf_token(request) }}">
  <title>{{ _('2fa_verification') }} — {{ PANEL_NAME }}</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="shortcut icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/css/main.css?v={{ range(1, 99999999) | random }}">
  <link rel="stylesheet" href="/static/css/components/buttons.css?v={{ range(1, 99999999) | random }}">
  <link rel="stylesheet" href="/static/css/components/forms.css?v={{ range(1, 99999999) | random }}">
  <link rel="stylesheet" href="/static/css/components/alerts.css?v={{ range(1, 99999999) | random }}">
  <link rel="stylesheet" href="/static/css/utils.css?v={{ range(1, 99999999) | random }}">
  <style>
    :root {
      --color-box-bg: rgba(20, 26, 36, 0.98);
      --color-box-border: rgba(255, 255, 255, 0.14);
      --color-input-bg: rgba(255, 255, 255, 0.06);
      --color-input-line: rgba(255, 255, 255, 0.24);
      --color-input-focus-line: #C7F464;
      --color-accent-3d: #92CD26;
      --shape-fill-dark: rgba(255, 255, 255, 0.05);
      --shape-fill-accent: rgba(199, 244, 100, 0.06);
      --shape-border-dark: rgba(255, 255, 255, 0.06);
      --shape-border-accent: rgba(199, 244, 100, 0.10);
    }

    [data-theme="amoled"] {
      --color-box-bg: #0C0E12;
      --color-box-border: rgba(255, 255, 255, 0.16);
      --color-input-bg: rgba(255, 255, 255, 0.07);
      --color-input-line: rgba(255, 255, 255, 0.24);
      --shape-fill-dark: rgba(255, 255, 255, 0.06);
      --shape-fill-accent: rgba(199, 244, 100, 0.06);
    }

    [data-theme="charcoal"] {
      --color-box-bg: #26262B;
      --color-box-border: rgba(255, 255, 255, 0.15);
      --color-input-bg: rgba(255, 255, 255, 0.06);
      --color-input-line: rgba(255, 255, 255, 0.22);
      --shape-fill-dark: rgba(255, 255, 255, 0.04);
      --shape-fill-accent: rgba(199, 244, 100, 0.06);
    }

    [data-theme="light"] {
      --color-box-bg: #FFFFFF;
      --color-box-border: rgba(15, 23, 32, 0.14);
      --color-input-bg: rgba(0, 0, 0, 0.04);
      --color-input-line: rgba(0, 0, 0, 0.2);
      --color-input-focus-line: #0F1720;
      --color-accent-3d: #8AC220;
      --shape-fill-dark: rgba(15, 23, 32, 0.04);
      --shape-fill-accent: rgba(199, 244, 100, 0.25);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--color-bg);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 48px 8vw 48px 48px;
      box-sizing: border-box;
    }

    @media (max-width: 900px) {
      body {
        padding: 32px 20px;
        justify-content: center;
        align-items: center;
      }
    }

    /* Oversized Background Shapes (Toggl Style) */
    .bg-canvas {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .shape-square {
      position: absolute;
      width: 520px;
      height: 520px;
      top: -140px;
      left: -130px;
      border-radius: 56px !important;
      background-color: var(--shape-fill-accent);
      border: 1px solid var(--shape-border-accent) !important;
      transform: rotate(22deg);
    }
    .shape-torus {
      position: absolute;
      width: 580px;
      height: 580px;
      top: -170px;
      right: -140px;
      border-radius: 50% !important;
      border: 56px solid var(--shape-fill-dark) !important;
      outline: 1px solid var(--shape-border-dark);
      transform: rotate(-12deg);
    }
    .shape-circle {
      position: absolute;
      width: 560px;
      height: 560px;
      bottom: -200px;
      left: -160px;
      border-radius: 50% !important;
      background-color: var(--shape-fill-dark);
      border: 1px solid var(--shape-border-dark) !important;
    }
    .shape-triangle {
      position: absolute;
      width: 540px;
      height: 540px;
      bottom: -150px;
      right: -120px;
      background-color: var(--shape-fill-accent);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      transform: rotate(-28deg);
    }

    /* Top Controls Bar (Theme + Language) */
    .top-controls {
      position: fixed;
      top: 28px;
      left: 36px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
    }

    .theme-toggle-btn {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 0 !important;
      background-color: var(--color-surface);
      border: none !important;
      color: var(--color-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    .theme-toggle-btn:hover {
      transform: scale(1.05);
    }

    .lang-select-box {
      height: 40px;
      padding: 0 12px;
      background: var(--color-surface);
      border: none !important;
      color: var(--color-text);
      border-radius: 0 !important;
      font-family: var(--font-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }

    /* Elegant Floating Card Container */
    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      margin: 0;
    }

    .login-card {
      background-color: var(--color-surface);
      border: none !important;
      border-radius: 0 !important;
      padding: 44px 38px 48px;
      min-height: auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.45), 0 4px 16px rgba(0, 0, 0, 0.2) !important;
      position: relative;
    }

    [data-theme="light"] .login-card {
      box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.05) !important;
    }

    /* Brand Header */
    .brand-section {
      text-align: left;
      margin-bottom: 32px;
      cursor: pointer;
    }
    .brand-logo-img {
      height: 44px;
      width: auto;
      object-fit: contain;
      margin-bottom: 6px;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .brand-section:hover .brand-logo-img {
      transform: scale(1.03);
    }
    .brand-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-text);
      margin: 0 0 4px 0;
    }
    
    .brand-subtitle {
      font-size: 13px;
      color: var(--color-muted);
      font-weight: 500;
      line-height: 1.4;
      margin: 4px 0 0 0;
      opacity: 0.9;
    }

    /* Form Fields & Spacing */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
      justify-content: center;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-label {
      font-family: var(--font-main);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--color-text);
    }

    /* Custom 6-Digit Monospace OTP Input Style */
    .form-input-code {
      width: 100%;
      height: 52px;
      padding: 0 14px;
      border: none !important;
      border-radius: 0 !important;
      background-color: var(--color-input-bg);
      border-bottom: 2px solid var(--color-input-line) !important;
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.35em;
      text-align: center;
      color: var(--color-text);
      transition: all 0.2s ease;
      box-shadow: none !important;
      box-sizing: border-box;
    }
    .form-input-code::placeholder {
      color: var(--color-muted);
      opacity: 0.4;
      letter-spacing: 0.2em;
    }
    .form-input-code:focus {
      border-bottom-color: var(--color-accent) !important;
      background-color: rgba(255, 255, 255, 0.09);
    }
    [data-theme="light"] .form-input-code:focus {
      background-color: rgba(0, 0, 0, 0.05);
    }

    /* 3D Tactile Submit Button */
    .btn-3d-primary {
      width: 100%;
      height: 50px;
      margin-top: 10px;
      border: none !important;
      border-radius: 0 !important;
      background-color: var(--color-accent);
      color: #111111;
      font-family: var(--font-main);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 4px solid var(--color-accent-3d) !important;
      position: relative;
      top: 0;
      transition: all 0.08s ease-in-out;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15) !important;
    }
    .btn-3d-primary:hover {
      background-color: var(--color-accent-2);
    }
    .btn-3d-primary:active {
      top: 3px;
      border-bottom-width: 1px !important;
    }

    /* Disabled button state */
    .btn-3d-primary:disabled,
    .btn-3d-primary[disabled] {
      opacity: 0.65;
      cursor: not-allowed !important;
      pointer-events: none !important;
      top: 0 !important;
      border-bottom-width: 4px !important;
    }

    .back-link-wrap {
      text-align: center;
      margin-top: 14px;
    }
    .back-link {
      font-size: 13px;
      color: var(--color-muted);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s ease;
    }
    .back-link:hover {
      color: var(--color-text);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Background Geometric Shapes -->
  <div class="bg-canvas">
    <div class="shape-square"></div>
    <div class="shape-torus"></div>
    <div class="shape-circle"></div>
    <div class="shape-triangle"></div>
  </div>

  <!-- Top Controls: Theme & Language -->
  <div class="top-controls">
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle Theme" aria-label="Toggle Theme">
      <!-- Icon injected via JS -->
    </button>
    <form method="post" action="/language" id="form-language-2fa" style="margin: 0;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
      <input type="hidden" name="next" value="{{ request.url.path }}{% if request.url.query %}?{{ request.url.query }}{% endif %}">
      <select name="lang" class="form-select lang-select-box" onchange="document.getElementById('form-language-2fa').submit();">
        {% for code, name in get_available_languages().items() %}
          <option value="{{ code }}" {% if request.state.lang == code %}selected{% endif %}>{{ name }}</option>
        {% endfor %}
      </select>
    </form>
  </div>

  <!-- Centered 2FA Box -->
  <div class="login-container">
    <div class="login-card">
      
      <!-- Brand Header -->
      <div class="brand-section">
        <img src="/static/images/logobarq.png" alt="{{ PANEL_NAME }}" class="brand-logo-img">
        <h2 class="brand-title">{{ _('two_factor_authentication') }}</h2>
        <p class="brand-subtitle">{{ _('enter_the_6_digit_code_from_your_authent') }}</p>
      </div>

      {% if error %}
      <div class="alert alert--danger mb-lg" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login/2fa" class="login-form" id="login-form" autocomplete="off" {% if locked %} data-locked="1" {% endif %}>
        {% include "partials/csrf_field.html" %}

        <div class="form-group">
          <label class="form-label" for="code">{{ _('authentication_code') }}</label>
          <input class="form-input-code{% if error %} form-input--error{% endif %}" type="text" id="code" name="code" placeholder="123456" required {% if not locked %}autofocus{% endif %} autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" maxlength="6" {% if locked %}disabled{% endif %}>
        </div>

        <button type="submit" id="login-submit" class="btn-3d-primary" {% if locked %}disabled aria-disabled="true" {% endif %}>
          {% if locked %}Try again later{% else %}Verify{% endif %}
        </button>

        <div class="back-link-wrap">
          <a href="/login" class="back-link">{{ _('back_to_login') }}</a>
        </div>
      </form>

    </div>
  </div>

  <script>
    const themes = ['light', 'dark', 'charcoal', 'amoled'];
    let currentTheme = 'charcoal';

    const icons = {
      light: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`,
      dark: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`,
      charcoal: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>`,
      amoled: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>`
    };

    function applyTheme(theme) {
      currentTheme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      const btn = document.getElementById('theme-btn');
      if (btn) {
        btn.innerHTML = icons[theme];
        btn.title = `Theme: ${theme.toUpperCase()}`;
      }
    }

    function toggleTheme() {
      const nextIndex = (themes.indexOf(currentTheme) + 1) % themes.length;
      applyTheme(themes[nextIndex]);
    }

    (function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme && themes.includes(savedTheme)) {
        applyTheme(savedTheme);
      } else {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(prefersDark ? 'charcoal' : 'light');
      }
    })();

    // Rate-limit / lockout and double-click prevention
    (function () {
      var form = document.getElementById("login-form");
      var btn = document.getElementById("login-submit");
      if (!form || !btn) return;

      if (form.getAttribute("data-locked") === "1") {
        form.addEventListener("submit", function (e) {
          e.preventDefault();
        });
        return;
      }

      form.addEventListener("submit", function (e) {
        if (form.getAttribute("data-submitting") === "1") {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
        form.setAttribute("data-submitting", "1");
        
        // Asynchronously disable button so POST submit event queues cleanly
        setTimeout(function() {
          btn.disabled = true;
          btn.setAttribute("aria-disabled", "true");
          btn.textContent = "Verifying…";
        }, 0);
      });

      btn.addEventListener("click", function (e) {
        if (form.getAttribute("data-submitting") === "1" || btn.disabled) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      });
    })();
  </script>
</body>
</html>
