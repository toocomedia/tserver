<!DOCTYPE html>
<html lang="{{ get_lang() }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VPS Control Panel login - 2FA">
  <meta name="csrf-token" content="{{ csrf_token(request) }}">
  <title>{{ _('2fa_verification') }} — {{ PANEL_NAME }}</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="shortcut icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/css/main.css?v={{ range(1, 99999999) | random }}">
  <link rel="stylesheet" href="/static/css/components/buttons.css?v={{ range(1, 99999999) | random }}">
  <link rel="stylesheet" href="/static/css/components/forms.css?v={{ range(1, 99999999) | random }}">
  <link rel="stylesheet" href="/static/css/components/alerts.css?v={{ range(1, 99999999) | random }}">
  <link rel="stylesheet" href="/static/css/utils.css?v={{ range(1, 99999999) | random }}">
  <link rel="stylesheet" href="/static/css/auth.css?v={{ range(1, 99999999) | random }}">
</head>
<body>

  <!-- Background Geometric Shapes -->
  <div class="bg-canvas">
    <div class="shape-square"></div>
    <div class="shape-torus"></div>
    <div class="shape-circle"></div>
    <div class="shape-triangle"></div>
  </div>

  <!-- Top Controls: Theme & Language -->
  <div class="top-controls">
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle Theme" aria-label="Toggle Theme">
      <!-- Icon injected via JS -->
    </button>
    <form method="post" action="/language" id="form-language-2fa" style="margin: 0;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
      <input type="hidden" name="next" value="{{ request.url.path }}{% if request.url.query %}?{{ request.url.query }}{% endif %}">
      <select name="lang" class="form-select lang-select-box" onchange="document.getElementById('form-language-2fa').submit();">
        {% for code, name in get_available_languages().items() %}
          <option value="{{ code }}" {% if request.state.lang == code %}selected{% endif %}>{{ name }}</option>
        {% endfor %}
      </select>
    </form>
  </div>

  <!-- Split 2FA Container -->
  <div class="login-container">
    <div class="login-visual">
      <div class="login-illustration-wrap">
        <div class="login-illustration-glow"></div>
        <img src="/static/login.png" alt="{{ PANEL_NAME }} Terminal" class="login-illustration-img">
      </div>
    </div>

    <div class="login-card">
      
      <!-- Brand Header -->
      <div class="brand-section">
        <img src="/static/images/logobarq.png" alt="{{ PANEL_NAME }}" class="brand-logo-img">
        <h2 class="brand-title">{{ _('two_factor_authentication') }}</h2>
        <p class="brand-subtitle">{{ _('enter_the_6_digit_code_from_your_authent') }}</p>
      </div>

      {% if error %}
      <div class="alert alert--danger mb-lg" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login/2fa" class="login-form" id="login-form" autocomplete="off" {% if locked %} data-locked="1" {% endif %}>
        {% include "partials/csrf_field.html" %}

        <div class="form-group">
          <label class="form-label" for="code">{{ _('authentication_code') }}</label>
          <input class="form-input-code{% if error %} form-input--error{% endif %}" type="text" id="code" name="code" placeholder="123456" required {% if not locked %}autofocus{% endif %} autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" maxlength="6" {% if locked %}disabled{% endif %}>
        </div>

        <button type="submit" id="login-submit" class="btn-3d-primary" {% if locked %}disabled aria-disabled="true" {% endif %}>
          {% if locked %}Try again later{% else %}Verify{% endif %}
        </button>

        <div class="back-link-wrap">
          <a href="/login" class="back-link">{{ _('back_to_login') }}</a>
        </div>
      </form>

    </div>
  </div>

  <script>
    const themes = ['light', 'dark', 'charcoal', 'amoled'];
    let currentTheme = 'charcoal';

    const icons = {
      light: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`,
      dark: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`,
      charcoal: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>`,
      amoled: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>`
    };

    function applyTheme(theme) {
      currentTheme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      const btn = document.getElementById('theme-btn');
      if (btn) {
        btn.innerHTML = icons[theme];
        btn.title = `Theme: ${theme.toUpperCase()}`;
      }
    }

    function toggleTheme() {
      const nextIndex = (themes.indexOf(currentTheme) + 1) % themes.length;
      applyTheme(themes[nextIndex]);
    }

    (function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme && themes.includes(savedTheme)) {
        applyTheme(savedTheme);
      } else {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(prefersDark ? 'charcoal' : 'light');
      }
      const savedFont = localStorage.getItem('panel_font');
      if (savedFont && savedFont !== 'onest') {
        document.documentElement.setAttribute('data-font', savedFont);
      }
    })();

    // Rate-limit / lockout and double-click prevention
    (function () {
      var form = document.getElementById("login-form");
      var btn = document.getElementById("login-submit");
      if (!form || !btn) return;

      if (form.getAttribute("data-locked") === "1") {
        form.addEventListener("submit", function (e) {
          e.preventDefault();
        });
        return;
      }

      form.addEventListener("submit", function (e) {
        if (form.getAttribute("data-submitting") === "1") {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
        form.setAttribute("data-submitting", "1");
        
        // Asynchronously disable button so POST submit event queues cleanly
        setTimeout(function() {
          btn.disabled = true;
          btn.setAttribute("aria-disabled", "true");
          btn.textContent = "Verifying…";
        }, 0);
      });

      btn.addEventListener("click", function (e) {
        if (form.getAttribute("data-submitting") === "1" || btn.disabled) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      });
    })();
  </script>
</body>
</html>
