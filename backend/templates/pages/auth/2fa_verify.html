<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Two-Factor Authentication — {{ PANEL_NAME }}">
  <meta name="csrf-token" content="{{ csrf_token(request) }}">
  <title>Two-Factor Authentication — {{ PANEL_NAME }}</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="shortcut icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/components/buttons.css">
  <link rel="stylesheet" href="/static/css/components/forms.css">
  <link rel="stylesheet" href="/static/css/components/alerts.css">
  <link rel="stylesheet" href="/static/css/utils.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--color-bg);
      overflow-x: hidden;
    }
    .split-login {
      display: flex;
      min-height: 100vh;
      width: 100vw;
    }
    .split-login__pattern-side {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background-color: var(--color-surface);
      background-image: radial-gradient(circle, var(--color-line) 1.5px, transparent 1.5px);
      background-size: 28px 28px;
      padding: 40px;
      border-right: 1px solid var(--color-line);
      box-sizing: border-box;
    }
    .split-login__form-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background-color: var(--color-bg);
      padding: 40px;
      box-sizing: border-box;
    }
    .borderless-form-wrap {
      width: 100%;
      max-width: 340px;
    }
    .theme-toggle-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 6px;
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      color: var(--color-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      z-index: 10;
    }
    .theme-toggle-btn:hover {
      background: var(--color-header-bg-bar);
      border-color: var(--color-text);
    }
    .code-input {
      font-size: 24px;
      letter-spacing: 4px;
      text-align: center;
      font-family: monospace;
      font-weight: 700;
    }
    @media (max-width: 850px) {
      .split-login {
        flex-direction: column;
      }
      .split-login__pattern-side {
        min-height: 200px;
        flex: none;
        border-right: none;
        border-bottom: 1px solid var(--color-line);
      }
      .split-login__form-side {
        flex: 1;
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>

  <button class="theme-toggle-btn" onclick="toggleTheme()" title="Switch Theme" id="theme-btn" aria-label="Switch Theme"></button>

  <div class="split-login">
    <div class="split-login__pattern-side">
      <div style="text-align: center; max-width: 280px;">
        <img src="/static/images/logobarq.png" alt="{{ PANEL_NAME }}" style="height: 56px; width: auto; object-fit: contain; margin-bottom: 20px;">
        <p style="font-size: 13px; color: var(--color-muted); margin: 0; line-height: 1.5;">
          Two-Factor Authentication is enabled for user <strong>{{ username }}</strong>.
        </p>
      </div>
    </div>

    <div class="split-login__form-side">
      <div class="borderless-form-wrap">
        <h2 style="font-size: var(--font-h2); font-weight: 800; margin: 0 0 8px 0;">2FA Challenge</h2>
        <p style="font-size: 13px; color: var(--color-muted); margin: 0 0 var(--space-xl) 0;">
          Enter the 6-digit code from your authenticator app or an emergency recovery key.
        </p>

        {% if error %}
        <div class="alert alert--danger mb-lg" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login/2fa" class="form" id="2fa-form" style="max-width: 100%;">
          {% include "partials/csrf_field.html" %}

          <div class="form-group">
            <label class="form-label" for="code">Verification Code</label>
            <input
              class="form-input code-input{% if error %} form-input--error{% endif %}"
              type="text"
              id="code"
              name="code"
              placeholder="123456"
              autocomplete="one-time-code"
              maxlength="12"
              autofocus
              required
            >
          </div>

          <button type="submit" class="btn btn--primary btn--full" style="margin-top: var(--space-md); font-weight: 700;">
            Verify & Sign in
          </button>
        </form>

        <div style="margin-top: var(--space-xl); text-align: center;">
          <form method="post" action="/logout" style="display: inline;">
            {% include "partials/csrf_field.html" %}
            <button type="submit" class="btn btn--link" style="font-size: 13px; color: var(--color-muted); background: none; border: none; padding: 0; cursor: pointer; text-decoration: underline;">
              Back to Login
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleTheme() {
      const current = localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      const target = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", target);
      localStorage.setItem("theme", target);
      updateThemeIcon(target);
    }
    function updateThemeIcon(theme) {
      const btn = document.getElementById("theme-btn");
      if (!btn) return;
      btn.innerHTML = theme === "dark"
        ? `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`
        : `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>`;
    }
    const savedTheme = localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", savedTheme);
    updateThemeIcon(savedTheme);
  </script>
</body>
</html>
