<script>
// Parse accounts from Jinja into JS for easy filtering
const allAccounts = {{ accounts | tojson }};
const webmailSites = {{ webmail_sites | tojson }};
let currentDomain = "";
let currentDomainIp = "{{ server_ip }}";

function getCsrfToken() {
  const el = document.querySelector('input[name="csrf_token"]');
  return el ? el.value : '';
}

// ---------------------------------------------------------------------------
// Sidebar Active State, Mobile Toggle & Search Filter
// ---------------------------------------------------------------------------
function scrollDomains(direction) {
  const listEl = document.getElementById('listContent');
  if (listEl) {
    listEl.scrollBy({ top: direction * 40, behavior: 'smooth' });
  }
}

function toggleSidebarSearch() {
  const header = document.getElementById('sidebarHeader');
  const input = document.getElementById('sidebarSearchInput');
  if (header && input) {
    const isActive = header.classList.contains('search-active');
    if (!isActive) {
      header.classList.add('search-active');
      input.focus();
    } else if (!input.value.trim()) {
      header.classList.remove('search-active');
    } else {
      input.focus();
    }
  }
}

function onSidebarSearchBlur(input) {
  if (!input.value.trim()) {
    const header = document.getElementById('sidebarHeader');
    if (header) header.classList.remove('search-active');
  }
}

function toggleMobileSidebar() {
  const sidebar = document.getElementById('maddy-floating-sidebar');
  if (sidebar) {
    sidebar.classList.toggle('mobile-open');
  }
}

function setSidebarActiveText(text) {
  const mobileLabel = document.getElementById('mobile-active-domain-name');
  if (mobileLabel) mobileLabel.innerText = text;

  const sidebar = document.getElementById('maddy-floating-sidebar');
  if (sidebar && sidebar.classList.contains('mobile-open')) {
    sidebar.classList.remove('mobile-open');
  }

  document.querySelectorAll('#listContent .list-item').forEach(el => {
    if (el.innerText.trim() === text.trim()) {
      el.classList.add('active');
    } else {
      el.classList.remove('active');
    }
  });
}

function updateScrollButtonsVisibility() {
  const listEl = document.getElementById('listContent');
  const container = document.querySelector('.list-container-wrap');
  if (listEl && container) {
    const visibleItems = Array.from(listEl.querySelectorAll('.list-item')).filter(el => el.style.display !== 'none');
    if (visibleItems.length > 5) {
      container.classList.add('has-scroll');
    } else {
      container.classList.remove('has-scroll');
    }
  }
}

function filterDomains(query) {
  const q = (query || '').toLowerCase().trim();
  document.querySelectorAll('#listContent .list-item').forEach(el => {
    const text = el.innerText.toLowerCase().trim();
    if (!q || text.includes(q)) {
      el.style.display = '';
    } else {
      el.style.display = 'none';
    }
  });
  updateScrollButtonsVisibility();
}

// ---------------------------------------------------------------------------
// Add Domain UI Toggle & Modal Pop Box
// ---------------------------------------------------------------------------
function toggleDomainInputType() {
  const radio = document.querySelector('input[name="domain_type"]:checked');
  if (!radio) return;
  const type = radio.value;
  const selectWrapper = document.getElementById('domain-select-wrapper');
  const inputWrapper  = document.getElementById('domain-input-wrapper');
  const hintText      = document.getElementById('domain-hint-text');
  
  if (type === 'panel') {
    if (selectWrapper) selectWrapper.style.display = 'block';
    if (inputWrapper)  inputWrapper.style.display  = 'none';
    if (hintText) hintText.innerText = "Select a domain hosted on this panel — MX, A, SPF, and DMARC records will be created automatically in PowerDNS.";
  } else {
    if (selectWrapper) selectWrapper.style.display = 'none';
    if (inputWrapper)  inputWrapper.style.display  = 'block';
    if (hintText) hintText.innerText = "Enter an external domain (e.g. from Cloudflare). Local PowerDNS records will be skipped.";
  }
}

function onDomainSelect(selectEl) {
  const ip = selectEl.selectedOptions[0]?.dataset?.ip || '';
  if (ip) {
    currentDomainIp = ip;
    const ipField = document.getElementById('add-domain-ip');
    if (ipField) ipField.value = ip;
  }
}

function openAddDomain() {
  const result = document.getElementById('add-domain-result');
  if (result) { result.style.display = 'none'; result.innerText = ''; }
  const form = document.getElementById('add-domain-form');
  if (form) form.reset();
  toggleDomainInputType();
  openModal('add-domain-modal');
}

async function handleAddDomain() {
  const form     = document.getElementById('add-domain-form');
  const formData = new FormData(form);
  const result   = document.getElementById('add-domain-result');

  const type = formData.get('domain_type');
  let domain = "";
  if (type === 'panel') {
    domain = formData.get('domain_select');
  } else {
    domain = formData.get('domain_custom');
  }

  if (!domain || !domain.trim()) {
    result.style.display = 'block';
    result.className = 'text-small text-danger';
    result.innerText = 'Please provide a domain name.';
    return;
  }

  const payload = new FormData();
  payload.append('csrf_token', formData.get('csrf_token'));
  payload.append('domain', domain.trim());
  payload.append('server_ip', formData.get('server_ip'));

  result.style.display = 'block';
  result.className = 'text-small text-muted';
  result.innerText = 'Adding domain…';

  try {
    const res  = await fetch('/plugins/maddy/api/domains/add', { method: 'POST', body: payload });
    const data = await res.json();
    if (res.ok) {
      result.className = 'text-small text-accent';
      result.innerText = data.message || '✅ Domain added successfully.';
      setTimeout(() => {
        closeModal('add-domain-modal');
        location.reload();
      }, 800);
    } else {
      result.className = 'text-small text-danger';
      result.innerText = data.detail || 'Failed to add domain.';
    }
  } catch (err) {
    result.className = 'text-small text-danger';
    result.innerText = 'Network error: ' + err.message;
  }
}

// ---------------------------------------------------------------------------
// Delete domain — AJAX
// ---------------------------------------------------------------------------
function confirmDeleteDomain(domain) {
  domain = domain || currentDomain;
  const nameEl = document.getElementById('delete-domain-name');
  if (nameEl) nameEl.innerText = domain;
  const inpEl = document.getElementById('delete-domain-input');
  if (inpEl) inpEl.value = domain;
  openModal('delete-domain-modal');
}

async function executeDeleteDomain() {
  const domain = document.getElementById('delete-domain-input').value;
  const formData = new FormData();
  formData.append('csrf_token', getCsrfToken());
  formData.append('domain', domain);

  try {
    const res  = await fetch('/plugins/maddy/api/domains/delete', { method: 'POST', body: formData });
    const data = await res.json();
    closeModal('delete-domain-modal');
    if (res.ok) {
      location.reload();
    } else {
      alert('Delete failed: ' + (data.detail || JSON.stringify(data)));
    }
  } catch (err) {
    closeModal('delete-domain-modal');
    alert('Network error: ' + err.message);
  }
}

// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
// Views & Navigation
// ---------------------------------------------------------------------------
function safeSetText(id, text) {
  const el = document.getElementById(id);
  if (el) el.innerText = text;
}
function safeSetValue(id, val) {
  const el = document.getElementById(id);
  if (el) el.value = val;
}

function renderDnsRecordsTable(domain, ip) {
  const tbody = document.getElementById('dns-records-tbody');
  if (!tbody) return;
  tbody.innerHTML = `
    <tr>
      <td><strong>A</strong></td>
      <td><code>mail.${domain}</code></td>
      <td><code>${ip}</code></td>
    </tr>
    <tr>
      <td><strong>MX</strong></td>
      <td><code>${domain}</code></td>
      <td><code>10 mail.${domain}.</code></td>
    </tr>
    <tr>
      <td><strong>TXT</strong></td>
      <td><code>${domain}</code> (SPF)</td>
      <td><code>v=spf1 mx ip4:${ip} ~all</code></td>
    </tr>
    <tr>
      <td><strong>TXT</strong></td>
      <td><code>_dmarc.${domain}</code></td>
      <td><code>v=DMARC1; p=none;</code></td>
    </tr>
  `;
}

async function checkMailSslStatus(domain) {
  const badge = document.getElementById('ssl-status-badge');
  const text  = document.getElementById('ssl-status-text');
  if (!badge) return;
  
  badge.className = 'badge-minimal';
  badge.innerText = 'Checking...';
  if (text) text.innerText = '';

  try {
    const res = await fetch('/plugins/maddy/api/ssl/status?domain=' + encodeURIComponent(domain));
    const data = await res.json();
    if (res.ok && data.status === 'ready') {
      badge.className = 'badge-minimal badge-minimal--active';
      badge.innerText = 'Valid SSL';
      if (text) text.innerText = data.message || 'SSL certificate active for mail.' + domain;
    } else {
      badge.className = 'badge-minimal badge-minimal--danger';
      badge.innerText = 'No SSL';
      if (text) text.innerText = data.detail || data.message || 'Missing certificate for mail.' + domain;
    }
  } catch (err) {
    badge.className = 'badge-minimal badge-minimal--danger';
    badge.innerText = 'Unknown';
    if (text) text.innerText = 'Could not check SSL status.';
  }
}

function openDomainDetail(domain, serverIp) {
  currentDomain   = domain;
  currentDomainIp = serverIp || currentDomainIp;
  currentAccountSearchQuery = "";
  const searchInput = document.getElementById('account-search-input');
  if (searchInput) searchInput.value = "";
  
  // Highlight active row in master table
  document.querySelectorAll('#listContent .list-item').forEach(el => {
    const strong = el.querySelector('.domain-name-text');
    if (strong && strong.innerText.trim() === domain.trim()) {
      el.classList.add('active');
    } else {
      el.classList.remove('active');
    }
  });

  safeSetText('detail-domain-name', domain);
  safeSetText('detail-domain-ip', currentDomainIp ? 'Server IP: ' + currentDomainIp : '');
  safeSetText('delete-domain-name-text', domain);
  safeSetValue('dns-domain-input', domain);
  safeSetValue('ssl-domain-input', domain);
  safeSetValue('dns-server-ip', currentDomainIp);

  safeSetText('setting-imap-server', 'mail.' + domain);
  safeSetText('setting-smtp-server', 'mail.' + domain);

  renderDnsRecordsTable(domain, currentDomainIp);
  checkMailSslStatus(domain);
  renderAccountsList();

  // Reset inner tab to accounts
  const firstTabBtn = document.querySelector('.maddy-drawer-nav [data-tab="accounts"]');
  if (firstTabBtn) {
    switchInnerTab('accounts', firstTabBtn);
  }

  // Open right split drawer and overlay backdrop
  const backdrop = document.getElementById('maddy-drawer-backdrop');
  const drawer   = document.getElementById('maddy-detail-drawer');
  if (backdrop) backdrop.classList.add('is-open');
  if (drawer) drawer.classList.add('is-open');
  document.body.style.overflow = 'hidden';

  // Skeleton loading inside drawer
  const skel = document.getElementById('domain-skeleton');
  if (skel) {
    skel.classList.remove('is-hidden');
    skel.setAttribute('aria-hidden', 'false');
    skel.style.display = '';
    setTimeout(() => {
      if (typeof hideSkeleton === 'function') hideSkeleton('domain-skeleton', 200);
      else if (typeof window.hideSkeleton === 'function') window.hideSkeleton('domain-skeleton', 200);
    }, 150);
  }
}

function closeDomainDetail() {
  const backdrop = document.getElementById('maddy-drawer-backdrop');
  const drawer   = document.getElementById('maddy-detail-drawer');
  if (backdrop) backdrop.classList.remove('is-open');
  if (drawer) drawer.classList.remove('is-open');
  document.body.style.overflow = '';

  document.querySelectorAll('#listContent .list-item').forEach(el => {
    el.classList.remove('active');
  });
}

// ---------------------------------------------------------------------------
// Inner Tab Switching
// ---------------------------------------------------------------------------
function switchInnerTab(tabName, btnEl) {
  if (!btnEl && typeof tabName !== 'string') {
    btnEl = tabName;
    tabName = btnEl.getAttribute('data-tab');
  }

  const drawer = document.getElementById('maddy-detail-drawer');
  if (!drawer) return;

  drawer.querySelectorAll('.php-split-nav-btn').forEach(b => {
    b.classList.remove('active', 'is-active');
  });
  if (btnEl) btnEl.classList.add('active', 'is-active');

  drawer.querySelectorAll('.inner-tab-content').forEach(panel => {
    panel.classList.add('hidden');
    panel.classList.remove('active', 'is-active');
    panel.style.display = 'none';
  });

  const target = document.getElementById('inner-tab-' + tabName);
  if (target) {
    target.classList.remove('hidden');
    target.classList.add('active', 'is-active');
    target.style.display = 'flex';
  }
}

// ---------------------------------------------------------------------------
// Accounts list & pagination (filtered by currentDomain)
// ---------------------------------------------------------------------------
let currentAccountSearchQuery = "";

function onAccountSearch(query) {
  currentAccountSearchQuery = (query || "").trim().toLowerCase();
  renderAccountsList();
}

function renderAccountsList() {
  const tbody      = document.getElementById('accounts-tbody');
  const countBadge = document.getElementById('account-count-badge');
  if (!tbody) return;
  tbody.innerHTML = '';

  let domainAccounts = allAccounts.filter(a => a.email.endsWith('@' + currentDomain));
  
  if (countBadge) {
    countBadge.innerText = domainAccounts.length;
  }

  let filtered = domainAccounts;
  if (currentAccountSearchQuery) {
    filtered = domainAccounts.filter(a => a.email.toLowerCase().includes(currentAccountSearchQuery));
  }

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="2" class="text-muted" style="text-align: center; padding: var(--space-xl);">No mailboxes found.</td></tr>';
    return;
  }

  filtered.forEach(acc => {
    const row = document.createElement('tr');
    
    const nameCell = document.createElement('td');
    nameCell.className = 'table-title';
    nameCell.innerHTML = `<strong>${acc.email}</strong>`;
    row.appendChild(nameCell);

    const actionsCell = document.createElement('td');
    actionsCell.className = 'col-actions';
    actionsCell.style.textAlign = 'right';

    const actionsWrap = document.createElement('div');
    actionsWrap.style.display = 'inline-flex';
    actionsWrap.style.gap = '6px';
    actionsWrap.style.alignItems = 'center';
    actionsWrap.style.justifyContent = 'flex-end';

    const webmail = webmailSites[currentDomain] || {};
    if (webmail.ready) {
      const openButton = document.createElement('button');
      openButton.type = 'button';
      openButton.className = 'btn btn--surface btn--sm';
      openButton.textContent = 'Webmail';
      openButton.addEventListener('click', () => openWebmail(acc.email));
      actionsWrap.appendChild(openButton);
    } else {
      const setupLink = document.createElement('a');
      setupLink.className = 'btn btn--surface btn--sm';
      setupLink.style.textDecoration = 'none';
      setupLink.textContent = 'Webmail setup';
      setupLink.href = webmail.setup_url || '/plugins/roundcube_webmail/';
      setupLink.title = webmail.reason || 'Webmail is not ready.';
      actionsWrap.appendChild(setupLink);
    }
    
    const deleteButton = document.createElement('button');
    deleteButton.type = 'button';
    deleteButton.className = 'btn btn--danger btn--sm';
    deleteButton.textContent = 'Delete';
    deleteButton.addEventListener('click', () => executeDeleteAccount(acc.email));
    actionsWrap.appendChild(deleteButton);

    actionsCell.appendChild(actionsWrap);
    row.appendChild(actionsCell);
    tbody.appendChild(row);
  });
}

function openAddAccountModal() {
  const domainInp = document.getElementById('add-account-domain');
  if (domainInp) domainInp.value = currentDomain;

  const suffixEl = document.getElementById('add-account-domain-suffix');
  if (suffixEl) suffixEl.innerText = '@' + currentDomain;

  const modalSubText = document.getElementById('modal-domain-subtitle-text');
  if (modalSubText) modalSubText.innerText = currentDomain;

  const resultDiv = document.getElementById('add-account-result');
  if (resultDiv) { resultDiv.style.display = 'none'; resultDiv.innerText = ''; }

  const form = document.getElementById('add-account-form');
  if (form) form.reset();

  openModal('add-account-modal');
  setTimeout(() => {
    const userInp = document.getElementById('add-account-username');
    if (userInp) userInp.focus();
  }, 100);
}

// ---------------------------------------------------------------------------
// Accounts actions (AJAX)
// ---------------------------------------------------------------------------
async function openWebmail(email) {
  const target = window.open('about:blank', '_blank');
  if (!target) {
    alert('Allow popups for the panel, then try again.');
    return;
  }
  const payload = new FormData();
  payload.append('csrf_token', getCsrfToken());
  payload.append('email', email);
  try {
    const response = await fetch('/plugins/roundcube_webmail/api/launch', {
      method: 'POST',
      body: payload,
      headers: { Accept: 'application/json' }
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || !data.launch_url) {
      throw new Error(data.detail || 'Webmail launch failed.');
    }
    target.location.replace(data.launch_url);
  } catch (error) {
    target.close();
    alert(error.message);
  }
}

async function executeAddAccount() {
  const form = document.getElementById('add-account-form');
  const formData = new FormData(form);
  formData.set('domain', currentDomain); // Ensure current domain is set
  const resultDiv = document.getElementById('add-account-result');

  resultDiv.style.display = 'block';
  resultDiv.className = 'text-small text-muted';
  resultDiv.innerText = 'Creating mailbox…';

  try {
    const res = await fetch('/plugins/maddy/api/accounts/create', { method: 'POST', body: formData });
    const data = await res.json();
    if (res.ok) {
      resultDiv.className = 'text-small text-accent';
      resultDiv.innerText = 'Mailbox created successfully!';
      allAccounts.push({ email: data.email });
      renderAccountsList();
      setTimeout(() => closeModal('add-account-modal'), 800);
      form.reset();
    } else {
      resultDiv.className = 'text-small text-danger';
      resultDiv.innerText = data.detail || 'Failed to create mailbox.';
    }
  } catch (err) {
    resultDiv.className = 'text-small text-danger';
    resultDiv.innerText = 'Network error: ' + err.message;
  }
}

function executeDeleteAccount(email) {
  const emailEl = document.getElementById('delete-account-email');
  if (emailEl) emailEl.innerText = email;
  const inputEl = document.getElementById('delete-account-email-input');
  if (inputEl) inputEl.value = email;
  openModal('delete-account-modal');
}

async function confirmExecuteDeleteAccount() {
  const emailInput = document.getElementById('delete-account-email-input');
  const email = emailInput ? emailInput.value : '';
  if (!email) return;

  closeModal('delete-account-modal');

  const formData = new FormData();
  formData.append('csrf_token', getCsrfToken());
  formData.append('email', email);

  try {
    const res = await fetch('/plugins/maddy/api/accounts/delete', { method: 'POST', body: formData });
    const data = await res.json();
    if (res.ok) {
      const index = allAccounts.findIndex(a => a.email === email);
      if (index > -1) {
        allAccounts.splice(index, 1);
      }
      renderAccountsList();
    } else {
      alert('Delete failed: ' + (data.detail || 'Unknown error'));
    }
  } catch (err) {
    alert('Network error: ' + err.message);
  }
}

// ---------------------------------------------------------------------------
// DNS actions (AJAX)
// ---------------------------------------------------------------------------
async function handleDnsAction(endpoint) {
  const formData  = new FormData(document.getElementById('dns-setup-form'));
  const resultDiv = document.getElementById('dns-result-message');

  resultDiv.style.display = 'block';
  resultDiv.className     = 'text-small text-muted';
  resultDiv.innerText     = 'Updating DNS records…';

  try {
    const res  = await fetch(endpoint, { method: 'POST', body: formData });
    const data = await res.json();
    if (res.ok) {
      resultDiv.className = 'text-small text-accent';
      resultDiv.innerText = data.message || '✅ DNS operation completed.';
    } else {
      resultDiv.className = 'text-small text-danger';
      resultDiv.innerText = data.detail || 'DNS operation failed.';
    }
  } catch (err) {
    resultDiv.className = 'text-small text-danger';
    resultDiv.innerText = 'Network error: ' + err.message;
  }
}

// ---------------------------------------------------------------------------
// SSL issue (AJAX)
// ---------------------------------------------------------------------------
async function issueMailSsl() {
  const formData  = new FormData(document.getElementById('ssl-setup-form'));
  const resultDiv = document.getElementById('ssl-result-message');
  const domain = String(formData.get('domain') || '');

  resultDiv.style.display = 'block';
  resultDiv.className     = 'text-small text-muted';
  resultDiv.innerText     = "Starting Let's Encrypt SSL…";

  try {
    const res  = await fetch('/plugins/maddy/api/ssl/issue', { method: 'POST', body: formData });
    const data = await res.json();
    if (res.ok) {
      resultDiv.innerText = data.message || 'SSL setup is running…';
      pollMailSsl(domain, resultDiv);
    } else {
      resultDiv.className = 'text-small text-danger';
      resultDiv.innerText = data.detail || 'SSL request failed.';
    }
  } catch (err) {
    resultDiv.className = 'text-small text-danger';
    resultDiv.innerText = 'Network error: ' + err.message;
  }
}

async function pollMailSsl(domain, resultDiv) {
  try {
    const res = await fetch('/plugins/maddy/api/ssl/status?domain=' + encodeURIComponent(domain));
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Could not read SSL status.');
    resultDiv.innerText = data.message || 'SSL status updated.';
    if (data.status === 'ready') {
      resultDiv.className = 'text-small text-accent';
      return;
    }
    if (data.status === 'error') {
      resultDiv.className = 'text-small text-danger';
      return;
    }
    setTimeout(() => pollMailSsl(domain, resultDiv), 2000);
  } catch (err) {
    resultDiv.className = 'text-small text-danger';
    resultDiv.innerText = err.message;
  }
}

// ---------------------------------------------------------------------------
// Service Diagnostics & Config Repair
// ---------------------------------------------------------------------------
async function openMaddyDiagnostics() {
  if (typeof openModal === 'function') {
    openModal('maddy-diagnostics-modal');
  } else {
    const el = document.getElementById('maddy-diagnostics-modal');
    if (el) el.classList.remove('hidden');
  }
  const logsEl = document.getElementById('maddy-diagnostic-logs');
  if (logsEl) logsEl.textContent = 'Running diagnostics...';

  try {
    const resp = await fetch('/plugins/maddy/api/diagnose');
    const data = await resp.json();
    if (logsEl) {
      logsEl.textContent = data.logs || 'No diagnostic output returned.';
    }
  } catch (err) {
    if (logsEl) logsEl.textContent = 'Diagnostic error: ' + err.message;
  }
}

async function repairMaddyConfig() {
  if (!confirm('Rebuild Maddy from all mail domains configured in the panel? Existing mail.<domain> certificates will be restored and Maddy will restart.')) return;
  const btn = document.getElementById('btn-repair-maddy');
  if (btn) { btn.disabled = true; btn.textContent = 'Repairing...'; }

  try {
    const token = getCsrfToken();
    const resp = await fetch('/plugins/maddy/api/repair', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRF-Token': token
      }
    });
    const data = await resp.json();
    if (resp.ok) {
      alert('Maddy configuration repaired successfully!');
      location.reload();
    } else {
      alert('Repair error: ' + (data.detail || data.error || 'Failed to repair config'));
    }
  } catch (err) {
    alert('Request error: ' + err.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Repair Config'; }
  }
}

document.addEventListener('DOMContentLoaded', () => {
  if (typeof hideSkeleton === 'function') hideSkeleton('maddy-skeleton');
  else if (typeof window.hideSkeleton === 'function') window.hideSkeleton('maddy-skeleton');
  updateScrollButtonsVisibility();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const openModals = document.querySelectorAll('.modal-backdrop:not(.hidden)');
    if (openModals.length > 0) return;

    const drawer = document.getElementById('maddy-detail-drawer');
    if (drawer && drawer.classList.contains('is-open')) {
      closeDomainDetail();
    }
  }
});
</script>
