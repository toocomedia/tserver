<!-- Add Account Modal (Naked / Borderless Style) -->
<div id="add-account-modal" class="modal-backdrop hidden" role="dialog">
  <div class="modal" style="max-width: 480px; width: 100%; border-radius: var(--radius-lg) !important; background: var(--bg-panel); border: 1px solid var(--color-line);">
    <div class="modal__header" style="border-bottom: none; padding: 24px 24px 0 24px;">
      <h2 style="font-size: 18px; font-weight: 600; margin: 0; color: var(--text-main);">Add New Mailbox</h2>
      <p style="font-size: 13px; color: var(--text-muted); margin: 4px 0 0 0;">Create a new email address under this domain</p>
    </div>
    
    <div class="modal__body" style="padding: 24px;">
      <form id="add-account-form" onsubmit="event.preventDefault(); executeAddAccount();">
        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
        <input type="hidden" name="domain" id="modal-domain-input">

        <div class="form-group" style="margin-bottom: var(--spacing-lg);">
            <label class="form-label" style="font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px;">Email Username</label>
            <div style="display: flex; background: var(--bg-input); border-radius: var(--radius-sm) !important;">
                <input type="text" name="username" id="modal-username-input" class="form-input" placeholder="hello" style="flex: 1; background: transparent; padding: 10px 14px; border: none; outline: none; color: var(--text-main); font-size: 14px;" oninput="updateDomainSuffix()" required>
                <div style="display: flex; align-items: center; padding: 0 16px; color: var(--text-muted); font-size: 13px; font-weight: 500;" id="domain-suffix-preview">
                    @domain.com
                </div>
            </div>
        </div>

        <div class="form-group" style="margin-bottom: var(--spacing-lg);">
            <label class="form-label" style="font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px;">Secure Password</label>
            <input type="password" name="password" id="modal-password-input" class="form-input" placeholder="Min 8 characters" style="width: 100%; background: var(--bg-input); padding: 10px 14px; border: none; border-radius: var(--radius-sm) !important; outline: none; color: var(--text-main); font-size: 14px;" required minlength="8">
        </div>
        
        <div id="add-account-result" class="text-small text-danger" style="display: none; margin-bottom: 12px;"></div>

        <div style="display: flex; gap: 8px; justify-content: flex-end;">
            <button type="button" class="btn" onclick="closeModal('add-account-modal')" style="background: transparent; color: var(--text-main);">Cancel</button>
            <button type="submit" class="btn primary">Create Mailbox</button>
        </div>
      </form>
    </div>
  </div>
</div>
