<!-- Add Account Modal (Standard Style) -->
<div id="add-account-modal" class="modal-backdrop hidden" role="dialog">
  <div class="modal" style="max-width: 440px;">
    <div class="modal__header">
      <h2>Add New Mailbox</h2>
      <button type="button" class="btn btn--ghost btn--icon" onclick="closeModal('add-account-modal')" aria-label="Close">✕</button>
    </div>
    <div class="modal__body">
      <p style="font-size: 13px; color: var(--color-muted); margin-bottom: 16px;" id="add-account-modal-subtitle">
        Create a new email address under <strong style="color: var(--color-text);" id="modal-domain-subtitle-text"></strong>
      </p>

      <form id="add-account-form" style="display: flex; flex-direction: column; gap: 14px;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
        <input type="hidden" name="domain" id="add-account-domain">

        <div class="form-group" style="margin: 0;">
          <label class="form-label">Email Username</label>
          <div class="input-connected-wrap" style="display: flex;">
            <input type="text" name="username" id="add-account-username" class="form-input" style="border-top-right-radius: 0; border-bottom-right-radius: 0; flex: 1;" placeholder="hello" required autocomplete="off">
            <div class="domain-suffix-badge" id="add-account-domain-suffix" style="background: var(--color-surface); border: 1px solid var(--color-line); border-left: none; padding: 0 12px; display: flex; align-items: center; border-top-right-radius: 6px; border-bottom-right-radius: 6px; font-size: 13px; color: var(--color-muted);">
              @domain.com
            </div>
          </div>
        </div>

        <div class="form-group" style="margin: 0;">
          <label class="form-label">Secure Password</label>
          <input type="password" name="password" id="add-account-password" class="form-input" placeholder="Min 8 characters" required>
        </div>

        <div id="add-account-result" style="display: none; font-size: 13px;"></div>
      </form>
    </div>
    <div class="modal__footer">
      <button type="button" class="btn btn--secondary" onclick="closeModal('add-account-modal')">Cancel</button>
      <button type="button" class="btn btn--primary" onclick="executeAddAccount()">Create Mailbox</button>
    </div>
  </div>
</div>
