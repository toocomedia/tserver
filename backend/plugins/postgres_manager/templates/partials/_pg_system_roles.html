{# _pg_system_roles.html — System Roles tab panel #}
<div id="pg-panel-system-roles" class="pg-panel" style="display:none;">
  <div class="php-cards-grid">
    <div class="php-card">
      <div class="php-card__title has-table" style="margin-bottom: 0;">
        <span>Predefined System Roles (pg_*)</span>
      </div>

      <table class="table" style="width: 100%; table-layout: fixed; margin-bottom: 0;">
        <thead>
          <tr>
            <th style="padding: 8px 12px; width: 220px;">Role Name</th>
            <th style="padding: 8px 12px;">Predefined Purpose &amp; Capability</th>
          </tr>
        </thead>
        <tbody>
          {% if system_roles %}
            {% for r in system_roles %}
            <tr>
              <td class="table-title"><code>{{ r.name }}</code></td>
              <td><span class="text-muted">{{ r.description }}</span></td>
            </tr>
            {% endfor %}
          {% else %}
            <tr>
              <td colspan="2" class="text-muted" style="text-align: center; padding: var(--space-xl);">
                No system roles found.
              </td>
            </tr>
          {% endif %}
        </tbody>
      </table>
    </div>
  </div>
</div>
