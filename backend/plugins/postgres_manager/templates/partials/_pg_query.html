{# _pg_query.html — Query Runner tab panel #}
<div id="pg-panel-query" class="pg-panel" style="display:none;">
  <div class="php-cards-grid">
    <!-- QUERY CONSOLE CARD -->
    <div class="php-card">
      <div class="php-card__title">
        <span>Execute Read-Only SQL Query</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: var(--space-md);">
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label" for="pg-query-db">Target Database</label>
          <select id="pg-query-db" class="form-input" style="max-width: 300px;">
            {% for db in databases %}
              <option value="{{ db.name }}">{{ db.name }}</option>
            {% endfor %}
            {% if not databases %}
              <option value="postgres">postgres</option>
            {% endif %}
          </select>
        </div>

        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label" for="pg-query-sql">SQL Query (SELECT statements only)</label>
          <textarea id="pg-query-sql" class="form-input" rows="4" style="font-family: var(--font-mono); font-size: 12px; resize: vertical;" placeholder="SELECT table_name FROM information_schema.tables WHERE table_schema='public';"></textarea>
        </div>

        <div style="display: flex; gap: 8px;">
          <button class="btn btn--primary btn--sm" id="pg-query-run">Run Query</button>
          <button class="btn btn--secondary btn--sm" id="pg-query-clear">Clear</button>
        </div>

        <div id="pg-query-error" class="alert alert--danger" style="display:none; font-size: 13px;"></div>
      </div>
    </div>

    <!-- QUERY RESULTS CARD -->
    <div class="php-card" id="pg-query-results" style="display:none;">
      <div class="php-card__title has-table" style="margin-bottom: 0;">
        <span>Query Results</span>
        <span id="pg-query-count" class="badge-minimal"></span>
      </div>
      <table class="table" style="width: 100%; margin-bottom: 0;">
        <tbody id="pg-query-tbody"></tbody>
      </table>
    </div>

    <div id="pg-query-empty" class="alert alert--warning" style="display:none; font-size: 13px;">
      Query executed successfully — 0 rows returned.
    </div>
  </div>
</div>
