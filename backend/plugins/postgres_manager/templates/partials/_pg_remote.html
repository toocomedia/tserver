{# Remote Access tab: list and endpoint setup stay inside PostgreSQL Manager. #}
<div id="pg-panel-remote" class="pg-panel" style="display:none;">
  <section class="pg-remote" data-remote-view="list">
    <header class="pg-remote__header">
      <div>
        <h2 class="pg-remote__title">Remote Access</h2>
        <p class="pg-remote__intro">Secure PostgreSQL endpoints on port 5432. Only listed client IP ranges can connect.</p>
      </div>
      <button class="btn btn--primary" type="button" data-action="open-remote-create">+ Add Remote Endpoint</button>
    </header>

    {% include "partials/_pg_remote_list.html" %}
  </section>

  {% include "partials/_pg_remote_create.html" %}
</div>
