{# _pg_connection_modal.html — Connection URL & Credentials Generator Modal #}
<div class="modal-backdrop" id="pg-modal-connection" data-no-backdrop-close="true" style="display:none;" aria-modal="true" role="dialog">

  <div class="modal" style="max-width:560px;">
    <div class="modal__header">
      <h2 style="font-size:var(--font-h2);margin:0;">Connection Info &amp; URLs</h2>
      <button class="btn btn--icon btn--sm btn--ghost" data-action="close-modal" data-modal="pg-modal-connection" aria-label="Close">✕</button>
    </div>
    <div class="modal__body" style="display:flex;flex-direction:column;gap:var(--space-md);">
      
      <!-- Target Database (Readonly) -->
      <div class="form-group">
        <label class="form-label">Database Name</label>
        <input type="text" id="pg-conn-db-name" class="form-input" readonly style="background:var(--color-surface);font-weight:700;">
      </div>

      <!-- Controls Row: User + Mode -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-md);">
        <div class="form-group">
          <label class="form-label" for="pg-conn-user-select">Username</label>
          <div class="form-select-wrap">
            <select id="pg-conn-user-select" class="form-select">
              {% for u in users %}
                <option value="{{ u.name }}">{{ u.name }}</option>
              {% endfor %}
              {% if not users %}
                <option value="postgres">postgres</option>
              {% endif %}
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="pg-conn-mode-select">Connection Mode</label>
          <div class="form-select-wrap">
            <select id="pg-conn-mode-select" class="form-select">
              <option value="127.0.0.1">Local VPS (127.0.0.1)</option>
              {% for rd in remote_domains %}
                <option value="{{ rd.domain }}">Remote SSL ({{ rd.domain }})</option>
              {% endfor %}
              {% if not remote_domains %}
                <option value="" disabled>No remote TLS endpoint configured</option>
              {% endif %}
            </select>
          </div>
        </div>

      </div>

      <!-- Password Input -->
      <div class="form-group">
        <label class="form-label" for="pg-conn-password-input">Password</label>
        <div style="display:flex;gap:var(--space-xs);">
          <input type="password" id="pg-conn-password-input" class="form-input" placeholder="Enter password to reveal complete URLs" style="flex:1;">
          <button class="btn btn--secondary btn--sm" id="pg-conn-toggle-pw-btn" type="button">Show</button>
        </div>
      </div>

      <div style="border-top:1px solid var(--color-line);margin:var(--space-xs) 0;"></div>

      <!-- Format 1: Standard Connection URI -->
      <div class="form-group">
        <label class="form-label" for="pg-conn-uri">Standard Connection URI</label>
        <div style="display:flex;gap:var(--space-xs);">
          <input type="text" id="pg-conn-uri" class="form-input" readonly style="font-family:monospace;font-size:12px;background:var(--color-surface);flex:1;">
          <button class="btn btn--secondary btn--sm" data-copy-target="pg-conn-uri">Copy</button>
        </div>
      </div>

      <!-- Format 2: Environment Variable (.env) -->
      <div class="form-group">
        <label class="form-label" for="pg-conn-env">Environment Variable (.env / Prisma / Drizzle)</label>
        <div style="display:flex;gap:var(--space-xs);">
          <input type="text" id="pg-conn-env" class="form-input" readonly style="font-family:monospace;font-size:12px;background:var(--color-surface);flex:1;">
          <button class="btn btn--secondary btn--sm" data-copy-target="pg-conn-env">Copy</button>
        </div>
      </div>

      <!-- Format 3: Individual Credential Breakdown -->
      <div style="padding:var(--space-md);background:var(--color-surface);border:1px solid var(--color-line);display:grid;grid-template-columns:1fr 1fr;gap:var(--space-xs) var(--space-md);font-size:var(--font-small);">
        <div><strong style="color:var(--color-muted);">Host:</strong> <span id="pg-conn-host-val">127.0.0.1</span></div>
        <div><strong style="color:var(--color-muted);">Port:</strong> <span id="pg-conn-port-val">5432</span></div>
        <div><strong style="color:var(--color-muted);">Database:</strong> <span id="pg-conn-db-val">—</span></div>
        <div><strong style="color:var(--color-muted);">User:</strong> <span id="pg-conn-user-val">—</span></div>
      </div>

    </div>
    <div class="modal__footer">
      <button class="btn btn--secondary" data-action="close-modal" data-modal="pg-modal-connection">Close</button>
    </div>
  </div>
</div>
