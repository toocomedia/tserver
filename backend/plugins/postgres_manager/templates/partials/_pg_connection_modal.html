{# _pg_connection_modal.html — Connection URL & Credentials Generator Modal #}
<div class="modal-backdrop" id="pg-modal-connection" data-no-backdrop-close="true" style="display:none;" aria-modal="true" role="dialog">

  <div class="modal">
    <div class="modal__header">
      <h2>Connection Info &amp; URLs</h2>
      <button class="btn btn--icon btn--sm btn--ghost" data-action="close-modal" data-modal="pg-modal-connection" aria-label="Close">✕</button>
    </div>
    <div class="modal__body d-flex flex-column gap-md">
      
      <!-- Target Database (Readonly) -->
      <div class="form-group">
        <label class="form-label">Database Name</label>
        <input type="text" id="pg-conn-db-name" class="form-input form-input--code font-bold" readonly>
      </div>

      <!-- Controls Row: User + Mode -->
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label" for="pg-conn-user-select">Username</label>
          <div class="form-select-wrap">
            <select id="pg-conn-user-select" class="form-select">
              {% for u in users %}
                <option value="{{ u.name }}">{{ u.name }}</option>
              {% endfor %}
              {% if not users %}
                <option value="postgres">postgres</option>
              {% endif %}
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="pg-conn-mode-select">Connection Mode</label>
          <div class="form-select-wrap">
            <select id="pg-conn-mode-select" class="form-select">
              <option value="127.0.0.1">Local VPS (127.0.0.1)</option>
              {% for rd in remote_domains if rd.enabled %}
                <option value="{{ rd.domain }}" data-sslmode="{{ 'verify-full' if rd.encryption_enabled else 'disable' }}">Remote {{ 'SSL' if rd.encryption_enabled else 'plain' }} ({{ rd.domain }})</option>
              {% endfor %}
              {% if not (remote_domains | selectattr('enabled') | list) %}
                <option value="" disabled>No remote endpoint configured</option>
              {% endif %}
            </select>
          </div>
        </div>

      </div>

      <!-- Password Input -->
      <div class="form-group">
        <label class="form-label" for="pg-conn-password-input">Password</label>
        <div class="d-flex gap-xs">
          <input type="password" id="pg-conn-password-input" class="form-input flex-1" placeholder="Enter password to reveal complete URLs">
          <button class="btn btn--secondary btn--sm" id="pg-conn-toggle-pw-btn" type="button">Show</button>
        </div>
      </div>

      <hr class="my-xs" style="border:none;border-top:1px solid var(--color-line);">

      <!-- Format 1: Standard Connection URI -->
      <div class="form-group">
        <label class="form-label" for="pg-conn-uri">Standard Connection URI</label>
        <div class="d-flex gap-xs">
          <input type="text" id="pg-conn-uri" class="form-input form-input--code flex-1" readonly>
          <button class="btn btn--secondary btn--sm" data-copy-target="pg-conn-uri">Copy</button>
        </div>
      </div>

      <!-- Format 2: Environment Variable (.env) -->
      <div class="form-group">
        <label class="form-label" for="pg-conn-env">Environment Variable (.env / Prisma / Drizzle)</label>
        <div class="d-flex gap-xs">
          <input type="text" id="pg-conn-env" class="form-input form-input--code flex-1" readonly>
          <button class="btn btn--secondary btn--sm" data-copy-target="pg-conn-env">Copy</button>
        </div>
      </div>

      <!-- Format 3: Individual Credential Breakdown -->
      <div class="conn-breakdown">
        <div><strong class="text-muted">Host:</strong> <span id="pg-conn-host-val">127.0.0.1</span></div>
        <div><strong class="text-muted">Port:</strong> <span id="pg-conn-port-val">5432</span></div>
        <div><strong class="text-muted">Database:</strong> <span id="pg-conn-db-val">—</span></div>
        <div><strong class="text-muted">User:</strong> <span id="pg-conn-user-val">—</span></div>
      </div>

    </div>
    <div class="modal__footer">
      <button class="btn btn--secondary" data-action="close-modal" data-modal="pg-modal-connection">Close</button>
    </div>
  </div>
</div>
