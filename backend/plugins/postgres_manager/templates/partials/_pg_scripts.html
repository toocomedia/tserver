<script type="module">
/**
 * _pg_scripts.html — PostgreSQL Manager vanilla JS module.
 * Handles: tab switching, modals, API fetch calls, result rendering, remote access form UX.
 */

const BASE = "/plugins/postgres_manager/api";
const csrfMeta = document.querySelector("meta[name='csrf-token']");
const CSRF = csrfMeta ? csrfMeta.content : "";

// ── Helpers ───────────────────────────────────────────────────────────────

async function apiFetch(path, opts = {}) {
  const headers = { "Content-Type": "application/json", "X-CSRF-Token": CSRF, ...(opts.headers || {}) };
  const res = await fetch(BASE + path, { ...opts, headers });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.detail || `HTTP ${res.status}`);
  return json;
}

function showToast(msg, isError = false) {
  if (window.showToast) { window.showToast(msg, isError ? "error" : "success"); return; }
  console[isError ? "error" : "log"](msg);
}

function openModal(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = "flex";
}

function closeModal(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = "none";
}

function setLoading(btn, loading) {
  if (!btn) return;
  btn.disabled = loading;
  btn.classList.toggle("is-loading", loading);
}

// ── Tab switching ─────────────────────────────────────────────────────────

const TABS = ["databases", "users", "system-roles", "remote", "query"];

function switchTab(tabId) {
  TABS.forEach(t => {
    const panel = document.getElementById("pg-panel-" + t);
    const tab = document.getElementById("pg-tab-" + t);
    if (panel) panel.style.display = t === tabId ? "" : "none";
    if (tab) tab.classList.toggle("active", t === tabId);
  });
}

document.querySelectorAll("[data-pg-tab]").forEach(btn => {
  btn.addEventListener("click", () => switchTab(btn.dataset.pgTab));
});

if (new URLSearchParams(window.location.search).get("tab") === "remote") {
  switchTab("remote");
}

// ── Connection URL & Credentials Generator Modal ─────────────────────────

function updateConnectionUrls() {
  const dbEl       = document.getElementById("pg-conn-db-name");
  const userSelect = document.getElementById("pg-conn-user-select");
  const modeSelect = document.getElementById("pg-conn-mode-select");
  const pwInput    = document.getElementById("pg-conn-password-input");

  const db       = (dbEl ? dbEl.value : "") || "my_db";
  const user     = (userSelect ? userSelect.value : "") || "postgres";
  const hostVal  = modeSelect ? modeSelect.value : "127.0.0.1";
  const password = (pwInput ? pwInput.value : "") || "YOUR_PASSWORD";

  let host = "127.0.0.1";
  let sslParam = "";

  if (hostVal && hostVal !== "127.0.0.1" && hostVal !== "local") {
    host = hostVal;
    if (modeSelect && modeSelect.selectedIndex >= 0) {
      const selected = modeSelect.options[modeSelect.selectedIndex];
      sslParam = `?sslmode=${selected.dataset.sslmode || "verify-full"}`;
    }
  }

  const uri = `postgresql://${encodeURIComponent(user)}:${encodeURIComponent(password)}@${host}:5432/${db}${sslParam}`;
  const env = `DATABASE_URL="${uri}"`;

  const uriEl  = document.getElementById("pg-conn-uri");
  const envEl  = document.getElementById("pg-conn-env");
  const hostEl = document.getElementById("pg-conn-host-val");
  const portEl = document.getElementById("pg-conn-port-val");
  const dbVal  = document.getElementById("pg-conn-db-val");
  const usrVal = document.getElementById("pg-conn-user-val");

  if (uriEl) uriEl.value = uri;
  if (envEl) envEl.value = env;
  if (hostEl) hostEl.textContent = host;
  if (portEl) portEl.textContent = "5432";
  if (dbVal) dbVal.textContent   = db;
  if (usrVal) usrVal.textContent = user;
}

document.addEventListener("click", e => {
  const btn = e.target.closest("[data-action='open-connection-modal']");
  if (!btn) return;
  const db     = btn.dataset.db;
  const owner  = btn.dataset.owner;
  const domain = btn.dataset.domain;

  if (db && document.getElementById("pg-conn-db-name")) {
    document.getElementById("pg-conn-db-name").value = db;
  }
  const userSelect = document.getElementById("pg-conn-user-select");
  if (userSelect && owner) userSelect.value = owner;
  const modeSelect = document.getElementById("pg-conn-mode-select");
  if (modeSelect && domain) modeSelect.value = domain;

  updateConnectionUrls();
  openModal("pg-modal-connection");
});

["pg-conn-user-select", "pg-conn-mode-select", "pg-conn-password-input"].forEach(id => {
  const el = document.getElementById(id);
  if (el) {
    el.addEventListener("input", updateConnectionUrls);
    el.addEventListener("change", updateConnectionUrls);
  }
});

const togglePwBtn = document.getElementById("pg-conn-toggle-pw-btn");
if (togglePwBtn) {
  togglePwBtn.addEventListener("click", () => {
    const pwInput = document.getElementById("pg-conn-password-input");
    if (!pwInput) return;
    if (pwInput.type === "password") {
      pwInput.type = "text";
      togglePwBtn.textContent = "Hide";
    } else {
      pwInput.type = "password";
      togglePwBtn.textContent = "Show";
    }
  });
}

// 1-Click Copy target helper
document.addEventListener("click", async e => {
  const copyBtn = e.target.closest("[data-copy-target]");
  if (!copyBtn) return;
  const targetId = copyBtn.dataset.copyTarget;
  const targetEl = document.getElementById(targetId);
  if (!targetEl) return;
  try {
    await navigator.clipboard.writeText(targetEl.value);
    const origText = copyBtn.textContent;
    copyBtn.textContent = "Copied!";
    setTimeout(() => { copyBtn.textContent = origText; }, 1800);
  } catch (err) {
    showToast("Failed to copy to clipboard.", true);
  }
});

// ── Remote Access Panel Interactive Logic ──────────────────────────────────

const remoteForm       = document.getElementById("pg-remote-add-form");
const remoteList       = document.getElementById("pg-remote-list");
const remoteHeaderList = document.getElementById("pg-remote-header-list");
const remoteFeedback   = document.getElementById("pg-remote-feedback");
const remoteManaged    = document.getElementById("pg-remote-managed");
const remoteExternal   = document.getElementById("pg-remote-external");

function updateRemoteMode() {
  const selectedModeInput = document.querySelector('input[name="pg-remote-mode"]:checked');
  if (!selectedModeInput) return;
  const isManaged = selectedModeInput.value === "managed";
  if (remoteManaged) remoteManaged.classList.toggle("is-hidden", !isManaged);
  if (remoteExternal) remoteExternal.classList.toggle("is-hidden", isManaged);
}

function updateRemotePreview() {
  const previewEl   = document.getElementById("pg-remote-preview");
  const subdomainEl = document.getElementById("pg-remote-subdomain");
  const domainEl    = document.getElementById("pg-remote-domain");
  if (!previewEl) return;
  const sub = (subdomainEl ? subdomainEl.value.trim() : "") || "db";
  const dom = (domainEl ? domainEl.value : "") || "example.com";
  previewEl.textContent = `${sub}.${dom}`;
}

const showAddBtn  = document.getElementById("pg-remote-show-add");
const emptyAddBtn = document.getElementById("pg-remote-empty-add");
const cancelAddBtn = document.getElementById("pg-remote-cancel-add");
const cancelAddFooterBtn = document.getElementById("pg-remote-cancel-add-footer");

function openAddRemoteForm() {
  if (remoteForm) remoteForm.classList.remove("is-hidden");
  if (remoteList) remoteList.classList.add("is-hidden");
  if (remoteHeaderList) remoteHeaderList.classList.add("is-hidden");
}

function closeAddRemoteForm() {
  if (remoteForm) remoteForm.classList.add("is-hidden");
  if (remoteList) remoteList.classList.remove("is-hidden");
  if (remoteHeaderList) remoteHeaderList.classList.remove("is-hidden");
}

if (showAddBtn) showAddBtn.addEventListener("click", openAddRemoteForm);
if (emptyAddBtn) emptyAddBtn.addEventListener("click", openAddRemoteForm);
if (cancelAddBtn) cancelAddBtn.addEventListener("click", closeAddRemoteForm);
if (cancelAddFooterBtn) cancelAddFooterBtn.addEventListener("click", closeAddRemoteForm);

document.querySelectorAll('input[name="pg-remote-mode"]').forEach(radio => {
  radio.addEventListener("change", updateRemoteMode);
});

const subInput = document.getElementById("pg-remote-subdomain");
const domSelect = document.getElementById("pg-remote-domain");
if (subInput) subInput.addEventListener("input", updateRemotePreview);
if (domSelect) domSelect.addEventListener("change", updateRemotePreview);

const allowAllBtn = document.getElementById("pg-remote-allow-all");
if (allowAllBtn) {
  allowAllBtn.addEventListener("click", () => {
    const cidrsInput = document.getElementById("pg-remote-cidrs");
    if (cidrsInput) cidrsInput.value = "0.0.0.0/0";
  });
}

if (remoteForm) {
  remoteForm.addEventListener("submit", async e => {
    e.preventDefault();
    const submitBtn  = remoteForm.querySelector('[type="submit"]');
    const errEl      = document.getElementById("pg-remote-error");
    const modeRadio  = document.querySelector('input[name="pg-remote-mode"]:checked');
    const encRadio   = document.querySelector('input[name="pg-remote-encryption"]:checked');
    const cidrInput  = document.getElementById("pg-remote-cidrs");
    const activeMode = modeRadio ? modeRadio.value : "managed";

    if (errEl) { errEl.textContent = ""; errEl.style.display = "none"; }
    setLoading(submitBtn, true);

    const body = {
      mode: activeMode,
      domain: activeMode === "managed" ? (domSelect ? domSelect.value : null) : null,
      subdomain: activeMode === "managed" ? (subInput ? subInput.value.trim() : null) : null,
      hostname: activeMode === "external" ? (document.getElementById("pg-remote-hostname")?.value.trim() || null) : null,
      encryption_enabled: encRadio ? encRadio.value === "true" : true,
      allowed_cidrs: cidrInput ? cidrInput.value.split(",").map(x => x.trim()).filter(Boolean) : ["0.0.0.0/0"],
    };

    try {
      await apiFetch("/remote/domains", {
        method: "POST",
        body: JSON.stringify(body),
      });
      showToast("Remote endpoint enabled.");
      window.location.href = "/plugins/postgres_manager/?tab=remote";
    } catch (err) {
      if (errEl) {
        errEl.textContent = err.message || "Could not enable remote access.";
        errEl.style.display = "block";
      } else {
        showToast(err.message, true);
      }
      setLoading(submitBtn, false);
    }
  });
}

// Remote Table Actions (Connection URL, Test, Renew SSL, Delete)
document.addEventListener("click", async e => {
  const connBtn = e.target.closest("[data-pg-connection-host]");
  if (connBtn) {
    const host   = connBtn.dataset.pgConnectionHost;
    const modeSel = document.getElementById("pg-conn-mode-select");
    if (modeSel && host) {
      modeSel.value = host;
      modeSel.dispatchEvent(new Event("change"));
    }
    updateConnectionUrls();
    openModal("pg-modal-connection");
    return;
  }

  const actionBtn = e.target.closest("[data-pg-remote-action]");
  if (!actionBtn) return;

  const action = actionBtn.dataset.pgRemoteAction;
  const domain = actionBtn.dataset.domain;
  if (!action || !domain) return;

  if (action === "delete" && !confirm(`Delete remote endpoint '${domain}'?`)) return;

  setLoading(actionBtn, true);
  if (remoteFeedback) {
    remoteFeedback.style.display = "block";
    remoteFeedback.textContent = action === "test" ? `Testing connection to ${domain}…` : action === "ssl" ? `Issuing SSL certificate for ${domain}…` : `Deleting ${domain}…`;
  }

  try {
    const suffix = action === "delete" ? "" : `/${action}`;
    const res = await apiFetch(`/remote/domains/${encodeURIComponent(domain)}${suffix}`, {
      method: action === "delete" ? "DELETE" : "POST",
    });

    if (action === "test") {
      const msg = res.message || `${domain} is configured and ready for connections.`;
      if (remoteFeedback) remoteFeedback.textContent = msg;
      showToast(msg);
      setLoading(actionBtn, false);
      return;
    }

    if (action === "ssl") {
      showToast(`SSL configured for ${domain}.`);
    } else if (action === "delete") {
      showToast(`Remote endpoint '${domain}' deleted.`);
    }

    window.location.href = "/plugins/postgres_manager/?tab=remote";
  } catch (err) {
    if (remoteFeedback) remoteFeedback.textContent = err.message;
    showToast(err.message, true);
    setLoading(actionBtn, false);
  }
});

updateRemoteMode();
updateRemotePreview();

// ── Modal open/close (data-action) ────────────────────────────────────────

document.addEventListener("click", e => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;
  const modal  = btn.dataset.modal;
  if (action === "open-modal" && modal) openModal(modal);
  if (action === "close-modal" && modal) closeModal(modal);
});

// Close modal on backdrop click
document.querySelectorAll(".modal-backdrop").forEach(backdrop => {
  backdrop.addEventListener("click", e => {
    if (e.target === backdrop) backdrop.style.display = "none";
  });
});

// ── Service controls ──────────────────────────────────────────────────────

document.querySelectorAll("[data-pg-action]").forEach(btn => {
  btn.addEventListener("click", async () => {
    const action = btn.dataset.pgAction;
    setLoading(btn, true);
    try {
      await apiFetch(`/service/${action}`, { method: "POST" });
      showToast(`PostgreSQL ${action} executed.`);
      setTimeout(() => location.reload(), 1200);
    } catch (err) {
      showToast(err.message, true);
    } finally {
      setLoading(btn, false);
    }
  });
});

// ── Databases CRUD ────────────────────────────────────────────────────────

const ownerModeExisting = document.getElementById("pg-owner-mode-existing");
const ownerModeNew      = document.getElementById("pg-owner-mode-new");
const existingWrap      = document.getElementById("pg-owner-existing-wrap");
const newWrap           = document.getElementById("pg-owner-new-wrap");

if (ownerModeExisting && ownerModeNew) {
  const toggleOwnerMode = () => {
    if (ownerModeNew.checked) {
      if (existingWrap) existingWrap.style.display = "none";
      if (newWrap) newWrap.style.display = "flex";
    } else {
      if (existingWrap) existingWrap.style.display = "";
      if (newWrap) newWrap.style.display = "none";
    }
  };
  ownerModeExisting.addEventListener("change", toggleOwnerMode);
  ownerModeNew.addEventListener("change", toggleOwnerMode);
}

const dbSubmit = document.getElementById("pg-db-create-submit");
if (dbSubmit) {
  dbSubmit.addEventListener("click", async () => {
    const name  = document.getElementById("pg-new-db-name")?.value.trim();
    const errEl = document.getElementById("pg-db-error");
    if (errEl) errEl.style.display = "none";
    if (!name) {
      if (errEl) { errEl.textContent = "Database name is required."; errEl.style.display = ""; }
      return;
    }

    const isNewUser = ownerModeNew && ownerModeNew.checked;
    let owner = "postgres";

    setLoading(dbSubmit, true);
    try {
      if (isNewUser) {
        const username  = document.getElementById("pg-new-owner-username")?.value.trim();
        const password  = document.getElementById("pg-new-owner-password")?.value;
        const confirmEl = document.getElementById("pg-new-owner-password-confirm");
        const confirmPw = confirmEl ? confirmEl.value : "";
        if (!username || !password) {
          if (errEl) { errEl.textContent = "New username and password are required."; errEl.style.display = ""; }
          setLoading(dbSubmit, false);
          return;
        }
        if (password !== confirmPw) {
          if (errEl) { errEl.textContent = "Passwords do not match."; errEl.style.display = ""; }
          setLoading(dbSubmit, false);
          return;
        }
        if (password.length < 8) {
          if (errEl) { errEl.textContent = "Password must be at least 8 characters."; errEl.style.display = ""; }
          setLoading(dbSubmit, false);
          return;
        }
        await apiFetch("/users", { method: "POST", body: JSON.stringify({ name: username, password }) });
        owner = username;
      } else {
        const select = document.getElementById("pg-new-db-owner-select");
        owner = select ? select.value : "postgres";
      }

      await apiFetch("/databases", { method: "POST", body: JSON.stringify({ name, owner }) });
      showToast(`Database '${name}' created.`);
      closeModal("pg-modal-create-db");
      location.reload();
    } catch (err) {
      if (errEl) { errEl.textContent = err.message; errEl.style.display = ""; }
    } finally {
      setLoading(dbSubmit, false);
    }
  });
}

document.addEventListener("click", async e => {
  const btn = e.target.closest("[data-action='delete-db']");
  if (!btn) return;
  const db = btn.dataset.db;
  if (!confirm(`Drop database '${db}'? This cannot be undone.`)) return;
  setLoading(btn, true);
  try {
    await apiFetch(`/databases/${encodeURIComponent(db)}`, { method: "DELETE" });
    showToast(`Database '${db}' dropped.`);
    location.reload();
  } catch (err) {
    showToast(err.message, true);
    setLoading(btn, false);
  }
});

document.addEventListener("click", async e => {
  const btn = e.target.closest("[data-action='view-tables']");
  if (!btn) return;
  const db = btn.dataset.db;
  const drawer = document.getElementById("pg-tables-drawer");
  const tbody  = document.getElementById("pg-tables-tbody");
  const nameEl = document.getElementById("pg-tables-db-name");
  if (!drawer || !tbody) return;
  if (nameEl) nameEl.textContent = db;
  drawer.style.display = "";
  tbody.innerHTML = "<tr><td colspan='3' style='color:var(--color-muted);padding:14px;'>Loading tables…</td></tr>";
  try {
    const tables = await apiFetch(`/databases/${encodeURIComponent(db)}/tables`);
    tbody.innerHTML = tables.length
      ? tables.map(t => `<tr><td><strong style='color:var(--color-text);'>${t.name}</strong></td><td style='color:var(--color-muted);'>${t.row_count}</td><td style='color:var(--color-muted);'>${t.size}</td></tr>`).join("")
      : "<tr><td colspan='3' style='color:var(--color-muted);padding:14px;'>No user tables found.</td></tr>";
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan='3' style='color:var(--color-danger);padding:14px;'>${err.message}</td></tr>`;
  }
});

const closeTablesBtn = document.getElementById("pg-tables-close-btn");
if (closeTablesBtn) {
  closeTablesBtn.addEventListener("click", () => {
    const drawer = document.getElementById("pg-tables-drawer");
    if (drawer) drawer.style.display = "none";
  });
}

// ── Users CRUD ────────────────────────────────────────────────────────────

const userSubmit = document.getElementById("pg-user-create-submit");
if (userSubmit) {
  userSubmit.addEventListener("click", async () => {
    const name      = document.getElementById("pg-new-user-name")?.value.trim();
    const password  = document.getElementById("pg-new-user-pw")?.value;
    const confirmEl = document.getElementById("pg-new-user-pw-confirm");
    const confirmPw = confirmEl ? confirmEl.value : "";
    const errEl     = document.getElementById("pg-user-error");
    if (errEl) errEl.style.display = "none";

    if (!name || !password) {
      if (errEl) { errEl.textContent = "Username and password are required."; errEl.style.display = ""; }
      return;
    }
    if (password !== confirmPw) {
      if (errEl) { errEl.textContent = "Passwords do not match."; errEl.style.display = ""; }
      return;
    }
    if (password.length < 8) {
      if (errEl) { errEl.textContent = "Password must be at least 8 characters."; errEl.style.display = ""; }
      return;
    }

    setLoading(userSubmit, true);
    try {
      await apiFetch("/users", { method: "POST", body: JSON.stringify({ name, password }) });
      showToast(`User '${name}' created.`);
      closeModal("pg-modal-create-user");
      location.reload();
    } catch (err) {
      if (errEl) { errEl.textContent = err.message; errEl.style.display = ""; }
    } finally {
      setLoading(userSubmit, false);
    }
  });
}

document.addEventListener("click", e => {
  const btn = e.target.closest("[data-action='change-password']");
  if (!btn) return;
  const user = btn.dataset.user;
  const usernameEl = document.getElementById("pg-pw-username");
  const inputEl    = document.getElementById("pg-change-pw-input");
  if (usernameEl) usernameEl.textContent = user;
  if (inputEl) inputEl.dataset.user = user;
  openModal("pg-modal-change-pw");
});

const pwSubmit = document.getElementById("pg-pw-submit");
if (pwSubmit) {
  pwSubmit.addEventListener("click", async () => {
    const input    = document.getElementById("pg-change-pw-input");
    const name     = input ? input.dataset.user : "";
    const password = input ? input.value : "";
    const errEl    = document.getElementById("pg-pw-error");
    if (errEl) errEl.style.display = "none";

    if (!password) {
      if (errEl) { errEl.textContent = "Password is required."; errEl.style.display = ""; }
      return;
    }

    setLoading(pwSubmit, true);
    try {
      await apiFetch(`/users/${encodeURIComponent(name)}/password`, { method: "POST", body: JSON.stringify({ password }) });
      showToast(`Password updated for '${name}'.`);
      closeModal("pg-modal-change-pw");
    } catch (err) {
      if (errEl) { errEl.textContent = err.message; errEl.style.display = ""; }
    } finally {
      setLoading(pwSubmit, false);
    }
  });
}

document.addEventListener("click", async e => {
  const btn = e.target.closest("[data-action='delete-user']");
  if (!btn) return;
  const user = btn.dataset.user;
  if (!confirm(`Drop role '${user}'? This cannot be undone.`)) return;
  setLoading(btn, true);
  try {
    await apiFetch(`/users/${encodeURIComponent(user)}`, { method: "DELETE" });
    showToast(`User '${user}' dropped.`);
    location.reload();
  } catch (err) {
    showToast(err.message, true);
    setLoading(btn, false);
  }
});

// ── Query Runner ──────────────────────────────────────────────────────────

const runBtn = document.getElementById("pg-query-run");
if (runBtn) {
  runBtn.addEventListener("click", async () => {
    const dbSelect = document.getElementById("pg-query-db");
    const sqlInput = document.getElementById("pg-query-sql");
    const db  = dbSelect ? dbSelect.value : "";
    const sql = sqlInput ? sqlInput.value.trim() : "";

    const errEl     = document.getElementById("pg-query-error");
    const resultsEl = document.getElementById("pg-query-results");
    const emptyEl   = document.getElementById("pg-query-empty");
    const tbody     = document.getElementById("pg-query-tbody");
    const countEl   = document.getElementById("pg-query-count");

    if (errEl) errEl.style.display = "none";
    if (resultsEl) resultsEl.style.display = "none";
    if (emptyEl) emptyEl.style.display = "none";

    if (!sql) {
      if (errEl) { errEl.textContent = "Enter a SELECT query."; errEl.style.display = "block"; }
      return;
    }

    setLoading(runBtn, true);
    try {
      const data = await apiFetch("/query", { method: "POST", body: JSON.stringify({ db, sql }) });
      if (!data.rows || data.rows.length === 0) {
        if (emptyEl) emptyEl.style.display = "block";
        return;
      }

      if (tbody) {
        tbody.innerHTML = data.rows.map(r => {
          const cols = (r.row || "").split("|");
          return "<tr>" + cols.map(c => `<td>${c}</td>`).join("") + "</tr>";
        }).join("");
      }

      if (countEl) countEl.textContent = `${data.count} row${data.count !== 1 ? "s" : ""}`;
      if (resultsEl) resultsEl.style.display = "block";
    } catch (err) {
      if (errEl) { errEl.textContent = err.message; errEl.style.display = "block"; }
    } finally {
      setLoading(runBtn, false);
    }
  });
}

const clearBtn = document.getElementById("pg-query-clear");
if (clearBtn) {
  clearBtn.addEventListener("click", () => {
    const sqlInput = document.getElementById("pg-query-sql");
    if (sqlInput) sqlInput.value = "";
    if (document.getElementById("pg-query-results")) document.getElementById("pg-query-results").style.display = "none";
    if (document.getElementById("pg-query-empty")) document.getElementById("pg-query-empty").style.display = "none";
    if (document.getElementById("pg-query-error")) document.getElementById("pg-query-error").style.display = "none";
  });
}

// Default tab selection fallback
switchTab("databases");
</script>
