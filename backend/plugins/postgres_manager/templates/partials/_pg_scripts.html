<script>
/**
 * _pg_scripts.html — PostgreSQL Manager Core Scripts
 */
(function () {
  'use strict';
  const BASE = "/plugins/postgres_manager/api";
  const csrfMeta = document.querySelector("meta[name='csrf-token']");
  const CSRF = csrfMeta ? csrfMeta.content : "";

  // ── Global Plugin Helpers ──────────────────────────────────────────────────
  window._pgApiFetch = async function (path, opts = {}) {
    const headers = { "Content-Type": "application/json", "X-CSRF-Token": CSRF, ...(opts.headers || {}) };
    const res = await fetch(BASE + path, { ...opts, headers });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.detail || `HTTP ${res.status}`);
    return json;
  };

  window._pgShowToast = function (msg, isError = false) {
    if (window.toast) { window.toast(msg, isError ? "danger" : "success"); return; }
    if (window.showToast) { window.showToast(msg, isError ? "error" : "success"); return; }
    console[isError ? "error" : "log"](msg);
  };

  window._pgOpenModal = function (id) {
    const el = document.getElementById(id);
    if (el) { el.style.display = "flex"; el.classList.remove("hidden"); }
  };

  window._pgCloseModal = function (id) {
    const el = document.getElementById(id);
    if (el) { el.style.display = "none"; el.classList.add("hidden"); }
  };

  window._pgSetLoading = function (btn, loading) {
    if (!btn) return;
    btn.disabled = loading;
    btn.classList.toggle("is-loading", loading);
  };

  // ── Tab Switching ─────────────────────────────────────────────────────────
  const TABS = ["databases", "users", "system-roles", "query", "remote", "service-info"];

  window.switchTab = function (tabId, btnEl) {
    TABS.forEach(t => {
      const panel = document.getElementById("pg-panel-" + t);
      const tabBtn = document.getElementById("pg-tab-" + t);
      if (panel) panel.style.display = t === tabId ? "" : "none";
      if (tabBtn) tabBtn.classList.toggle("is-active", t === tabId);
    });
  };

  document.querySelectorAll("[data-pg-tab]").forEach(btn => {
    btn.addEventListener("click", () => window.switchTab(btn.dataset.pgTab, btn));
  });

  if (new URLSearchParams(window.location.search).get("tab") === "remote") {
    window.switchTab("remote");
  }

  // ── Search Filtering ──────────────────────────────────────────────────────
  window.onPgDbSearch = function (query) {
    const q = (query || "").trim().toLowerCase();
    document.querySelectorAll("#pg-db-tbody tr[data-db]").forEach(r => {
      r.style.display = r.dataset.db.toLowerCase().includes(q) ? "" : "none";
    });
  };

  window.onPgUserSearch = function (query) {
    const q = (query || "").trim().toLowerCase();
    document.querySelectorAll("#pg-user-tbody tr[data-user]").forEach(r => {
      r.style.display = r.dataset.user.toLowerCase().includes(q) ? "" : "none";
    });
  };

  // ── Connection URL Generator Modal ───────────────────────────────────────
  function updateConnectionUrls() {
    const db         = document.getElementById("pg-conn-db-name").value || "my_db";
    const user       = document.getElementById("pg-conn-user-select").value || "postgres";
    const modeSelect = document.getElementById("pg-conn-mode-select");
    const hostVal    = modeSelect ? modeSelect.value : "127.0.0.1";
    const password   = document.getElementById("pg-conn-password-input").value || "YOUR_PASSWORD";

    let host = "127.0.0.1";
    let sslParam = "";

    if (hostVal && hostVal !== "127.0.0.1" && hostVal !== "local") {
      host = hostVal;
      const selected = modeSelect.options[modeSelect.selectedIndex];
      sslParam = `?sslmode=${selected ? selected.dataset.sslmode || "verify-full" : "verify-full"}`;
    }

    const uri = `postgresql://${encodeURIComponent(user)}:${encodeURIComponent(password)}@${host}:5432/${db}${sslParam}`;
    const env = `DATABASE_URL="${uri}"`;

    const uriEl = document.getElementById("pg-conn-uri");
    const envEl = document.getElementById("pg-conn-env");
    if (uriEl) uriEl.value = uri;
    if (envEl) envEl.value = env;

    const hostValEl = document.getElementById("pg-conn-host-val");
    const portValEl = document.getElementById("pg-conn-port-val");
    const dbValEl   = document.getElementById("pg-conn-db-val");
    const userValEl = document.getElementById("pg-conn-user-val");

    if (hostValEl) hostValEl.textContent = host;
    if (portValEl) portValEl.textContent = "5432";
    if (dbValEl)   dbValEl.textContent   = db;
    if (userValEl) userValEl.textContent = user;
  }

  document.addEventListener("click", e => {
    const connBtn = e.target.closest("[data-action='open-connection-modal']");
    if (connBtn) {
      const db     = connBtn.dataset.db;
      const owner  = connBtn.dataset.owner;
      const domain = connBtn.dataset.domain;
      if (db) {
        const dbInput = document.getElementById("pg-conn-db-name");
        if (dbInput) dbInput.value = db;
      }
      const userSelect = document.getElementById("pg-conn-user-select");
      if (userSelect && owner) userSelect.value = owner;
      const modeSelect = document.getElementById("pg-conn-mode-select");
      if (modeSelect && domain) modeSelect.value = domain;
      updateConnectionUrls();
      window._pgOpenModal("pg-modal-connection");
      return;
    }

    const modalOpenBtn = e.target.closest("[data-action='open-modal']");
    if (modalOpenBtn) {
      const modal = modalOpenBtn.dataset.modal;
      if (modal) window._pgOpenModal(modal);
      return;
    }

    const modalCloseBtn = e.target.closest("[data-action='close-modal']");
    if (modalCloseBtn) {
      const modal = modalCloseBtn.dataset.modal;
      if (modal) window._pgCloseModal(modal);
      return;
    }
  });

  ["pg-conn-user-select", "pg-conn-mode-select", "pg-conn-password-input"].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener("input", updateConnectionUrls);
      el.addEventListener("change", updateConnectionUrls);
    }
  });

  const togglePwBtn = document.getElementById("pg-conn-toggle-pw-btn");
  if (togglePwBtn) {
    togglePwBtn.addEventListener("click", () => {
      const pwInput = document.getElementById("pg-conn-password-input");
      if (pwInput.type === "password") {
        pwInput.type = "text";
        togglePwBtn.textContent = "Hide";
      } else {
        pwInput.type = "password";
        togglePwBtn.textContent = "Show";
      }
    });
  }

  // 1-Click Copy target helper
  document.addEventListener("click", async e => {
    const copyBtn = e.target.closest("[data-copy-target]");
    if (!copyBtn) return;
    const targetId = copyBtn.dataset.copyTarget;
    const targetEl = document.getElementById(targetId);
    if (!targetEl) return;
    try {
      await navigator.clipboard.writeText(targetEl.value || targetEl.textContent);
      const origText = copyBtn.textContent;
      copyBtn.textContent = "Copied!";
      setTimeout(() => copyBtn.textContent = origText, 1500);
      window._pgShowToast("Copied to clipboard!");
    } catch (err) {
      window._pgShowToast("Copy failed", true);
    }
  });

  document.querySelectorAll(".modal-backdrop").forEach(backdrop => {
    backdrop.addEventListener("click", e => {
      if (e.target === backdrop && !backdrop.hasAttribute("data-no-backdrop-close")) {
        backdrop.style.display = "none";
        backdrop.classList.add("hidden");
      }
    });
  });

  window.switchTab("databases");
})();
</script>
