<script type="module">
/**
 * _pg_scripts.html — PostgreSQL Manager vanilla JS module.
 * Handles: tab switching, modals, API fetch calls, result rendering.
 * No jQuery. No global variables. ES6 module scope.
 */

const BASE = "/plugins/postgres_manager/api";
const csrfMeta = document.querySelector("meta[name='csrf-token']");
const CSRF = csrfMeta ? csrfMeta.content : "";

// ── Helpers ───────────────────────────────────────────────────────────────

async function apiFetch(path, opts = {}) {
  const headers = { "Content-Type": "application/json", "X-CSRF-Token": CSRF, ...(opts.headers || {}) };
  const res = await fetch(BASE + path, { ...opts, headers });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.detail || `HTTP ${res.status}`);
  return json;
}

function showToast(msg, isError = false) {
  // Re-uses the panel's global showToast if available, else console.
  if (window.showToast) { window.showToast(msg, isError ? "error" : "success"); return; }
  console[isError ? "error" : "log"](msg);
}

function openModal(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = "flex";
}

function closeModal(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = "none";
}

function setLoading(btn, loading) {
  btn.disabled = loading;
  btn.classList.toggle("is-loading", loading);
}

// ── Tab switching ─────────────────────────────────────────────────────────

const TABS = ["databases", "users", "system-roles", "remote", "query"];

function switchTab(tabId) {
  TABS.forEach(t => {
    const panel = document.getElementById("pg-panel-" + t);
    const tab = document.getElementById("pg-tab-" + t);
    if (panel) panel.style.display = t === tabId ? "" : "none";
    if (tab) tab.classList.toggle("active", t === tabId);
  });
}

document.querySelectorAll("[data-pg-tab]").forEach(btn => {
  btn.addEventListener("click", () => switchTab(btn.dataset.pgTab));
});

// ── Connection URL & Credentials Generator Modal ─────────────────────────

function updateConnectionUrls() {
  const db         = document.getElementById("pg-conn-db-name").value || "my_db";
  const user       = document.getElementById("pg-conn-user-select").value || "postgres";
  const modeSelect = document.getElementById("pg-conn-mode-select");
  const hostVal    = modeSelect ? modeSelect.value : "127.0.0.1";
  const password   = document.getElementById("pg-conn-password-input").value || "YOUR_PASSWORD";

  let host = "127.0.0.1";
  let sslParam = "";

  if (hostVal !== "127.0.0.1" && hostVal !== "local") {
    host = hostVal;
    sslParam = "?sslmode=require";
  }

  const uri = `postgresql://${encodeURIComponent(user)}:${encodeURIComponent(password)}@${host}:5432/${db}${sslParam}`;
  const env = `DATABASE_URL="${uri}"`;

  document.getElementById("pg-conn-uri").value = uri;
  document.getElementById("pg-conn-env").value = env;

  document.getElementById("pg-conn-host-val").textContent = host;
  document.getElementById("pg-conn-port-val").textContent = "5432";
  document.getElementById("pg-conn-db-val").textContent   = db;
  document.getElementById("pg-conn-user-val").textContent = user;
}

document.addEventListener("click", e => {
  const btn = e.target.closest("[data-action='open-connection-modal']");
  if (!btn) return;
  const db     = btn.dataset.db;
  const owner  = btn.dataset.owner;
  const domain = btn.dataset.domain;
  if (db) document.getElementById("pg-conn-db-name").value = db;
  const userSelect = document.getElementById("pg-conn-user-select");
  if (userSelect && owner) userSelect.value = owner;
  const modeSelect = document.getElementById("pg-conn-mode-select");
  if (modeSelect && domain) modeSelect.value = domain;
  updateConnectionUrls();
  openModal("pg-modal-connection");
});

["pg-conn-user-select", "pg-conn-mode-select", "pg-conn-password-input"].forEach(id => {
  const el = document.getElementById(id);
  if (el) {
    el.addEventListener("input", updateConnectionUrls);
    el.addEventListener("change", updateConnectionUrls);
  }
});

const togglePwBtn = document.getElementById("pg-conn-toggle-pw-btn");
if (togglePwBtn) {
  togglePwBtn.addEventListener("click", () => {
    const pwInput = document.getElementById("pg-conn-password-input");
    if (pwInput.type === "password") {
      pwInput.type = "text";
      togglePwBtn.textContent = "Hide";
    } else {
      pwInput.type = "password";
      togglePwBtn.textContent = "Show";
    }
  });
}

// 1-Click Copy target helper
document.addEventListener("click", async e => {
  const copyBtn = e.target.closest("[data-copy-target]");
  if (!copyBtn) return;
  const targetId = copyBtn.dataset.copyTarget;
  const targetEl = document.getElementById(targetId);
  if (!targetEl) return;
  try {
    await navigator.clipboard.writeText(targetEl.value);
    const origText = copyBtn.textContent;
    copyBtn.textContent = "Copied!";
    setTimeout(() => { copyBtn.textContent = origText; }, 1800);
  } catch (err) {
    showToast("Failed to copy to clipboard.", true);
  }
});

// ── Step-by-Step Remote Domain Wizard Logic ───────────────────────────────

let currentWizStep = 1;

const wizStep1 = document.getElementById("pg-remote-wiz-step-1");
const wizStep2 = document.getElementById("pg-remote-wiz-step-2");
const wizStep3 = document.getElementById("pg-remote-wiz-step-3");
const wizNextBtn   = document.getElementById("pg-remote-wiz-btn-next");
const wizBackBtn   = document.getElementById("pg-remote-wiz-btn-back");
const wizSubmitBtn = document.getElementById("pg-remote-wiz-btn-submit");
const wizErrEl     = document.getElementById("pg-remote-wiz-error");

const wizModeManaged  = document.getElementById("pg-remote-wiz-mode-managed");
const wizModeExternal = document.getElementById("pg-remote-wiz-mode-external");
const wizManagedWrap  = document.getElementById("pg-remote-wiz-managed-wrap");
const wizExternalWrap = document.getElementById("pg-remote-wiz-external-wrap");
const wizDomainSelect = document.getElementById("pg-remote-wiz-domain-select");
const wizSubdomainInp = document.getElementById("pg-remote-wiz-subdomain");
const wizFullHint     = document.getElementById("pg-remote-wiz-full-hint");

if (wizModeManaged && wizModeExternal) {
  const toggleWizMode = () => {
    if (wizModeExternal.checked) {
      if (wizManagedWrap) wizManagedWrap.style.display = "none";
      if (wizExternalWrap) wizExternalWrap.style.display = "flex";
    } else {
      if (wizManagedWrap) wizManagedWrap.style.display = "flex";
      if (wizExternalWrap) wizExternalWrap.style.display = "none";
    }
  };
  wizModeManaged.addEventListener("change", toggleWizMode);
  wizModeExternal.addEventListener("change", toggleWizMode);
}

function updateWizHint() {
  if (!wizFullHint) return;
  const sub = (wizSubdomainInp ? wizSubdomainInp.value.trim() : "") || "db";
  const dom = (wizDomainSelect ? wizDomainSelect.value : "") || "example.com";
  wizFullHint.textContent = `${sub}.${dom}`;
}

if (wizDomainSelect) wizDomainSelect.addEventListener("change", updateWizHint);
if (wizSubdomainInp) wizSubdomainInp.addEventListener("input", updateWizHint);

function getWizHost() {
  const isManaged = wizModeManaged ? wizModeManaged.checked : true;
  if (isManaged) {
    const dom = wizDomainSelect ? wizDomainSelect.value : "";
    const sub = wizSubdomainInp ? wizSubdomainInp.value.trim() : "";
    if (!dom || !sub) return null;
    return `${sub}.${dom}`;
  } else {
    const ext = document.getElementById("pg-remote-wiz-external");
    return ext ? ext.value.trim() : null;
  }
}

function setWizStep(step) {
  currentWizStep = step;
  if (wizErrEl) wizErrEl.style.display = "none";

  if (wizStep1) wizStep1.style.display = step === 1 ? "flex" : "none";
  if (wizStep2) wizStep2.style.display = step === 2 ? "flex" : "none";
  if (wizStep3) wizStep3.style.display = step === 3 ? "flex" : "none";

  const pill1 = document.getElementById("pg-remote-step-pill-1");
  const pill2 = document.getElementById("pg-remote-step-pill-2");
  const pill3 = document.getElementById("pg-remote-step-pill-3");

  if (pill1) pill1.className = step >= 1 ? "status-badge success" : "status-badge muted";
  if (pill2) pill2.className = step >= 2 ? "status-badge success" : "status-badge muted";
  if (pill3) pill3.className = step >= 3 ? "status-badge success" : "status-badge muted";

  if (wizBackBtn) wizBackBtn.style.display = step > 1 ? "" : "none";
  if (wizNextBtn) wizNextBtn.style.display = step < 3 ? "" : "none";
  if (wizSubmitBtn) wizSubmitBtn.style.display = step === 3 ? "" : "none";

  if (step === 3) {
    const host = getWizHost();
    const isManaged = wizModeManaged ? wizModeManaged.checked : true;
    const issueSsl = document.getElementById("pg-remote-wiz-ssl") ? document.getElementById("pg-remote-wiz-ssl").checked : true;

    document.getElementById("pg-remote-wiz-review-host").textContent = host || "Invalid Hostname";
    document.getElementById("pg-remote-wiz-review-mode").textContent = isManaged ? "Managed Domain (Subdomain)" : "External Hostname";
    document.getElementById("pg-remote-wiz-review-ssl").textContent  = issueSsl ? "Enabled (Let's Encrypt)" : "Disabled (No SSL)";
  }
}

if (wizNextBtn) {
  wizNextBtn.addEventListener("click", () => {
    if (currentWizStep === 1) {
      const host = getWizHost();
      if (!host) {
        if (wizErrEl) { wizErrEl.textContent = "Enter a valid hostname / subdomain."; wizErrEl.style.display = ""; }
        return;
      }
    }
    setWizStep(currentWizStep + 1);
  });
}

if (wizBackBtn) {
  wizBackBtn.addEventListener("click", () => setWizStep(currentWizStep - 1));
}

if (wizSubmitBtn) {
  wizSubmitBtn.addEventListener("click", async () => {
    const isManaged = wizModeManaged ? wizModeManaged.checked : true;
    const mode      = isManaged ? "managed" : "external";
    const domain    = wizDomainSelect ? wizDomainSelect.value : null;
    const subdomain = wizSubdomainInp ? wizSubdomainInp.value.trim() : null;
    const hostname  = document.getElementById("pg-remote-wiz-external") ? document.getElementById("pg-remote-wiz-external").value.trim() : null;
    const issue_ssl = document.getElementById("pg-remote-wiz-ssl") ? document.getElementById("pg-remote-wiz-ssl").checked : true;

    if (wizErrEl) wizErrEl.style.display = "none";
    setLoading(wizSubmitBtn, true);
    try {
      const res = await apiFetch("/remote/domains", {
        method: "POST",
        body: JSON.stringify({ mode, domain, subdomain, hostname, issue_ssl }),
      });
      showToast(`Remote endpoint '${res.entry.domain}' added successfully!`);
      closeModal("pg-modal-add-remote");
      setTimeout(() => location.reload(), 1200);
    } catch (err) {
      if (wizErrEl) { wizErrEl.textContent = err.message; wizErrEl.style.display = ""; }
      else { showToast(err.message, true); }
    } finally {
      setLoading(wizSubmitBtn, false);
    }
  });
}

// Re-issue SSL action button
document.addEventListener("click", async e => {
  const btn = e.target.closest("[data-action='reissue-remote-ssl']");
  if (!btn) return;
  const domain = btn.dataset.domain;
  if (!domain) return;
  setLoading(btn, true);
  try {
    const res = await apiFetch(`/remote/domains/${encodeURIComponent(domain)}/ssl`, { method: "POST" });
    if (res.entry && res.entry.ssl_active) {
      showToast(`SSL certificate issued for ${domain}!`);
    } else {
      showToast(`Certbot attempt completed for ${domain}. Check domain DNS.`, true);
    }
    setTimeout(() => location.reload(), 1200);
  } catch (err) {
    showToast(err.message, true);
    setLoading(btn, false);
  }
});

// Delete Remote Domain action button
document.addEventListener("click", async e => {
  const btn = e.target.closest("[data-action='delete-remote-domain']");
  if (!btn) return;
  const domain = btn.dataset.domain;
  if (!domain) return;
  if (!confirm(`Delete remote endpoint '${domain}'? Nginx stream proxy config will be removed.`)) return;
  setLoading(btn, true);
  try {
    await apiFetch(`/remote/domains/${encodeURIComponent(domain)}`, { method: "DELETE" });
    showToast(`Remote endpoint '${domain}' deleted.`);
    location.reload();
  } catch (err) {
    showToast(err.message, true);
    setLoading(btn, false);
  }
});



// ── Modal open/close (data-action) ────────────────────────────────────────

document.addEventListener("click", e => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;
  const modal  = btn.dataset.modal;
  if (action === "open-modal" && modal) openModal(modal);
  if (action === "close-modal" && modal) closeModal(modal);
});

// Close modal on backdrop click
document.querySelectorAll(".modal-backdrop").forEach(backdrop => {
  backdrop.addEventListener("click", e => {
    if (e.target === backdrop) backdrop.style.display = "none";
  });
});

// ── Service controls ──────────────────────────────────────────────────────

document.querySelectorAll("[data-pg-action]").forEach(btn => {
  btn.addEventListener("click", async () => {
    const action = btn.dataset.pgAction;
    setLoading(btn, true);
    try {
      await apiFetch(`/service/${action}`, { method: "POST" });
      showToast(`PostgreSQL ${action} executed.`);
      setTimeout(() => location.reload(), 1500);
    } catch (err) {
      showToast(err.message, true);
    } finally {
      setLoading(btn, false);
    }
  });
});

// ── Databases CRUD ────────────────────────────────────────────────────────

// Toggle between Existing User vs Create New User in Create Database modal
const ownerModeExisting = document.getElementById("pg-owner-mode-existing");
const ownerModeNew      = document.getElementById("pg-owner-mode-new");
const existingWrap      = document.getElementById("pg-owner-existing-wrap");
const newWrap           = document.getElementById("pg-owner-new-wrap");

if (ownerModeExisting && ownerModeNew) {
  const toggleOwnerMode = () => {
    if (ownerModeNew.checked) {
      existingWrap.style.display = "none";
      newWrap.style.display = "flex";
    } else {
      existingWrap.style.display = "";
      newWrap.style.display = "none";
    }
  };
  ownerModeExisting.addEventListener("change", toggleOwnerMode);
  ownerModeNew.addEventListener("change", toggleOwnerMode);
}

const dbSubmit = document.getElementById("pg-db-create-submit");
if (dbSubmit) {
  dbSubmit.addEventListener("click", async () => {
    const name  = document.getElementById("pg-new-db-name").value.trim();
    const errEl = document.getElementById("pg-db-error");
    errEl.style.display = "none";
    if (!name) { errEl.textContent = "Database name is required."; errEl.style.display = ""; return; }

    const isNewUser = ownerModeNew && ownerModeNew.checked;
    let owner = "postgres";

    setLoading(dbSubmit, true);
    try {
      if (isNewUser) {
        const username  = document.getElementById("pg-new-owner-username").value.trim();
        const password  = document.getElementById("pg-new-owner-password").value;
        const confirmEl = document.getElementById("pg-new-owner-password-confirm");
        const confirmPw = confirmEl ? confirmEl.value : "";
        if (!username || !password) {
          errEl.textContent = "New username and password are required.";
          errEl.style.display = "";
          setLoading(dbSubmit, false);
          return;
        }
        if (password !== confirmPw) {
          errEl.textContent = "Passwords do not match.";
          errEl.style.display = "";
          setLoading(dbSubmit, false);
          return;
        }
        if (password.length < 8) {
          errEl.textContent = "Password must be at least 8 characters.";
          errEl.style.display = "";
          setLoading(dbSubmit, false);
          return;
        }
        // 1. Create the new user first
        await apiFetch("/users", { method: "POST", body: JSON.stringify({ name: username, password }) });
        owner = username;
      } else {
        const select = document.getElementById("pg-new-db-owner-select");
        owner = select ? select.value : "postgres";
      }

      // 2. Create the database owned by that user
      await apiFetch("/databases", { method: "POST", body: JSON.stringify({ name, owner }) });
      showToast(`Database '${name}' created (owner: ${owner}).`);
      closeModal("pg-modal-create-db");
      location.reload();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = "";
    } finally {
      setLoading(dbSubmit, false);
    }
  });
}


document.addEventListener("click", async e => {
  const btn = e.target.closest("[data-action='delete-db']");
  if (!btn) return;
  const db = btn.dataset.db;
  if (!confirm(`Drop database '${db}'? This cannot be undone.`)) return;
  setLoading(btn, true);
  try {
    await apiFetch(`/databases/${encodeURIComponent(db)}`, { method: "DELETE" });
    showToast(`Database '${db}' dropped.`);
    location.reload();
  } catch (err) {
    showToast(err.message, true);
    setLoading(btn, false);
  }
});

document.addEventListener("click", async e => {
  const btn = e.target.closest("[data-action='view-tables']");
  if (!btn) return;
  const db = btn.dataset.db;
  const drawer = document.getElementById("pg-tables-drawer");
  const tbody  = document.getElementById("pg-tables-tbody");
  const nameEl = document.getElementById("pg-tables-db-name");
  nameEl.textContent = db;
  drawer.style.display = "";
  tbody.innerHTML = "<tr><td colspan='3' style='color:var(--color-muted);'>Loading…</td></tr>";
  try {
    const tables = await apiFetch(`/databases/${encodeURIComponent(db)}/tables`);
    tbody.innerHTML = tables.length
      ? tables.map(t => `<tr><td>${t.name}</td><td style='color:var(--color-muted);'>${t.row_count}</td>
          <td style='color:var(--color-muted);'>${t.size}</td></tr>`).join("")
      : "<tr><td colspan='3' style='color:var(--color-muted);'>No user tables found.</td></tr>";
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan='3' style='color:var(--color-danger);'>${err.message}</td></tr>`;
  }
});

// ── Users CRUD ────────────────────────────────────────────────────────────

const userSubmit = document.getElementById("pg-user-create-submit");
if (userSubmit) {
  userSubmit.addEventListener("click", async () => {
    const name      = document.getElementById("pg-new-user-name").value.trim();
    const password  = document.getElementById("pg-new-user-pw").value;
    const confirmEl = document.getElementById("pg-new-user-pw-confirm");
    const confirmPw = confirmEl ? confirmEl.value : "";
    const errEl     = document.getElementById("pg-user-error");
    errEl.style.display = "none";
    if (!name || !password) { errEl.textContent = "Username and password are required."; errEl.style.display = ""; return; }
    if (password !== confirmPw) { errEl.textContent = "Passwords do not match."; errEl.style.display = ""; return; }
    if (password.length < 8) { errEl.textContent = "Password must be at least 8 characters."; errEl.style.display = ""; return; }
    setLoading(userSubmit, true);
    try {
      await apiFetch("/users", { method: "POST", body: JSON.stringify({ name, password }) });
      showToast(`User '${name}' created.`);

      closeModal("pg-modal-create-user");
      location.reload();
    } catch (err) {
      errEl.textContent = err.message; errEl.style.display = "";
    } finally {
      setLoading(userSubmit, false);
    }
  });
}

document.addEventListener("click", e => {
  const btn = e.target.closest("[data-action='change-password']");
  if (!btn) return;
  const user = btn.dataset.user;
  document.getElementById("pg-pw-username").textContent = user;
  document.getElementById("pg-change-pw-input").dataset.user = user;
  openModal("pg-modal-change-pw");
});

const pwSubmit = document.getElementById("pg-pw-submit");
if (pwSubmit) {
  pwSubmit.addEventListener("click", async () => {
    const input    = document.getElementById("pg-change-pw-input");
    const name     = input.dataset.user;
    const password = input.value;
    const errEl    = document.getElementById("pg-pw-error");
    errEl.style.display = "none";
    if (!password) { errEl.textContent = "Password is required."; errEl.style.display = ""; return; }
    setLoading(pwSubmit, true);
    try {
      await apiFetch(`/users/${encodeURIComponent(name)}/password`, { method: "POST", body: JSON.stringify({ password }) });
      showToast(`Password updated for '${name}'.`);
      closeModal("pg-modal-change-pw");
    } catch (err) {
      errEl.textContent = err.message; errEl.style.display = "";
    } finally {
      setLoading(pwSubmit, false);
    }
  });
}

document.addEventListener("click", async e => {
  const btn = e.target.closest("[data-action='delete-user']");
  if (!btn) return;
  const user = btn.dataset.user;
  if (!confirm(`Drop role '${user}'? This cannot be undone.`)) return;
  setLoading(btn, true);
  try {
    await apiFetch(`/users/${encodeURIComponent(user)}`, { method: "DELETE" });
    showToast(`User '${user}' dropped.`);
    location.reload();
  } catch (err) {
    showToast(err.message, true);
    setLoading(btn, false);
  }
});

// ── Query runner ──────────────────────────────────────────────────────────

const runBtn = document.getElementById("pg-query-run");
if (runBtn) {
  runBtn.addEventListener("click", async () => {
    const db  = document.getElementById("pg-query-db").value;
    const sql = document.getElementById("pg-query-sql").value.trim();
    const errEl     = document.getElementById("pg-query-error");
    const resultsEl = document.getElementById("pg-query-results");
    const emptyEl   = document.getElementById("pg-query-empty");
    const tbody     = document.getElementById("pg-query-tbody");
    const countEl   = document.getElementById("pg-query-count");
    errEl.style.display = resultsEl.style.display = emptyEl.style.display = "none";
    if (!sql) { errEl.textContent = "Enter a SELECT query."; errEl.style.display = ""; return; }
    setLoading(runBtn, true);
    try {
      const data = await apiFetch("/query", { method: "POST", body: JSON.stringify({ db, sql }) });
      if (!data.rows || data.rows.length === 0) { emptyEl.style.display = ""; return; }
      // Render rows — each row has a pipe-delimited "row" field
      const firstRow  = data.rows[0].row || "";
      const colCount  = firstRow.split("|").length;
      tbody.innerHTML = data.rows.map(r => {
        const cols = r.row.split("|");
        return "<tr>" + cols.map(c => `<td>${c}</td>`).join("") + "</tr>";
      }).join("");
      countEl.textContent = `${data.count} row${data.count !== 1 ? "s" : ""}`;
      resultsEl.style.display = "";
    } catch (err) {
      errEl.textContent = err.message; errEl.style.display = "";
    } finally {
      setLoading(runBtn, false);
    }
  });
}

const clearBtn = document.getElementById("pg-query-clear");
if (clearBtn) {
  clearBtn.addEventListener("click", () => {
    document.getElementById("pg-query-sql").value = "";
    document.getElementById("pg-query-results").style.display = "none";
    document.getElementById("pg-query-empty").style.display = "none";
    document.getElementById("pg-query-error").style.display = "none";
  });
}

// ── Init — show first tab ─────────────────────────────────────────────────
switchTab("databases");
</script>
