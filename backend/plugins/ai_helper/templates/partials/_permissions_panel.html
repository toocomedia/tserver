<!-- Permissions Side Split Drawer Modal -->
<div class="modal-backdrop modal-backdrop--slide hidden" id="permissions-drawer-modal" role="dialog" aria-modal="true">
  <div class="modal modal--slide" style="max-width: 600px; width: 100%; display: flex; flex-direction: column; height: 100vh;">
    
    <div class="modal__header">
      <h3 style="display: flex; align-items: center; gap: 8px;">
        <i data-lucide="shield-check"></i> <span>AI Permissions & Security</span>
      </h3>
      <button type="button" class="btn btn--secondary btn--sm" onclick="closePermissionsDrawer()" aria-label="Close" style="padding: 0 10px; height: 30px;">
        ✕
      </button>
    </div>

    <!-- Clean Navigation Tabs -->
    <div class="perm-tab-nav">
      <button type="button" class="perm-tab-btn active" data-target="perm-tab-policy">Policy</button>
      <button type="button" class="perm-tab-btn" data-target="perm-tab-categories">Categories</button>
      <button type="button" class="perm-tab-btn" data-target="perm-tab-scope">Whitelist</button>
      <button type="button" class="perm-tab-btn" data-target="perm-tab-audit">Audit</button>
    </div>

    <div class="modal__body" style="overflow-y: auto; flex: 1; padding: 20px;">
      <form id="ai-permissions-form" onsubmit="event.preventDefault(); window.savePermissions(event);">
        {% include "partials/_permissions_policy.html" %}
        {% include "partials/_permissions_categories.html" %}
        {% include "partials/_permissions_scope.html" %}
        {% include "partials/_permissions_audit.html" %}
      </form>
      <div id="permissions-status-msg" style="display: none;"></div>
    </div>

    <div class="modal__footer" style="display: flex; align-items: center; justify-content: flex-end; gap: 8px;">
      <button type="button" class="btn btn--secondary btn--sm" onclick="closePermissionsDrawer()">Cancel</button>
      <button type="button" class="btn btn--primary btn--sm" id="btn-save-permissions" onclick="window.savePermissions(event)">
        <i data-lucide="save"></i> Save Permissions
      </button>
    </div>

  </div>
</div>
