<!-- Permissions Side Split Drawer -->
<div class="modal-backdrop modal-backdrop--slide hidden" id="permissions-drawer-modal" role="dialog" aria-modal="true">
  <div class="modal modal--slide" style="max-width: 440px;">
    
    <div class="modal__header">
      <h3 style="font-size: 15px; font-weight: 700; margin: 0;">AI Permissions</h3>
      <button type="button" class="btn btn--secondary btn--sm" onclick="closePermissionsDrawer()" aria-label="Close" style="padding: 0 10px; height: 30px;">
        ✕
      </button>
    </div>

    <div class="modal__body" style="overflow-y: auto; flex: 1; padding: 20px;">
      <form id="ai-permissions-form" onsubmit="event.preventDefault(); savePermissions();">
        
        <!-- Access Mode -->
        <div class="form-group mb-md">
          <label class="form-label font-bold mb-xs">Access Mode</label>
          <div class="d-flex flex-column gap-xs">
            <label class="radio-card p-sm border rounded cursor-pointer d-flex align-items-center gap-sm" style="background: var(--color-bg-card);">
              <input type="radio" name="global_mode" value="full_read_only" {% if policy.global_mode == 'full_read_only' %}checked{% endif %} onchange="toggleSelectiveFields()">
              <span class="text-sm font-semibold">Full Read-Only</span>
            </label>
            <label class="radio-card p-sm border rounded cursor-pointer d-flex align-items-center gap-sm" style="background: var(--color-bg-card);">
              <input type="radio" name="global_mode" value="selective" {% if policy.global_mode == 'selective' %}checked{% endif %} onchange="toggleSelectiveFields()">
              <span class="text-sm font-semibold">Selective Scope</span>
            </label>
            <label class="radio-card p-sm border rounded cursor-pointer d-flex align-items-center gap-sm" style="background: var(--color-bg-card);">
              <input type="radio" name="global_mode" value="disabled" {% if policy.global_mode == 'disabled' %}checked{% endif %} onchange="toggleSelectiveFields()">
              <span class="text-sm font-semibold">Disabled</span>
            </label>
          </div>
        </div>

        <!-- Selective Scopes (Collapsible) -->
        <div id="selective-scope-container" class="form-group mb-md p-sm border rounded" style="display: {% if policy.global_mode == 'selective' %}block{% else %}none{% endif %}; background: var(--color-bg-subtle);">
          <div class="mb-sm">
            <label class="form-label text-xs font-bold mb-xs">Allowed Domains</label>
            <input type="text" class="form-input text-xs" name="allowed_domains" value="{{ policy.allowed_domains }}" placeholder='["example.com"]'>
          </div>
          <div>
            <label class="form-label text-xs font-bold mb-xs">Allowed App IDs</label>
            <input type="text" class="form-input text-xs" name="allowed_app_ids" value="{{ policy.allowed_app_ids }}" placeholder='["app-1"]'>
          </div>
        </div>

        <!-- Category Checkboxes -->
        <div class="form-group mb-md">
          <label class="form-label font-bold mb-xs">Allowed Categories</label>
          <div class="d-flex flex-column gap-xs">
            <label class="p-sm border rounded d-flex align-items-center justify-content-between cursor-pointer" style="background: var(--color-bg-card);">
              <span class="text-sm">Domains & Reverse Proxy</span>
              <input type="checkbox" name="allow_domains_proxy" {% if policy.allow_domains_proxy %}checked{% endif %}>
            </label>
            <label class="p-sm border rounded d-flex align-items-center justify-content-between cursor-pointer" style="background: var(--color-bg-card);">
              <span class="text-sm">DNS Records</span>
              <input type="checkbox" name="allow_dns" {% if policy.allow_dns %}checked{% endif %}>
            </label>
            <label class="p-sm border rounded d-flex align-items-center justify-content-between cursor-pointer" style="background: var(--color-bg-card);">
              <span class="text-sm">PHP Websites</span>
              <input type="checkbox" name="allow_php_sites" {% if policy.allow_php_sites %}checked{% endif %}>
            </label>
            <label class="p-sm border rounded d-flex align-items-center justify-content-between cursor-pointer" style="background: var(--color-bg-card);">
              <span class="text-sm">Container & Python Apps</span>
              <input type="checkbox" name="allow_container_apps" {% if policy.allow_container_apps %}checked{% endif %}>
            </label>
            <label class="p-sm border rounded d-flex align-items-center justify-content-between cursor-pointer" style="background: var(--color-bg-card);">
              <span class="text-sm">Databases</span>
              <input type="checkbox" name="allow_databases" {% if policy.allow_databases %}checked{% endif %}>
            </label>
            <label class="p-sm border rounded d-flex align-items-center justify-content-between cursor-pointer" style="background: var(--color-bg-card);">
              <span class="text-sm">Files (Read-Only)</span>
              <input type="checkbox" name="allow_files_read" {% if policy.allow_files_read %}checked{% endif %}>
            </label>
          </div>
        </div>

        <div id="permissions-status-msg" class="mb-sm" style="display: none;"></div>

        <div class="d-flex justify-content-end gap-sm mt-lg">
          <button type="button" class="btn btn--secondary btn--sm" onclick="closePermissionsDrawer()">Cancel</button>
          <button type="submit" class="btn btn--primary btn--sm" id="btn-save-permissions">Save Permissions</button>
        </div>
      </form>
    </div>
  </div>
</div>
