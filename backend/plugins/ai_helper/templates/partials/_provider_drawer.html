<!-- Slide-Out Right Split Drawer -->
<div class="modal-backdrop modal-backdrop--slide hidden" id="provider-drawer-modal" role="dialog" aria-modal="true">
  <div class="modal modal--slide" style="max-width: 560px;">
    
    <div class="modal__header">
      <h3 id="drawer-title" class="d-flex align-items-center gap-xs">
        <i data-lucide="sparkles"></i> <span>Add AI Provider</span>
      </h3>
      <button type="button" class="btn btn--secondary btn--sm" onclick="closeProviderDrawer()" aria-label="Close" style="padding: 0 10px; height: 30px;">
        ✕
      </button>
    </div>

    <div class="modal__body" style="overflow-y: auto; flex: 1; padding: 20px;">
      <form id="provider-drawer-form" method="POST" action="/plugins/ai_helper/create" autocomplete="off" data-lpignore="true">
        {% include "partials/csrf_field.html" %}

        <!-- Provider Preset -->
        <div class="form-group mb-lg">
          <label class="form-label" for="drawer_preset_select">Provider Preset</label>
          <div class="form-select-wrap">
            <select class="form-select" id="drawer_preset_select">
              {% for key, p in presets.items() %}
              <option value="{{ key }}" data-name="{{ p.name }}" data-type="{{ p.type }}" data-url="{{ p.base_url }}" {% if loop.first %}selected{% endif %}>
                {{ p.name }} ({{ p.desc }})
              </option>
              {% endfor %}
            </select>
          </div>
        </div>

        <!-- API Key Input -->
        <div class="form-group mb-lg">
          <label class="form-label" for="drawer_api_key">API Key</label>
          <div class="d-flex align-items-center gap-xs">
            <input type="password" class="form-input font-mono" id="drawer_api_key" name="api_key" placeholder="Enter API key (sk-...)" autocomplete="new-password" data-lpignore="true" style="flex: 1;">
            <button type="button" class="btn btn--secondary btn--sm" id="drawer-btn-toggle-key" style="height: 34px; padding: 0 10px;" title="Toggle visibility">
              <i data-lucide="eye" id="drawer-key-eye-icon"></i>
            </button>
          </div>
        </div>

        <!-- Default Model -->
        <div class="form-group mb-md">
          <div class="d-flex align-items-center justify-content-between mb-xs">
            <label class="form-label m-0" for="drawer_model_name">Default Model</label>
            <span id="drawer-model-status" class="badge-minimal badge-minimal--neutral" style="display: none;"></span>
          </div>
          <input type="text" class="form-input font-mono" id="drawer_model_name" name="model_name" placeholder="e.g. gpt-4o-mini" value="gpt-4o-mini" required autocomplete="off" data-lpignore="true">
        </div>

        <!-- Enabled Multi-Models -->
        <div class="form-group mb-lg">
          <label class="form-label" for="drawer_models_list">Enabled Models</label>
          <input type="text" class="form-input font-mono" id="drawer_models_list" name="models_list" placeholder="e.g. gpt-4o-mini, gpt-4o, o3-mini" value="gpt-4o-mini, gpt-4o" autocomplete="off" data-lpignore="true">
          <span class="text-small text-muted" style="margin-top: 4px; display: block;">Comma-separated models available for this API key.</span>
        </div>

        <!-- Default Provider Checkbox -->
        <div class="form-group mb-lg">
          <label class="form-check">
            <input type="checkbox" id="drawer_is_default" name="is_default" value="true" checked>
            <span>Set as active default AI provider</span>
          </label>
        </div>

        <!-- Advanced Settings -->
        <details class="mb-lg" id="drawer-advanced-details" style="border: none; background: transparent;">
          <summary style="cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 12.5px; color: var(--color-muted); padding: 6px 0; user-select: none;">
            <i data-lucide="sliders" style="width: 13px; height: 13px;"></i>
            <span>Advanced Settings</span>
          </summary>

          <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 12px;">
            <div class="form-group">
              <label class="form-label" for="drawer_provider_name">Display Name</label>
              <input type="text" class="form-input" id="drawer_provider_name" name="name" value="OpenAI" placeholder="e.g. OpenAI Production" required autocomplete="off" data-lpignore="true">
            </div>

            <div class="form-group">
              <label class="form-label" for="drawer_base_url">Base URL</label>
              <input type="text" class="form-input font-mono" id="drawer_base_url" name="base_url" value="https://api.openai.com/v1" placeholder="https://api.openai.com/v1" required autocomplete="off" data-lpignore="true">
            </div>

            <div class="form-group">
              <label class="form-label" for="drawer_provider_type">Protocol</label>
              <div class="form-select-wrap">
                <select class="form-select" id="drawer_provider_type" name="provider_type" autocomplete="off" data-lpignore="true">
                  <option value="openai_compatible" selected>OpenAI-Compatible (/chat/completions)</option>
                  <option value="anthropic">Anthropic (/messages)</option>
                </select>
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
              <div class="form-group">
                <label class="form-label" for="drawer_temperature">Temperature</label>
                <input type="number" step="0.05" min="0.0" max="1.0" class="form-input" id="drawer_temperature" name="temperature" value="0.2" autocomplete="off">
              </div>
              <div class="form-group">
                <label class="form-label" for="drawer_max_tokens">Max Tokens</label>
                <input type="number" step="256" min="256" max="32768" class="form-input" id="drawer_max_tokens" name="max_tokens" value="4096" autocomplete="off">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="drawer_custom_rules">Custom Rules</label>
              <textarea class="form-input font-mono" id="drawer_custom_rules" name="custom_rules" rows="3" style="height: auto; padding: 8px; line-height: 1.4;" placeholder="Optional prompt directives (e.g. 'Prefer PostgreSQL')."></textarea>
            </div>
          </div>
        </details>

      </form>
    </div>

    <div class="modal__footer d-flex align-items-center justify-content-between gap-sm">
      <div>
        <span id="drawer-test-indicator" class="d-flex align-items-center gap-xs text-small"></span>
      </div>
      <div class="d-flex align-items-center gap-xs">
        <button type="button" class="btn btn--secondary btn--sm" onclick="closeProviderDrawer()">Cancel</button>
        <button type="button" class="btn btn--secondary btn--sm" id="drawer-btn-test">
          <i data-lucide="zap"></i> Test
        </button>
        <button type="submit" form="provider-drawer-form" class="btn btn--primary btn--sm" id="drawer-btn-save">
          <i data-lucide="save"></i> Save Provider
        </button>
      </div>
    </div>

  </div>
</div>
