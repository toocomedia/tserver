<!-- Tab 1: Access Policy -->
<div id="perm-tab-policy" class="perm-tab-pane active">
  <div class="form-group mb-lg">
    <label class="form-label">Access Level</label>
    
    <div class="settings-choice-grid mb-xs" style="grid-template-columns: 1fr; gap: 8px;">
      
      <!-- Option 1: Read All -->
      <label class="settings-choice {% if policy.global_mode == 'full_read_only' %}settings-choice--active{% endif %}" data-mode-card="full_read_only" style="padding: 12px 14px; min-height: auto;">
        <div class="d-flex align-items-center justify-content-between" style="width: 100%;">
          <div class="d-flex align-items-center gap-sm">
            <input type="radio" name="global_mode" value="full_read_only" {% if policy.global_mode == 'full_read_only' %}checked{% endif %} onchange="updateAccessModeUI()">
            <div class="text-left">
              <span class="font-bold text-sm d-block" style="color: var(--color-text);">Read All</span>
              <span class="text-xs text-muted">Read access across enabled categories (no whitelist restrictions).</span>
            </div>
          </div>
          <span class="badge badge--ok" style="font-size: 10px;">Read All</span>
        </div>
      </label>


      <!-- Option 2: Granular Whitelist -->
      <label class="settings-choice {% if policy.global_mode == 'selective' %}settings-choice--active{% endif %}" data-mode-card="selective" style="padding: 12px 14px; min-height: auto;">
        <div class="d-flex align-items-center justify-content-between" style="width: 100%;">
          <div class="d-flex align-items-center gap-sm">
            <input type="radio" name="global_mode" value="selective" {% if policy.global_mode == 'selective' %}checked{% endif %} onchange="updateAccessModeUI()">
            <div class="text-left">
              <span class="font-bold text-sm d-block" style="color: var(--color-text);">Granular Whitelist</span>
              <span class="text-xs text-muted">Restrict AI strictly to chosen resources configured in the Whitelist tab.</span>
            </div>
          </div>
          <span class="badge badge--warning" style="font-size: 10px;">Whitelist</span>
        </div>
      </label>

      <!-- Option 3: Block AI -->
      <label class="settings-choice {% if policy.global_mode == 'disabled' %}settings-choice--active{% endif %}" data-mode-card="disabled" style="padding: 12px 14px; min-height: auto;">
        <div class="d-flex align-items-center justify-content-between" style="width: 100%;">
          <div class="d-flex align-items-center gap-sm">
            <input type="radio" name="global_mode" value="disabled" {% if policy.global_mode == 'disabled' %}checked{% endif %} onchange="updateAccessModeUI()">
            <div class="text-left">
              <span class="font-bold text-sm d-block" style="color: var(--color-text);">Block AI Access</span>
              <span class="text-xs text-muted">Completely disable AI assistant from querying any server tools or data.</span>
            </div>
          </div>
          <span class="badge badge--error" style="font-size: 10px;">Blocked</span>
        </div>
      </label>

    </div>
  </div>

  <div class="form-group pt-xs">
    <label class="form-check m-0" style="cursor: pointer; display: flex; align-items: center; justify-content: space-between;">
      <div class="text-left">
        <span class="font-bold text-sm d-block" style="color: var(--color-text);">On-Demand Confirmation</span>
        <span class="text-xs text-muted">Ask for confirmation before inspecting sensitive logs or files.</span>
      </div>
      <input type="checkbox" name="ask_on_demand" class="form-check-input m-0" {% if policy.ask_on_demand %}checked{% endif %}>
    </label>
  </div>
</div>
