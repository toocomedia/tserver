<section class="unboxed-step-container" data-wizard-panel="1">
  <div class="unboxed-step-header"><span>1. Choose target and source</span><span class="badge-pill">Web apps only</span></div>
  <p class="form-hint">Domains already used by another app cannot be selected.</p>
  <div class="form-group"><label class="form-label" for="domain_id">Domain</label><div class="form-select-wrap"><select class="form-select" id="domain_id" name="domain_id" required data-domain-select>{% for domain in domains %}<option value="{{ domain.id }}" data-domain-name="{{ domain.name }}" data-domain-ssl="{{ 'true' if domain.name in ssl_domain_names else 'false' }}" {% if domain.id in used_domain_ids or domain.project_type != 'static' %}disabled{% endif %}>{{ domain.name }}{% if domain.id in used_domain_ids %} — already in use{% elif domain.project_type != 'static' %} — unavailable{% endif %}</option>{% endfor %}</select></div></div>
  <div class="form-group"><label class="form-label" for="source_type">Source type</label><div class="form-select-wrap"><select class="form-select" id="source_type" name="source_type" data-source-type><option value="git">Git repository</option><option value="image">Container image</option><option value="wordpress">WordPress preset</option></select></div></div>
  <div class="apps-engine-source-grid" data-git-fields>
    <div class="form-group"><label class="form-label" for="repository_url">Repository URL</label><input class="form-input form-input--code" id="repository_url" name="repository_url" placeholder="https://github.com/owner/project.git" data-repository-url><p class="form-hint">The panel reads source files only to suggest configuration.</p></div>
    <div class="form-group"><label class="form-label" for="branch">Branch</label><input class="form-input" id="branch" name="branch" value="main" data-branch></div>
  </div>
  <div class="form-group" data-image-field hidden><label class="form-label" for="image_reference">Registry image</label><input class="form-input form-input--code" id="image_reference" name="image_reference" placeholder="ghcr.io/org/app:1.0" data-image-reference><p class="form-hint">The image is pulled privately when installation begins.</p></div>
  <p class="form-error" data-source-error hidden></p>
</section>
