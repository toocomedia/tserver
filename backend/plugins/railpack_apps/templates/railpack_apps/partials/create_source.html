<section class="unboxed-step-container" data-wizard-panel="1">
  <span class="section-label">Select App Source</span>

  <div class="form-group" style="margin-bottom: 20px;">
    <label class="section-label" for="domain_id" style="font-size:13px;">Target Domain</label>
    <div class="form-select-wrap">
      <select class="form-select input-optic" id="domain_id" name="domain_id" required data-domain-select>
        {% for domain in domains %}
        <option value="{{ domain.id }}" data-domain-name="{{ domain.name }}" data-domain-ssl="{{ 'true' if domain.name in ssl_domain_names else 'false' }}" {% if domain.id in used_domain_ids or domain.project_type != 'static' %}disabled{% endif %}>
          {{ domain.name }}{% if domain.id in used_domain_ids %} — in use{% elif domain.project_type != 'static' %} — unavailable{% endif %}
        </option>
        {% endfor %}
      </select>
    </div>
  </div>

  <!-- Direct Inline SVGs (Zero Image Files) -->
  <div class="cards-grid-3">
    <!-- Git Card -->
    <div class="optic-card selected" data-source-card="git">
      <div class="optic-card__icon">
        <svg role="img" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><title>Git</title><path d="M13.09 23.549a1.54 1.54 0 0 1-2.18 0L.451 13.089a1.54 1.54 0 0 1 0-2.179l7.191-7.19 2.733 2.733a1.85 1.85 0 0 0 .964 2.326v6.66a1.849 1.849 0 1 0 1.54 0V8.814a1.85 1.85 0 0 0 .848-3.083L11.037.942a1.54 1.54 0 0 1 2.18 0l10.332 10.331a1.54 1.54 0 0 1 0 2.179l-10.459 10.097zM15.4 15.45a1.85 1.85 0 1 0 0-3.7 1.85 1.85 0 0 0 0 3.7z"/></svg>
      </div>
      <div class="optic-card__name">Git Repository</div>
    </div>

    <!-- Docker Card -->
    <div class="optic-card" data-source-card="image">
      <div class="optic-card__icon">
        <svg role="img" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><title>Docker</title><path d="M13.983 11.078h2.119a.186.186 0 00.186-.185V9.006a.186.186 0 00-.186-.186h-2.119a.185.185 0 00-.185.185v1.888c0 .102.083.185.185.185m-2.954-5.43h2.118a.186.186 0 00.186-.186V3.574a.186.186 0 00-.186-.185h-2.118a.185.185 0 00-.185.185v1.888c0 .102.082.185.185.185m0 2.716h2.118a.187.187 0 00.186-.186V6.29a.186.186 0 00-.186-.185h-2.118a.185.185 0 00-.185.185v1.887c0 .102.082.185.185.186m-2.93 0h2.12a.186.186 0 00.184-.186V6.29a.185.185 0 00-.185-.185H8.1a.185.185 0 00-.185.185v1.887c0 .102.083.185.185.186m-2.964 0h2.119a.186.186 0 00.185-.186V6.29a.185.185 0 00-.185-.185H5.136a.186.186 0 00-.186.185v1.887c0 .102.084.185.186.186m5.893 2.715h2.118a.186.186 0 00.186-.185V9.006a.186.186 0 00-.186-.186h-2.118a.185.185 0 00-.185.185v1.888c0 .102.082.185.185.185m-2.93 0h2.12a.185.185 0 00.184-.185V9.006a.185.185 0 00-.184-.186h-2.12a.185.185 0 00-.184.185v1.888c0 .102.083.185.185.185m-2.964 0h2.119a.185.185 0 00.185-.185V9.006a.185.185 0 00-.184-.186h-2.12a.186.186 0 00-.186.186v1.887c0 .102.084.185.186.185m-2.92 0h2.12a.185.185 0 00.184-.185V9.006a.185.185 0 00-.184-.186h-2.12a.185.185 0 00-.184.185v1.888c0 .102.082.185.185.185M23.763 9.89c-.065-.051-.672-.51-1.954-.51-.338.001-.676.03-1.01.087-.248-1.7-1.653-2.53-1.716-2.566l-.344-.199-.226.327c-.284.438-.49.922-.612 1.43-.23.97-.09 1.882.403 2.661-.595.332-1.55.413-1.744.42H.751a.751.751 0 00-.75.748 11.376 11.376 0 00.692 4.062c.545 1.428 1.355 2.48 2.41 3.124 1.18.723 3.1 1.137 5.275 1.137.983.003 1.963-.086 2.93-.266a12.248 12.248 0 003.823-1.389c.98-.567 1.86-1.288 2.61-2.136 1.252-1.418 1.998-2.997 2.553-4.4h.221c1.372 0 2.215-.549 2.68-1.009.309-.293.55-.65.707-1.046l.098-.288Z"/></svg>
      </div>
      <div class="optic-card__name">Docker Image</div>
    </div>

    <!-- WordPress Card -->
    <div class="optic-card" data-source-card="wordpress">
      <div class="optic-card__icon">
        <svg role="img" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><title>WordPress</title><path d="M21.469 6.825c.84 1.537 1.318 3.3 1.318 5.175 0 3.979-2.156 7.456-5.363 9.325l3.295-9.527c.615-1.54.82-2.771.82-3.864 0-.405-.026-.78-.07-1.11m-7.981.105c.647-.03 1.232-.105 1.232-.105.582-.075.514-.93-.067-.899 0 0-1.755.135-2.88.135-1.064 0-2.85-.15-2.85-.15-.585-.03-.661.855-.075.885 0 0 .54.061 1.125.09l1.68 4.605-2.37 7.08L5.354 6.9c.649-.03 1.234-.1 1.234-.1.585-.075.516-.93-.065-.896 0 0-1.746.138-2.874.138-.2 0-.438-.008-.69-.015C4.911 3.15 8.235 1.215 12 1.215c2.809 0 5.365 1.072 7.26 2.805-.205.007-.4.015-.568.015-1.065 0-2.715-.135-2.715-.135-.585-.03-.66.855-.075.885 0 0 .54.06 1.125.09l2.36 6.48-1.68-4.605M12 22.785c-1.53 0-2.978-.33-4.275-.922l4.38-12.72 4.38 12.72c-1.297.592-2.745.922-4.285.922zM1.215 12c0-2.31.81-4.432 2.16-6.105L9.36 21.63C4.695 19.98 1.215 16.41 1.215 12z"/></svg>
      </div>
      <div class="optic-card__name">WordPress</div>
    </div>
  </div>

  <input type="hidden" id="source_type" name="source_type" value="git" data-source-type>

  <!-- Git Source Fields -->
  <div class="apps-engine-source-grid" data-git-fields>
    <div class="form-group">
      <span class="section-label" style="font-size:13px;">Repository URL</span>
      <input class="input-optic input-optic--code" id="repository_url" name="repository_url" placeholder="https://github.com/owner/project.git" data-repository-url>
    </div>
    <div class="form-group">
      <span class="section-label" style="font-size:13px;">Branch</span>
      <input class="input-optic" id="branch" name="branch" value="main" data-branch>
    </div>
  </div>

  <!-- Docker Image Field -->
  <div class="form-group" data-image-field hidden>
    <span class="section-label" style="font-size:13px;">Registry Image</span>
    <input class="input-optic input-optic--code" id="image_reference" name="image_reference" placeholder="ghcr.io/org/app:1.0" data-image-reference>
  </div>

  <p class="form-error" data-source-error hidden></p>
</section>

<script>
  document.querySelectorAll('[data-source-card]').forEach((card) => {
    card.addEventListener('click', () => {
      const type = card.getAttribute('data-source-card');
      const select = document.querySelector('[data-source-type]');
      if (select) {
        select.value = type;
        select.dispatchEvent(new Event('change', { bubbles: true }));
      }
      document.querySelectorAll('[data-source-card]').forEach((c) => c.classList.remove('selected'));
      card.classList.add('selected');
    });
  });
</script>
