<section class="unboxed-step-container" data-wizard-panel="1">

  <div class="dropdown-optic" style="margin-bottom: 20px;">
    <div class="custom-dropdown" data-custom-dropdown="domain_id" data-no-autoselect>
      <input type="hidden" id="domain_id" name="domain_id" required data-dropdown-value data-domain-select>
      <div class="custom-dropdown__trigger" data-dropdown-trigger tabindex="0">
        <span class="custom-dropdown__label" data-dropdown-label>Select Target Domain...</span>
      </div>
      <div class="custom-dropdown__menu" data-dropdown-menu>
        {% for domain in domains %}
        <div class="custom-dropdown__item {% if domain.id in used_domain_ids or domain.project_type != 'static' %}is-disabled{% endif %}" 
             data-dropdown-item 
             data-value="{{ domain.id }}" 
             data-label="{{ domain.name }}"
             data-domain-name="{{ domain.name }}" 
             data-domain-ssl="{{ 'true' if domain.name in ssl_domain_names else 'false' }}">
          {{ domain.name }}{% if domain.id in used_domain_ids %} — in use{% elif domain.project_type != 'static' %} — unavailable{% endif %}
        </div>
        {% endfor %}
      </div>
    </div>
  </div>

  <div class="cards-grid-3">
    <div class="optic-card selected" data-source-card="git">
      <img class="optic-icon" src="/plugins/railpack_apps/static/images/git.svg" alt="Git">
      <span class="optic-card__name">Git Repository</span>
    </div>
    <div class="optic-card" data-source-card="image">
      <img class="optic-icon" src="/plugins/railpack_apps/static/images/docker.svg" alt="Docker">
      <span class="optic-card__name">Docker Image</span>
    </div>
    <div class="optic-card" data-source-card="wordpress">
      <img class="optic-icon" src="/plugins/railpack_apps/static/images/wordpress.svg" alt="WordPress">
      <span class="optic-card__name">WordPress</span>
    </div>
  </div>

  <input type="hidden" id="source_type" name="source_type" value="git" data-source-type>

  <div class="apps-engine-source-grid" data-git-fields>
    <div class="form-group">
      <span class="section-label">Repository URL</span>
      <input class="input-optic input-optic--code" id="repository_url" name="repository_url" placeholder="https://github.com/owner/project.git" data-repository-url>
    </div>
    <div class="form-group dropdown-optic" style="position: relative; overflow: visible;">
      <span class="section-label">Branch <span data-branch-spinner class="step-spinner" style="display: none; vertical-align: middle; margin-left: 8px; width: 14px; height: 14px; border-width: 2px;"></span></span>
      <div class="custom-dropdown" data-custom-dropdown="branch">
        <input type="hidden" id="branch" name="branch" value="main" data-branch data-dropdown-value>
        <div class="custom-dropdown__trigger" data-dropdown-trigger tabindex="0">
          <span class="custom-dropdown__label" data-dropdown-label>main</span>
        </div>
        <div class="custom-dropdown__menu" data-dropdown-menu data-branch-menu>
          <div class="custom-dropdown__item is-selected" data-dropdown-item data-value="main" data-label="main">main</div>
        </div>
      </div>
    </div>
  </div>

  <div class="form-group" data-image-field hidden>
    <span class="section-label" style="font-size:13px;">Registry Image</span>
    <input class="input-optic input-optic--code" id="image_reference" name="image_reference" placeholder="ghcr.io/org/app:1.0" data-image-reference>
  </div>

</section>

<script>
  document.querySelectorAll('[data-source-card]').forEach((card) => {
    card.addEventListener('click', () => {
      const type = card.getAttribute('data-source-card');
      const select = document.querySelector('[data-source-type]');
      if (select) {
        select.value = type;
        select.dispatchEvent(new Event('change', { bubbles: true }));
      }
      document.querySelectorAll('[data-source-card]').forEach((c) => c.classList.remove('selected'));
      card.classList.add('selected');
    });
  });
</script>
