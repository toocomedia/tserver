<section class="unboxed-step-container" data-wizard-panel="2" hidden>
  <span class="section-label">2. Source Inspection Summary</span>
  <p class="form-hint" data-inspect-summary style="margin-bottom: 16px;">Detected runtime environment and project markers.</p>

  <div class="d-flex gap-sm align-center" data-inspect-loading hidden style="padding: 16px; background: var(--bg-card); margin-bottom: 16px;">
    <span class="step-spinner" aria-hidden="true"></span>
    <span>Inspecting source files…</span>
  </div>

  <div class="alert alert--danger" data-inspect-error hidden style="padding: 12px; margin-bottom: 16px;">
    <span data-inspect-error-text></span>
    <button class="btn-optic btn-optic--sm" type="button" data-inspect-retry style="margin-top: 8px;">Retry inspection</button>
  </div>

  <!-- Clean Borderless Optic Inspection Metrics Card -->
  <div class="apps-engine-inspection inspection-card-optic" data-inspect-results hidden>
    <div class="inspection-grid-optic">
      <div class="inspection-item-optic">
        <span class="inspection-label-optic">Detected Runtime</span>
        <div class="inspection-value-optic" data-inspection-runtime></div>
      </div>
      <div class="inspection-item-optic dropdown-optic" data-build-mode-group style="overflow: visible;">
        <span class="inspection-label-optic" style="margin-bottom: 4px; display: block;">Build Method</span>
        <div class="custom-dropdown" data-custom-dropdown="build_mode">
          <input type="hidden" id="build_mode" name="build_mode" data-dropdown-value value="railpack">
          <div class="custom-dropdown__trigger" data-dropdown-trigger tabindex="0" style="padding: 6px 12px; min-height: 32px; font-size: 13px;">
            <span class="custom-dropdown__label" data-dropdown-label>Automatic Railpack</span>
          </div>
          <div class="custom-dropdown__menu" data-dropdown-menu>
            <div class="custom-dropdown__item is-selected" data-dropdown-item data-value="railpack" data-label="Automatic Railpack">Automatic Railpack</div>
            <div class="custom-dropdown__item" data-dropdown-item data-value="dockerfile" data-label="Dockerfile">Dockerfile</div>
          </div>
        </div>
      </div>
      <div class="inspection-item-optic form-group" data-port-group>
        <span class="inspection-label-optic" style="margin-bottom: 4px; display: block;">Internal HTTP Port</span>
        <input class="input-optic input-optic--code" id="internal_port" name="internal_port" type="number" min="1" max="65535" value="3000" required style="padding: 6px 12px; height: 32px; font-size: 13px;">
      </div>
      <div class="inspection-item-optic">
        <span class="inspection-label-optic">Recommended Database Services</span>
        <div class="inspection-value-optic accent" data-inspection-databases></div>
      </div>
    </div>
  </div>
</section>
