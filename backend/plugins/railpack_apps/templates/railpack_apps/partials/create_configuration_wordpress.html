<section class="form-group" data-wordpress-fields hidden style="margin-top:20px;">
  <span class="section-label">WordPress Setup</span>
  <div class="apps-engine-runtime-grid">
    <div class="form-group"><input class="input-optic" id="wordpress_site_title" name="wordpress_site_title" placeholder="Site Title"></div>
    <div class="form-group"><input class="input-optic" id="wordpress_admin_user" name="wordpress_admin_user" placeholder="Admin Username"></div>
    <div class="form-group"><input class="input-optic" id="wordpress_admin_email" name="wordpress_admin_email" type="email" placeholder="Admin Email"></div>
    <div class="form-group"><input class="input-optic" id="wordpress_admin_password" name="wordpress_admin_password" type="password" autocomplete="new-password" placeholder="Admin Password"></div>
  </div>
</section>
