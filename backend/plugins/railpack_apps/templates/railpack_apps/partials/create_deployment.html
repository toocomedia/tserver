<section class="unboxed-step-container" data-wizard-panel="4" hidden>
  <div class="unboxed-step-header">
    <span>4. Installing application</span>
    <span class="badge-pill badge-pill--accent" data-deployment-state>Queued</span>
  </div>
  <p class="form-hint" data-deployment-summary>Waiting for the server to start deployment.</p>
  
  <div class="step4-transparent-section">
    <div class="scroll-loader-viewport">
      <div class="clean-step-list" data-deployment-steps></div>
    </div>
  </div>

  <div class="master-card" style="margin-top: 16px; border: 1px solid var(--border-color, rgba(255,255,255,0.08)); background: var(--color-surface, #141414); border-radius: 8px; overflow: hidden;">
    <div class="master-card__header" style="display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.06);">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="ai-sec-dot" style="width: 8px; height: 8px; border-radius: 50%; background: var(--color-accent, #6366f1); display: inline-block;"></span>
        <span style="font-size: 12px; font-weight: 600; color: var(--color-text, #ffffff);">Live Build &amp; Deployment Stream</span>
      </div>
      <span class="text-muted" style="font-size: 11px;" data-deployment-live-hint>Real-time terminal log</span>
    </div>
    <div class="master-card__body" style="padding: 10px 14px;">
      <pre class="terminal-fluid" data-deployment-live-output style="max-height: 280px; min-height: 120px; font-size: 11.5px; line-height: 1.5; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; overflow-y: auto; white-space: pre-wrap; word-break: break-all; margin: 0; background: transparent; border: none; padding: 0; color: #e2e8f0;">Initializing build stream...</pre>
    </div>
  </div>
</section>
