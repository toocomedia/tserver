<section class="form-group apps-engine-environment" style="margin-top: 32px;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
    <div>
      <span class="section-label" style="margin:0;">Persistent Storage Mounts</span>
      <span style="font-size: 11px; color: var(--color-muted); display: block; margin-top: 2px;">Attach dedicated Docker volumes to persist uploads or data across deployments.</span>
    </div>
    <button class="btn-optic btn-optic--sm" type="button" data-add-storage-mount>+ Add Mount</button>
  </div>
  <div data-storage-mounts-list style="display: flex; flex-direction: column; gap: 8px;"></div>
  <p class="form-hint" data-no-storage-mounts style="margin-top: 8px; font-size: 11px; color: var(--color-muted);">No persistent storage mounts configured. Files outside mounts are ephemeral.</p>
</section>
