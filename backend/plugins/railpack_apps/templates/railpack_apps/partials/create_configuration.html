<section class="unboxed-step-container" data-wizard-panel="3" hidden>
  <span class="section-label">3. Configuration & Database Services</span>

  <div class="apps-engine-runtime-grid" style="margin-bottom: 20px;">
    <div class="form-group" data-build-mode-group>
      <span class="section-label" style="font-size:13px;">Build Method</span>
      <div class="form-select-wrap">
        <select class="form-select input-optic" id="build_mode" name="build_mode">
          <option value="railpack">Automatic Railpack</option>
          <option value="dockerfile">Dockerfile</option>
        </select>
      </div>
    </div>
    <div class="form-group" data-port-group>
      <span class="section-label" style="font-size:13px;">App HTTP Port</span>
      <input class="input-optic input-optic--code" id="internal_port" name="internal_port" type="number" min="1" max="65535" value="3000" required>
    </div>
  </div>

  <fieldset class="form-group" style="border:none; padding:0; margin:0 0 24px 0;">
    <legend class="section-label" style="margin-bottom:12px;">Attach Private Databases</legend>
    <div class="cards-grid-4">
      
      <!-- MariaDB / MySQL -->
      <div class="optic-card apps-engine-database-choice" id="database-config-mariadb" data-database-row data-kind="mariadb">
        <label class="form-check" style="cursor:pointer; width:100%; display:flex; flex-direction:column; align-items:center; gap:8px;">
          <input type="checkbox" data-database-enabled style="display:none;">
          <div class="optic-card__icon">
            <img src="/static/images/apps-engine/database-mariadb.svg" alt="MySQL" aria-hidden="true">
          </div>
          <div class="optic-card__name">MySQL</div>
        </label>
        <div class="form-subbox" data-database-options hidden style="width:100%; margin-top:8px;">
          <div class="form-group">
            <span class="section-label" style="font-size:11px;">Provider</span>
            <div class="form-select-wrap">
              <select class="form-select input-optic" id="database-provider-mariadb" data-database-provider style="height:32px; font-size:12px;">
                <option value="docker">Panel Docker</option>
                <option value="external">External URL</option>
              </select>
            </div>
          </div>
          <div class="form-group" data-database-external hidden>
            <input class="input-optic input-optic--code" id="database-url-mariadb" data-database-url type="password" autocomplete="off" placeholder="Connection URL" style="height:32px; font-size:12px;">
          </div>
        </div>
        <input data-database-key value="MYSQL_URL" type="hidden">
      </div>

      <!-- PostgreSQL -->
      <div class="optic-card apps-engine-database-choice" id="database-config-postgresql" data-database-row data-kind="postgresql">
        <label class="form-check" style="cursor:pointer; width:100%; display:flex; flex-direction:column; align-items:center; gap:8px;">
          <input type="checkbox" data-database-enabled style="display:none;">
          <div class="optic-card__icon">
            <img src="/static/images/apps-engine/postgresql.svg" alt="PostgreSQL" aria-hidden="true">
          </div>
          <div class="optic-card__name">PostgreSQL</div>
        </label>
        <div class="form-subbox" data-database-options hidden style="width:100%; margin-top:8px;">
          <div class="form-group">
            <span class="section-label" style="font-size:11px;">Provider</span>
            <div class="form-select-wrap">
              <select class="form-select input-optic" id="database-provider-postgresql" data-database-provider style="height:32px; font-size:12px;">
                <option value="docker">Panel Docker</option>
                <option value="panel_postgres">Panel PostgreSQL</option>
                {% if supabase_projects %}<option value="supabase">Supabase</option>{% endif %}
                <option value="external">External URL</option>
              </select>
            </div>
          </div>
          {% if supabase_projects %}
          <div class="form-group" data-database-supabase-picker hidden>
            <div class="form-select-wrap">
              <select class="form-select input-optic" id="database-supabase-project-postgresql" data-database-supabase-project style="height:32px; font-size:12px;">
                <option value="">Select Supabase</option>
                {% for sp in supabase_projects %}
                <option value="{{ sp.id }}">{{ sp.name }}</option>
                {% endfor %}
              </select>
            </div>
          </div>
          {% endif %}
          <div class="form-group" data-database-external hidden>
            <input class="input-optic input-optic--code" id="database-url-postgresql" data-database-url type="password" autocomplete="off" placeholder="Connection URL" style="height:32px; font-size:12px;">
          </div>
        </div>
        <input data-database-key value="DATABASE_URL" type="hidden">
      </div>

      <!-- Redis -->
      <div class="optic-card apps-engine-database-choice" id="database-config-redis" data-database-row data-kind="redis">
        <label class="form-check" style="cursor:pointer; width:100%; display:flex; flex-direction:column; align-items:center; gap:8px;">
          <input type="checkbox" data-database-enabled style="display:none;">
          <div class="optic-card__icon">
            <img src="/static/images/apps-engine/database-redis.svg" alt="Redis" aria-hidden="true">
          </div>
          <div class="optic-card__name">Redis</div>
        </label>
        <div class="form-subbox" data-database-options hidden style="width:100%; margin-top:8px;">
          <div class="form-group">
            <span class="section-label" style="font-size:11px;">Provider</span>
            <div class="form-select-wrap">
              <select class="form-select input-optic" id="database-provider-redis" data-database-provider style="height:32px; font-size:12px;">
                <option value="docker">Panel Docker</option>
                <option value="external">External URL</option>
              </select>
            </div>
          </div>
          <div class="form-group" data-database-external hidden>
            <input class="input-optic input-optic--code" id="database-url-redis" data-database-url type="password" autocomplete="off" placeholder="Connection URL" style="height:32px; font-size:12px;">
          </div>
        </div>
        <input data-database-key value="REDIS_URL" type="hidden">
      </div>

      <!-- MongoDB -->
      <div class="optic-card apps-engine-database-choice" id="database-config-mongodb" data-database-row data-kind="mongodb">
        <label class="form-check" style="cursor:pointer; width:100%; display:flex; flex-direction:column; align-items:center; gap:8px;">
          <input type="checkbox" data-database-enabled style="display:none;">
          <div class="optic-card__icon">
            <img src="/static/images/apps-engine/database-mongodb.svg" alt="MongoDB" aria-hidden="true">
          </div>
          <div class="optic-card__name">MongoDB</div>
        </label>
        <div class="form-subbox" data-database-options hidden style="width:100%; margin-top:8px;">
          <div class="form-group">
            <span class="section-label" style="font-size:11px;">Provider</span>
            <div class="form-select-wrap">
              <select class="form-select input-optic" id="database-provider-mongodb" data-database-provider style="height:32px; font-size:12px;">
                <option value="docker">Panel Docker</option>
                <option value="external">External URL</option>
              </select>
            </div>
          </div>
          <div class="form-group" data-database-external hidden>
            <input class="input-optic input-optic--code" id="database-url-mongodb" data-database-url type="password" autocomplete="off" placeholder="Connection URL" style="height:32px; font-size:12px;">
          </div>
        </div>
        <input data-database-key value="MONGODB_URI" type="hidden">
      </div>

    </div>
  </fieldset>

  <!-- Environment Variables -->
  <section class="form-group apps-engine-environment">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <span class="section-label" style="margin:0;">Custom Environment Variables</span>
      <button class="btn-optic btn-optic--sm" type="button" data-add-environment>+ Add Variable</button>
    </div>
    <div class="apps-engine-environment__list" data-environment-list></div>
    <p class="form-error" data-environment-error hidden></p>
  </section>

  <!-- WordPress Setup Section -->
  <section class="form-group" data-wordpress-fields hidden style="margin-top:20px;">
    <span class="section-label">WordPress Setup</span>
    <div class="apps-engine-runtime-grid">
      <div class="form-group"><input class="input-optic" id="wordpress_site_title" name="wordpress_site_title" placeholder="Site Title"></div>
      <div class="form-group"><input class="input-optic" id="wordpress_admin_user" name="wordpress_admin_user" placeholder="Admin Username"></div>
      <div class="form-group"><input class="input-optic" id="wordpress_admin_email" name="wordpress_admin_email" type="email" placeholder="Admin Email"></div>
      <div class="form-group"><input class="input-optic" id="wordpress_admin_password" name="wordpress_admin_password" type="password" autocomplete="new-password" placeholder="Admin Password"></div>
    </div>
  </section>

  <!-- SSL Option -->
  <section class="form-group" style="margin-top:20px;">
    <label class="form-check" style="display:flex; align-items:center; gap:8px; cursor:pointer;">
      <input type="checkbox" name="ssl" value="true" data-ssl-request>
      <span>Issue HTTPS certificate after deployment</span>
    </label>
  </section>
</section>
