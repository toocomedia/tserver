<script>
(function () {
  'use strict';

  // ── Helpers ──────────────────────────────────────────────────────────
  const $ = (sel, ctx = document) => ctx.querySelector(sel);
  const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];

  function csrfToken() {
    const m = document.querySelector('meta[name="csrf-token"]');
    return m ? m.content : '';
  }

  async function apiFetch(method, url, body = null) {
    const opts = {
      method,
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken() },
    };
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch(url, opts);
    if (!r.ok) {
      let msg = `HTTP ${r.status}`;
      try { const d = await r.json(); msg = d.detail || d.message || msg; } catch {}
      throw new Error(msg);
    }
    return r.status === 204 ? null : r.json();
  }

  // ── Modal ─────────────────────────────────────────────────────────────
  function openModal(id) {
    const m = document.getElementById(id);
    if (m) { m.hidden = false; m.focus(); }
  }
  function closeModal(id) {
    const m = document.getElementById(id);
    if (m) m.hidden = true;
  }

  document.addEventListener('click', e => {
    const opener = e.target.closest('[data-action="open-modal"]');
    if (opener) { e.preventDefault(); openModal(opener.dataset.modal); return; }
    const closer = e.target.closest('[data-action="close-modal"]');
    if (closer) { e.preventDefault(); closeModal(closer.dataset.modal); return; }
    // Click on overlay backdrop
    if (e.target.classList.contains('modal-overlay')) {
      e.target.hidden = true;
    }
  });

  // ── Add project form ──────────────────────────────────────────────────
  const addForm   = document.getElementById('sb-add-project-form');
  const addSubmit = document.getElementById('sb-add-submit');
  const addLabel  = document.getElementById('sb-add-submit-label');
  const addSpinner = document.getElementById('sb-add-submit-spinner');
  const addError  = document.getElementById('sb-add-error');

  if (addSubmit) {
    addSubmit.addEventListener('click', async () => {
      if (!addForm.checkValidity()) { addForm.reportValidity(); return; }
      addError.hidden = true;
      addLabel.hidden = true;
      addSpinner.hidden = false;
      addSubmit.disabled = true;

      const data = Object.fromEntries(new FormData(addForm).entries());
      data.db_port = parseInt(data.db_port, 10);

      try {
        const proj = await apiFetch('POST', '/plugins/supabase/api/projects', data);
        closeModal('sb-modal-add-project');
        addForm.reset();
        // Reload page to show new project in sidebar
        window.location.reload();
      } catch (err) {
        addError.textContent = err.message;
        addError.hidden = false;
      } finally {
        addLabel.hidden = false;
        addSpinner.hidden = true;
        addSubmit.disabled = false;
      }
    });
  }

  // ── Project selection ─────────────────────────────────────────────────
  let currentProjectId = null;

  async function loadProject(projectId) {
    currentProjectId = projectId;
    // Highlight sidebar item
    $$('[data-action="select-project"]').forEach(el => {
      el.classList.toggle('active', el.dataset.projectId === String(projectId));
    });
    // Fetch and render project panel HTML
    const panel = document.getElementById('sb-project-panel') || document.getElementById('sb-main-content');
    if (!panel) return;
    panel.innerHTML = '<div class="loading-spinner"></div>';
    try {
      const r = await fetch(`/plugins/supabase/projects/${projectId}`);
      const html = await r.text();
      // Extract just the body content (the page extends layout, so parse the #sb-main-content part)
      // Since project_detail returns a full page, use the split-content area
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      const inner = tmp.querySelector('#sb-project-panel') || tmp.querySelector('.split-content');
      panel.innerHTML = inner ? inner.innerHTML : html;
      initProjectPanel(projectId);
    } catch (err) {
      panel.innerHTML = `<p class="form-error">${err.message}</p>`;
    }
  }

  document.addEventListener('click', e => {
    const sel = e.target.closest('[data-action="select-project"]');
    if (sel) { e.preventDefault(); loadProject(parseInt(sel.dataset.projectId, 10)); }
  });

  // ── Tabs ──────────────────────────────────────────────────────────────
  function initTabs() {
    $$('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        $$('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        $$('.sb-tab-panel').forEach(p => p.hidden = true);
        const panel = document.getElementById(`sb-tab-${tab.dataset.tab}`);
        if (panel) panel.hidden = false;
        // Lazy load roles
        if (tab.dataset.tab === 'roles' && currentProjectId) loadRoles(currentProjectId);
      });
    });
  }

  // ── DB → Tables drill-down ────────────────────────────────────────────
  function initTablesDrilldown(projectId) {
    document.addEventListener('click', async e => {
      const btn = e.target.closest('[data-action="view-tables"]');
      if (!btn || btn.dataset.projectId !== String(projectId)) return;
      const db = btn.dataset.db;
      const dbPanel = document.getElementById('sb-tab-databases');
      const tablesPanel = document.getElementById('sb-tables-panel');
      if (!dbPanel || !tablesPanel) return;
      // Hide db list, show tables
      $$('#sb-tab-databases > .table-wrap, #sb-tab-databases > .action-toolbar').forEach(el => el.hidden = true);
      tablesPanel.hidden = false;
      document.getElementById('sb-tables-title').textContent = `Tables in "${db}"`;
      const tbody = document.getElementById('sb-tables-body');
      tbody.innerHTML = '<tr><td colspan="3" class="text-muted">Loading…</td></tr>';
      try {
        const rows = await apiFetch('GET', `/plugins/supabase/api/projects/${projectId}/databases/${db}/tables`);
        tbody.innerHTML = rows.length
          ? rows.map(r => `<tr><td class="text-muted">${r.schema}</td><td>${r.name}</td><td class="text-muted">${r.size}</td></tr>`).join('')
          : '<tr><td colspan="3" class="text-muted">No tables found.</td></tr>';
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="3" class="form-error">${err.message}</td></tr>`;
      }
    });
    // Back button
    const backBtn = document.getElementById('sb-tables-back');
    if (backBtn) {
      backBtn.addEventListener('click', () => {
        document.getElementById('sb-tables-panel').hidden = true;
        $$('#sb-tab-databases > .table-wrap, #sb-tab-databases > .action-toolbar').forEach(el => el.hidden = false);
      });
    }
  }

  // ── Roles ─────────────────────────────────────────────────────────────
  async function loadRoles(projectId) {
    const tbody = document.getElementById('sb-roles-body');
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="4" class="text-muted">Loading…</td></tr>';
    try {
      const roles = await apiFetch('GET', `/plugins/supabase/api/projects/${projectId}/roles`);
      tbody.innerHTML = roles.map(r => `
        <tr>
          <td>${r.name}</td>
          <td>${r.superuser ? '✓' : '—'}</td>
          <td>${r.can_login ? '✓' : '—'}</td>
          <td>${r.create_db ? '✓' : '—'}</td>
        </tr>`).join('') || '<tr><td colspan="4" class="text-muted">No roles found.</td></tr>';
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="4" class="form-error">${err.message}</td></tr>`;
    }
  }

  // ── Query runner ──────────────────────────────────────────────────────
  function initQueryRunner(projectId) {
    const runBtn = document.getElementById('sb-query-run');
    if (!runBtn) return;
    runBtn.addEventListener('click', async () => {
      const sql = document.getElementById('sb-query-sql').value.trim();
      const db  = document.getElementById('sb-query-db').value;
      const resultPanel = document.getElementById('sb-query-result');
      const errEl = document.getElementById('sb-query-error');
      const countEl = document.getElementById('sb-query-count');
      errEl.hidden = true;
      resultPanel.hidden = true;
      if (!sql) return;
      runBtn.disabled = true;
      runBtn.textContent = 'Running…';
      try {
        const data = await apiFetch('POST', '/plugins/supabase/api/query', { project_id: projectId, db, sql });
        if (!data.rows.length) { countEl.textContent = '0 rows'; resultPanel.hidden = false; return; }
        const keys = Object.keys(data.rows[0]);
        document.getElementById('sb-query-thead').innerHTML = `<tr>${keys.map(k => `<th>${k}</th>`).join('')}</tr>`;
        document.getElementById('sb-query-tbody').innerHTML = data.rows
          .map(r => `<tr>${keys.map(k => `<td>${r[k] ?? ''}</td>`).join('')}</tr>`).join('');
        countEl.textContent = `${data.count} row${data.count !== 1 ? 's' : ''}`;
        resultPanel.hidden = false;
      } catch (err) {
        errEl.textContent = err.message;
        errEl.hidden = false;
      } finally {
        runBtn.disabled = false;
        runBtn.textContent = 'Run';
      }
    });
  }

  // ── Quick-switch query DB from table view ─────────────────────────────
  document.addEventListener('click', e => {
    const btn = e.target.closest('[data-action="query-db"]');
    if (!btn || !currentProjectId) return;
    // Switch to query tab and pre-fill DB
    $$('.tab').forEach(t => t.classList.remove('active'));
    const queryTab = $('[data-tab="query"]');
    if (queryTab) queryTab.classList.add('active');
    $$('.sb-tab-panel').forEach(p => p.hidden = true);
    const queryPanel = document.getElementById('sb-tab-query');
    if (queryPanel) queryPanel.hidden = false;
    const dbSelect = document.getElementById('sb-query-db');
    if (dbSelect) dbSelect.value = btn.dataset.db;
  });

  // ── Stats ─────────────────────────────────────────────────────────────
  function initStatsButton(projectId) {
    const btn = document.getElementById('sb-btn-stats');
    if (!btn) return;
    btn.addEventListener('click', async () => {
      $$('.tab').forEach(t => t.classList.remove('active'));
      const statsTab = $('[data-tab="stats"]');
      if (statsTab) statsTab.classList.add('active');
      $$('.sb-tab-panel').forEach(p => p.hidden = true);
      const statsPanel = document.getElementById('sb-tab-stats');
      if (statsPanel) statsPanel.hidden = false;
      const content = document.getElementById('sb-stats-content');
      content.innerHTML = '<div class="loading-spinner"></div>';
      try {
        const stats = await apiFetch('GET', `/plugins/supabase/api/projects/${projectId}/stats`);
        if (stats.error) {
          content.innerHTML = `<p class="form-error">${stats.error}</p>`;
          return;
        }
        content.innerHTML = `
          <div class="info-grid">
            <div class="info-row"><span class="info-label">Name</span><span class="info-value">${stats.name ?? '—'}</span></div>
            <div class="info-row"><span class="info-label">Status</span><span class="info-value">${stats.status ?? '—'}</span></div>
            <div class="info-row"><span class="info-label">Region</span><span class="info-value">${stats.region ?? '—'}</span></div>
            <div class="info-row"><span class="info-label">Plan</span><span class="info-value">${stats.plan ?? '—'}</span></div>
            <div class="info-row"><span class="info-label">Created</span><span class="info-value">${stats.created_at ?? '—'}</span></div>
          </div>`;
      } catch (err) {
        content.innerHTML = `<p class="form-error">${err.message}</p>`;
      }
    });
  }

  // ── Test connection button ────────────────────────────────────────────
  function initTestButton(projectId) {
    const btn = document.getElementById('sb-btn-test');
    if (!btn) return;
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Testing…';
      try {
        const r = await apiFetch('POST', `/plugins/supabase/api/projects/${projectId}/test`);
        btn.textContent = r.status === 'ok' ? '✓ Connected' : '✗ Failed';
        btn.className = r.status === 'ok' ? 'btn btn--sm btn--success' : 'btn btn--sm btn--danger';
      } catch (err) {
        btn.textContent = '✗ Error';
        btn.className = 'btn btn--sm btn--danger';
      } finally {
        btn.disabled = false;
        setTimeout(() => { btn.textContent = 'Test Connection'; btn.className = 'btn btn--sm btn--secondary'; }, 3000);
      }
    });
  }

  // ── Pause button ──────────────────────────────────────────────────────
  function initPauseButton(projectId) {
    const btn = document.getElementById('sb-btn-pause');
    if (!btn) return;
    btn.addEventListener('click', async () => {
      if (!confirm('Pause this Supabase project? It will stop serving requests until restored.')) return;
      btn.disabled = true;
      btn.textContent = 'Pausing…';
      try {
        await apiFetch('POST', `/plugins/supabase/api/projects/${projectId}/pause`);
        btn.textContent = 'Paused';
      } catch (err) {
        alert(err.message);
        btn.textContent = 'Pause';
        btn.disabled = false;
      }
    });
  }

  // ── Delete button ─────────────────────────────────────────────────────
  function initDeleteButton(projectId) {
    const btn = document.getElementById('sb-btn-delete');
    if (!btn) return;
    btn.addEventListener('click', async () => {
      if (!confirm('Remove this project from panel? This only removes the stored credentials — it does NOT delete the Supabase project.')) return;
      try {
        await apiFetch('DELETE', `/plugins/supabase/api/projects/${projectId}`);
        window.location.reload();
      } catch (err) { alert(err.message); }
    });
  }

  // ── Init project panel (called after panel HTML is injected) ──────────
  function initProjectPanel(projectId) {
    initTabs();
    initTablesDrilldown(projectId);
    initQueryRunner(projectId);
    initStatsButton(projectId);
    initTestButton(projectId);
    initPauseButton(projectId);
    initDeleteButton(projectId);
  }

  // ── Auto-load first project on page load ─────────────────────────────
  const firstProject = $('[data-action="select-project"]');
  if (firstProject) {
    loadProject(parseInt(firstProject.dataset.projectId, 10));
  }

})();
</script>
