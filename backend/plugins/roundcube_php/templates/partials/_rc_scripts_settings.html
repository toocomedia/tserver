<script>
// Save Configuration Button (Pure Click Handler with JSON payload)
document.getElementById('rc-save-settings-btn')?.addEventListener('click', async function() {
  const btn = this;
  const origText = btn.dataset.origText || btn.textContent.trim() || 'Save Configuration';
  if (!btn.dataset.origText) btn.dataset.origText = origText;

  const skinEl = document.getElementById('rc-setting-skin');
  const titleEl = document.getElementById('rc-setting-title');
  const sizeEl = document.getElementById('rc-setting-max-size');
  const lifetimeEl = document.getElementById('rc-setting-lifetime');
  const status = document.getElementById('rc-settings-status');

  const payload = {
    skin: skinEl ? skinEl.value : 'elastic',
    product_name: titleEl ? titleEl.value.trim() : 'SRV Webmail',
    max_message_size: sizeEl ? sizeEl.value : '32M',
    session_lifetime: lifetimeEl ? parseInt(lifetimeEl.value, 10) || 30 : 30
  };

  btn.disabled = true;
  btn.textContent = 'Saving…';
  if (status) status.textContent = '';

  try {
    const data = await rcApi('/plugins/roundcube_php/api/settings/update', {
      method: 'POST',
      json: payload
    });
    rcToast(data.message || 'Configuration saved.', 'success');
    if (status) {
      status.style.color = 'var(--color-success)';
      status.textContent = 'Configuration saved.';
      setTimeout(() => { if (status) status.textContent = ''; }, 4000);
    }
  } catch (err) {
    rcToast(err.message || 'Failed to save configuration.', 'danger');
    if (status) {
      status.style.color = 'var(--color-danger)';
      status.textContent = err.message || 'Failed to save.';
    }
  } finally {
    btn.disabled = false;
    btn.textContent = origText;
  }
});

// Save Active Plugins Button (Pure Click Handler with JSON payload)
document.getElementById('rc-save-plugins-btn')?.addEventListener('click', async function() {
  const btn = this;
  const origText = btn.dataset.origText || btn.textContent.trim() || 'Save Active Plugins';
  if (!btn.dataset.origText) btn.dataset.origText = origText;

  const status = document.getElementById('rc-plugins-status');
  const checkedPlugins = ['srvpanel_launch'];
  document.querySelectorAll('input[name="rc_plugin_item"]:checked').forEach(cb => {
    if (cb.value && !checkedPlugins.includes(cb.value)) {
      checkedPlugins.push(cb.value);
    }
  });

  btn.disabled = true;
  btn.textContent = 'Saving…';
  if (status) status.textContent = '';

  try {
    const data = await rcApi('/plugins/roundcube_php/api/settings/update', {
      method: 'POST',
      json: { plugins: checkedPlugins }
    });
    rcToast(data.message || 'Active plugins updated.', 'success');
    if (status) {
      status.style.color = 'var(--color-success)';
      status.textContent = 'Plugins updated.';
      setTimeout(() => { if (status) status.textContent = ''; }, 4000);
    }
  } catch (err) {
    rcToast(err.message || 'Failed to update plugins.', 'danger');
    if (status) {
      status.style.color = 'var(--color-danger)';
      status.textContent = err.message || 'Failed to save.';
    }
  } finally {
    btn.disabled = false;
    btn.textContent = origText;
  }
});

// Database Vacuum (Optimize)
document.getElementById('rc-vacuum-btn')?.addEventListener('click', async function() {
  const btn = this;
  const origText = btn.dataset.origText || btn.textContent.trim() || 'Optimize Database (VACUUM)';
  if (!btn.dataset.origText) btn.dataset.origText = origText;

  btn.disabled = true;
  btn.textContent = 'Optimizing…';
  const resBox = document.getElementById('rc-maintenance-result');
  if (resBox) resBox.textContent = '';

  try {
    const data = await rcApi('/plugins/roundcube_php/api/maintenance/optimize', {
      method: 'POST',
      json: {}
    });
    rcToast(data.message || 'Database optimized.', 'success');
    if (resBox) {
      resBox.style.color = 'var(--color-success)';
      resBox.textContent = data.message || 'Database optimized.';
    }
    if (data.stats && data.stats.db_size) {
      const sizeEl = document.getElementById('rc-db-size-val');
      if (sizeEl) sizeEl.textContent = data.stats.db_size;
    }
  } catch (err) {
    rcToast(err.message || 'Optimization failed.', 'danger');
    if (resBox) {
      resBox.style.color = 'var(--color-danger)';
      resBox.textContent = err.message || 'Optimization failed.';
    }
  } finally {
    btn.disabled = false;
    btn.textContent = origText;
  }
});

// Purge Cache & Temp
document.getElementById('rc-purge-temp-btn')?.addEventListener('click', async function() {
  const btn = this;
  const origText = btn.dataset.origText || btn.textContent.trim() || 'Purge Temp & Sessions';
  if (!btn.dataset.origText) btn.dataset.origText = origText;

  btn.disabled = true;
  btn.textContent = 'Purging…';
  const resBox = document.getElementById('rc-maintenance-result');
  if (resBox) resBox.textContent = '';

  try {
    const data = await rcApi('/plugins/roundcube_php/api/maintenance/purge-cache', {
      method: 'POST',
      json: {}
    });
    rcToast(data.message || 'Cache purged.', 'success');
    if (resBox) {
      resBox.style.color = 'var(--color-success)';
      resBox.textContent = data.message || 'Cache purged.';
    }
  } catch (err) {
    rcToast(err.message || 'Purge failed.', 'danger');
    if (resBox) {
      resBox.style.color = 'var(--color-danger)';
      resBox.textContent = err.message || 'Purge failed.';
    }
  } finally {
    btn.disabled = false;
    btn.textContent = origText;
  }
});

// Lifecycle & Installation control buttons
function handlePluginControl(btnId, url, promptMsg, loadingMsg) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  const origText = btn.dataset.origText || btn.textContent.trim();
  if (!btn.dataset.origText) btn.dataset.origText = origText;

  btn.addEventListener('click', async () => {
    if (promptMsg && !confirm(promptMsg)) return;
    btn.disabled = true;
    btn.textContent = loadingMsg || 'Processing…';

    try {
      const data = await rcApi(url, {
        method: 'POST',
        json: {}
      });
      rcToast(data.message || 'Operation complete.', 'success');
      setTimeout(() => window.location.reload(), 600);
    } catch (err) {
      rcToast(err.message || 'Operation failed.', 'danger');
      btn.disabled = false;
      btn.textContent = origText;
    }
  });
}

handlePluginControl('rc-topbar-install-btn', '/plugins/roundcube_php/api/install', null, 'Installing…');
handlePluginControl('rc-topbar-start-btn', '/plugins/roundcube_php/api/restart', null, 'Starting…');
handlePluginControl('rc-topbar-restart-btn', '/plugins/roundcube_php/api/restart', null, 'Restarting…');
handlePluginControl('rc-specs-restart-btn', '/plugins/roundcube_php/api/restart', null, 'Restarting…');
handlePluginControl('rc-specs-uninstall-btn', '/plugins/roundcube_php/api/uninstall', 'Uninstall Roundcube PHP service? Webmail data and mailboxes will be preserved.', 'Uninstalling…');
</script>
