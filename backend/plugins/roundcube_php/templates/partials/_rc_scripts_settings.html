<script>
document.getElementById('rc-settings-form')?.addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('rc-save-settings-btn');
  const status = document.getElementById('rc-settings-status');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  const formData = new FormData(this);
  formData.append('csrf_token', rcCsrf);
  try {
    const res = await fetch('/plugins/roundcube_php/api/settings/update', { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Failed to update settings');
    if (status) {
      status.style.color = 'var(--color-success)';
      status.textContent = 'Settings saved.';
    }
  } catch (err) {
    if (status) {
      status.style.color = 'var(--color-danger)';
      status.textContent = err.message;
    }
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save Configuration';
  }
});

document.getElementById('rc-plugins-form')?.addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('rc-save-plugins-btn');
  const status = document.getElementById('rc-plugins-status');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  const formData = new FormData(this);
  formData.append('csrf_token', rcCsrf);
  try {
    const res = await fetch('/plugins/roundcube_php/api/settings/update', { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Failed to update plugins');
    if (status) {
      status.style.color = 'var(--color-success)';
      status.textContent = 'Active plugins updated.';
    }
  } catch (err) {
    if (status) {
      status.style.color = 'var(--color-danger)';
      status.textContent = err.message;
    }
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save Active Plugins';
  }
});

document.getElementById('rc-vacuum-btn')?.addEventListener('click', async function() {
  this.disabled = true;
  this.textContent = 'Optimizing…';
  const resBox = document.getElementById('rc-maintenance-result');
  try {
    const res = await fetch('/plugins/roundcube_php/api/maintenance/optimize', {
      method: 'POST',
      body: new URLSearchParams({ csrf_token: rcCsrf })
    });
    const data = await res.json();
    if (resBox) {
      resBox.style.color = 'var(--color-success)';
      resBox.textContent = data.message || 'Database optimized.';
    }
  } catch (err) {
    if (resBox) {
      resBox.style.color = 'var(--color-danger)';
      resBox.textContent = err.message;
    }
  } finally {
    this.disabled = false;
    this.textContent = 'Optimize Database (VACUUM)';
  }
});

document.getElementById('rc-purge-temp-btn')?.addEventListener('click', async function() {
  this.disabled = true;
  this.textContent = 'Purging…';
  const resBox = document.getElementById('rc-maintenance-result');
  try {
    const res = await fetch('/plugins/roundcube_php/api/maintenance/purge-cache', {
      method: 'POST',
      body: new URLSearchParams({ csrf_token: rcCsrf })
    });
    const data = await res.json();
    if (resBox) {
      resBox.style.color = 'var(--color-success)';
      resBox.textContent = data.message || 'Cache purged.';
    }
  } catch (err) {
    if (resBox) {
      resBox.style.color = 'var(--color-danger)';
      resBox.textContent = err.message;
    }
  } finally {
    this.disabled = false;
    this.textContent = 'Purge Temporary & Session Files';
  }
});

const handlePluginControl = (btnId, url, promptMsg) => {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  btn.addEventListener('click', async () => {
    if (promptMsg && !confirm(promptMsg)) return;
    btn.disabled = true;
    try {
      const res = await fetch(url, {
        method: 'POST',
        body: new URLSearchParams({ csrf_token: rcCsrf })
      });
      const data = await res.json();
      alert(data.message || 'Operation complete.');
      window.location.reload();
    } catch (err) {
      alert(err.message || 'Operation failed.');
      btn.disabled = false;
    }
  });
};

handlePluginControl('rc-topbar-install-btn', '/plugins/roundcube_php/api/install');
handlePluginControl('rc-topbar-start-btn', '/plugins/roundcube_php/api/restart');
handlePluginControl('rc-topbar-restart-btn', '/plugins/roundcube_php/api/restart');
handlePluginControl('rc-specs-restart-btn', '/plugins/roundcube_php/api/restart');
handlePluginControl('rc-specs-uninstall-btn', '/plugins/roundcube_php/api/uninstall', 'Uninstall Roundcube PHP service? Webmail data and mailboxes will be preserved.');
</script>
