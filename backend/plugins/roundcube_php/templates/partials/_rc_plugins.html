<div class="rc-panel" id="rc-panel-plugins" data-panel="plugins" style="display:none;">
  <div class="php-card">
    <div class="php-card__title">
      <span>Plugins</span>
    </div>

    <form id="rc-plugins-form" style="padding: 18px; max-width: 520px; display: flex; flex-direction: column; gap: 10px;">
      <label class="php-spec-item" style="cursor: pointer; flex-direction: row; justify-content: space-between; align-items: center;">
        <span style="font-size: 13px; font-weight: 600; color: var(--color-text);">Archive Folder (archive)</span>
        <input type="checkbox" name="plugins" value="archive" {% if 'archive' in settings.plugins %}checked{% endif %}>
      </label>

      <label class="php-spec-item" style="cursor: pointer; flex-direction: row; justify-content: space-between; align-items: center;">
        <span style="font-size: 13px; font-weight: 600; color: var(--color-text);">Zip Attachments (zipdownload)</span>
        <input type="checkbox" name="plugins" value="zipdownload" {% if 'zipdownload' in settings.plugins %}checked{% endif %}>
      </label>

      <label class="php-spec-item" style="cursor: pointer; flex-direction: row; justify-content: space-between; align-items: center;">
        <span style="font-size: 13px; font-weight: 600; color: var(--color-text);">Mark as Junk (markasjunk)</span>
        <input type="checkbox" name="plugins" value="markasjunk" {% if 'markasjunk' in settings.plugins %}checked{% endif %}>
      </label>

      <label class="php-spec-item" style="cursor: pointer; flex-direction: row; justify-content: space-between; align-items: center;">
        <span style="font-size: 13px; font-weight: 600; color: var(--color-text);">Emoticons (emoticons)</span>
        <input type="checkbox" name="plugins" value="emoticons" {% if 'emoticons' in settings.plugins %}checked{% endif %}>
      </label>

      <label class="php-spec-item" style="opacity: 0.85; flex-direction: row; justify-content: space-between; align-items: center;">
        <span style="font-size: 13px; font-weight: 600; color: var(--color-text);">Fast Launch (srvpanel_launch)</span>
        <input type="hidden" name="plugins" value="srvpanel_launch">
        <input type="checkbox" checked disabled title="Mandatory for panel SSO launch">
      </label>

      <div style="margin-top: 10px; display: flex; align-items: center; gap: 12px;">
        <button type="submit" class="btn btn--primary" id="rc-save-plugins-btn">Save</button>
        <span id="rc-plugins-status" style="font-size: 12px;"></span>
      </div>
    </form>
  </div>
</div>
