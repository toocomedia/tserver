<div class="rc-tab-panel" id="rc-panel-plugins" data-panel="plugins" style="display:none;">
  <div class="php-card">
    <div class="php-card__title">
      <span>Roundcube Internal Plugins</span>
    </div>

    <form id="rc-plugins-form" style="padding: 20px;">
      <p style="font-size: 13px; color: var(--color-muted); margin-bottom: 20px; line-height: 1.5;">
        Toggle modular extensions bundled with Roundcube. Changes take effect on the next webmail session.
      </p>

      <div style="display: flex; flex-direction: column; gap: 14px; max-width: 600px;">
        <label style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--color-surface-hover); cursor: pointer;">
          <div>
            <strong style="font-size: 13px; color: var(--color-text); display: block;">Archive Folder (archive)</strong>
            <span style="font-size: 11px; color: var(--color-muted);">Adds a 1-click archive button for organizing mailboxes.</span>
          </div>
          <input type="checkbox" name="plugins" value="archive" {% if 'archive' in settings.plugins %}checked{% endif %}>
        </label>

        <label style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--color-surface-hover); cursor: pointer;">
          <div>
            <strong style="font-size: 13px; color: var(--color-text); display: block;">Zip Download (zipdownload)</strong>
            <span style="font-size: 11px; color: var(--color-muted);">Download all attachments in an email as a single ZIP file.</span>
          </div>
          <input type="checkbox" name="plugins" value="zipdownload" {% if 'zipdownload' in settings.plugins %}checked{% endif %}>
        </label>

        <label style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--color-surface-hover); cursor: pointer;">
          <div>
            <strong style="font-size: 13px; color: var(--color-text); display: block;">Mark as Junk (markasjunk)</strong>
            <span style="font-size: 11px; color: var(--color-muted);">Move spam messages directly into the Spam/Junk mailbox.</span>
          </div>
          <input type="checkbox" name="plugins" value="markasjunk" {% if 'markasjunk' in settings.plugins %}checked{% endif %}>
        </label>

        <label style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--color-surface-hover); cursor: pointer;">
          <div>
            <strong style="font-size: 13px; color: var(--color-text); display: block;">Emoticons (emoticons)</strong>
            <span style="font-size: 11px; color: var(--color-muted);">Insert smileys and emoji symbols in the HTML composer.</span>
          </div>
          <input type="checkbox" name="plugins" value="emoticons" {% if 'emoticons' in settings.plugins %}checked{% endif %}>
        </label>

        <label style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--color-surface-hover); opacity: 0.85;">
          <div>
            <strong style="font-size: 13px; color: var(--color-text); display: block;">Panel Fast Launch (srvpanel_launch)</strong>
            <span style="font-size: 11px; color: var(--color-muted);">Enables 1-click authenticated launch from the panel (Required).</span>
          </div>
          <input type="checkbox" name="plugins" value="srvpanel_launch" checked disabled>
        </label>
      </div>

      <div style="margin-top: 20px; display: flex; align-items: center; gap: 12px;">
        <button type="submit" class="btn btn--primary" id="rc-save-plugins-btn">Save Active Plugins</button>
        <span id="rc-plugins-status" style="font-size: 12px;"></span>
      </div>
    </form>
  </div>
</div>
