<div class="rc-panel" id="rc-panel-settings" data-panel="settings" style="display:none;">
  <div class="php-card">
    <div class="php-card__title">
      <span>Configuration</span>
    </div>

    <form id="rc-settings-form" style="padding: 18px; display: flex; flex-direction: column; gap: 14px; max-width: 520px;">
      <div class="form-group">
        <label class="form-label" for="rc-setting-skin">Skin / Theme</label>
        <div class="form-select-wrap">
          <select class="form-select" id="rc-setting-skin" name="skin">
            <option value="elastic" {% if settings.skin == 'elastic' %}selected{% endif %}>Elastic (Mobile Responsive)</option>
            <option value="larry" {% if settings.skin == 'larry' %}selected{% endif %}>Larry (Desktop Classic)</option>
            <option value="classic" {% if settings.skin == 'classic' %}selected{% endif %}>Classic</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="rc-setting-title">Brand Title</label>
        <input type="text" class="form-input" id="rc-setting-title" name="product_name" value="{{ settings.product_name }}" placeholder="SRV Webmail">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
        <div class="form-group">
          <label class="form-label" for="rc-setting-max-size">Max Upload Size</label>
          <div class="form-select-wrap">
            <select class="form-select" id="rc-setting-max-size" name="max_message_size">
              <option value="16M" {% if settings.max_message_size == '16M' %}selected{% endif %}>16 MB</option>
              <option value="32M" {% if settings.max_message_size == '32M' %}selected{% endif %}>32 MB</option>
              <option value="64M" {% if settings.max_message_size == '64M' %}selected{% endif %}>64 MB</option>
              <option value="128M" {% if settings.max_message_size == '128M' %}selected{% endif %}>128 MB</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="rc-setting-lifetime">Session Lifetime (Min)</label>
          <input type="number" class="form-input" id="rc-setting-lifetime" name="session_lifetime" value="{{ settings.session_lifetime }}" min="5" max="1440">
        </div>
      </div>

      <div style="margin-top: 6px; display: flex; align-items: center; gap: 12px;">
        <button type="submit" class="btn btn--primary" id="rc-save-settings-btn" data-no-loading="true">Save</button>
        <span id="rc-settings-status" style="font-size: 12px;"></span>
      </div>
    </form>
  </div>
</div>
