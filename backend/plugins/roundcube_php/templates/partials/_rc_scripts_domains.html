<script>
function filterRcDomains(query) {
  const q = (query || '').toLowerCase().trim();
  document.querySelectorAll('#rc-domains-table tbody tr').forEach(row => {
    const text = row.innerText.toLowerCase();
    row.style.display = (!q || text.includes(q)) ? '' : 'none';
  });
}

function onRcDomainSelectChange(domain) {
  const hostInput = document.getElementById('rc-modal-public-host');
  const preview = document.getElementById('rc-modal-dns-preview');
  const hostText = document.getElementById('rc-dns-host-text');
  if (domain && hostInput && !hostInput.value) {
    hostInput.value = `mm.${domain}`;
    if (hostText) hostText.textContent = `mm.${domain}`;
    if (preview) preview.style.display = document.getElementById('rc-modal-manage-dns')?.checked ? 'none' : 'block';
  }
}

document.getElementById('rc-modal-manage-dns')?.addEventListener('change', function() {
  const preview = document.getElementById('rc-modal-dns-preview');
  if (preview) preview.style.display = this.checked ? 'none' : 'block';
});

// Add Webmail Domain Form
document.getElementById('rc-form-add-domain')?.addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('rc-submit-add-domain');
  const errBox = document.getElementById('rc-add-site-error');
  const origText = btn ? (btn.dataset.origText || btn.textContent.trim() || 'Save Domain') : 'Save Domain';

  if (btn) {
    if (!btn.dataset.origText) btn.dataset.origText = origText;
    btn.classList.remove('is-loading');
    btn.setAttribute('aria-busy', 'true');
    btn.disabled = true;
    btn.textContent = 'Saving…';
  }
  if (errBox) errBox.style.display = 'none';

  const formData = new FormData(this);
  formData.set('csrf_token', getRcCsrf());

  try {
    const data = await rcApi('/plugins/roundcube_php/api/sites/add', {
      method: 'POST',
      body: formData
    });
    rcToast(data.message || 'Webmail domain added.', 'success');
    closeRcModal('rc-modal-add-domain');
    setTimeout(() => window.location.reload(), 600);
  } catch (err) {
    if (errBox) {
      errBox.textContent = err.message || 'Failed to add domain.';
      errBox.style.display = 'block';
    }
    rcToast(err.message || 'Failed to add webmail access.', 'danger');
    if (btn) {
      btn.classList.remove('is-loading');
      btn.removeAttribute('aria-busy');
      btn.disabled = false;
      btn.textContent = origText;
    }
  }
});

// Delegated Domain Actions
document.addEventListener('click', async (e) => {
  const actionBtn = e.target.closest('[data-action]');
  if (!actionBtn) return;
  const action = actionBtn.getAttribute('data-action');
  const domain = actionBtn.getAttribute('data-domain');

  if (action === 'add-webmail') {
    const select = document.getElementById('rc-modal-mail-domain');
    if (select && domain) {
      select.value = domain;
      onRcDomainSelectChange(domain);
    }
    openRcModal('rc-modal-add-domain');
  } else if (action === 'delete-site') {
    const nameEl = document.getElementById('rc-delete-domain-name');
    const input = document.getElementById('rc-delete-domain-input');
    if (nameEl) nameEl.textContent = domain;
    if (input) input.value = domain;
    openRcModal('rc-modal-delete-domain');
  } else if (action === 'issue-ssl') {
    const origText = actionBtn.dataset.origText || actionBtn.textContent.trim() || 'Issue / Renew SSL';
    if (!actionBtn.dataset.origText) actionBtn.dataset.origText = origText;
    actionBtn.classList.remove('is-loading');
    actionBtn.setAttribute('aria-busy', 'true');
    actionBtn.disabled = true;
    actionBtn.textContent = 'Issuing SSL…';
    const body = new FormData();
    body.set('csrf_token', getRcCsrf());
    body.set('mail_domain', domain);

    try {
      const data = await rcApi('/plugins/roundcube_php/api/sites/ssl', {
        method: 'POST',
        body
      });
      rcToast(data.message || 'SSL issuance started in background.', 'success');
      setTimeout(() => window.location.reload(), 1000);
    } catch (err) {
      rcToast(err.message || 'SSL issuance failed.', 'danger');
      actionBtn.classList.remove('is-loading');
      actionBtn.removeAttribute('aria-busy');
      actionBtn.disabled = false;
      actionBtn.textContent = origText;
    }
  }
});

// Delete Webmail Action
async function executeDeleteWebmail() {
  const domain = document.getElementById('rc-delete-domain-input')?.value;
  const btn = document.getElementById('rc-confirm-delete-btn');
  if (!domain) return;
  const origText = btn ? (btn.dataset.origText || btn.textContent.trim() || 'Delete') : 'Delete';

  if (btn) {
    if (!btn.dataset.origText) btn.dataset.origText = origText;
    btn.classList.remove('is-loading');
    btn.setAttribute('aria-busy', 'true');
    btn.disabled = true;
    btn.textContent = 'Deleting…';
  }
  const body = new FormData();
  body.set('csrf_token', getRcCsrf());
  body.set('mail_domain', domain);

  try {
    const data = await rcApi('/plugins/roundcube_php/api/sites/delete', {
      method: 'POST',
      body
    });
    rcToast(data.message || `Webmail removed for ${domain}.`, 'success');
    closeRcModal('rc-modal-delete-domain');
    setTimeout(() => window.location.reload(), 600);
  } catch (err) {
    rcToast(err.message || 'Delete failed.', 'danger');
    if (btn) {
      btn.classList.remove('is-loading');
      btn.removeAttribute('aria-busy');
      btn.disabled = false;
      btn.textContent = origText;
    }
  }
}

// Mail Diagnostics
document.getElementById('rc-topbar-test-mail')?.addEventListener('click', async () => {
  openRcModal('rc-modal-diagnostics');
  const loading = document.getElementById('rc-diag-loading');
  const content = document.getElementById('rc-diag-content');
  const imapEl = document.getElementById('rc-diag-imap-val');
  const smtpEl = document.getElementById('rc-diag-smtp-val');
  const bannerBox = document.getElementById('rc-diag-banner-box');
  if (loading) {
    loading.style.display = 'block';
    loading.textContent = 'Checking 127.0.0.1:143 & 587…';
  }
  if (content) content.style.display = 'none';

  try {
    const data = await rcApi('/plugins/roundcube_php/api/mail-diagnostics');
    if (loading) loading.style.display = 'none';
    if (content) content.style.display = 'flex';
    if (imapEl) imapEl.innerHTML = data.imap?.ok ? '<span class="badge badge--healthy">Connected (127.0.0.1:143)</span>' : '<span class="badge badge--danger">Failed</span>';
    if (smtpEl) smtpEl.innerHTML = data.smtp?.ok ? '<span class="badge badge--healthy">Connected (127.0.0.1:587)</span>' : '<span class="badge badge--danger">Failed</span>';
    if (bannerBox) bannerBox.textContent = `IMAP Banner: ${data.imap?.banner || 'N/A'} | Transport: ${data.transport || 'local'}`;
  } catch (err) {
    if (loading) loading.textContent = `Diagnostic error: ${err.message}`;
  }
});
</script>
