<script>
function getRcCsrf() {
  return document.querySelector('meta[name="csrf-token"]')?.content ||
         (typeof window.getCsrfToken === 'function' ? window.getCsrfToken() : '') ||
         document.querySelector('input[name="csrf_token"]')?.value || '';
}

const rcCsrf = getRcCsrf();

function rcToast(message, type = 'success') {
  if (typeof window.toast === 'function') {
    window.toast(message, type);
    return;
  }
  if (typeof window.showToast === 'function') {
    window.showToast(message, type === 'danger' ? 'error' : 'success');
    return;
  }
  if (type === 'danger') {
    alert(message);
  } else {
    console.log('[Roundcube]', message);
  }
}

async function rcApi(url, options = {}) {
  const method = (options.method || 'GET').toUpperCase();
  const token = getRcCsrf();
  const headers = window.csrfHeaders
    ? window.csrfHeaders(options.headers || {})
    : { ...(options.headers || {}) };

  if (token && !headers['X-CSRF-Token']) {
    headers['X-CSRF-Token'] = token;
  }
  if (!headers['Accept']) {
    headers['Accept'] = 'application/json';
  }

  let body = options.body;
  if (options.json !== undefined) {
    headers['Content-Type'] = 'application/json';
    body = JSON.stringify(options.json);
  }

  const res = await fetch(url, {
    method,
    headers,
    body,
  });

  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    let errorMsg = data.detail || data.message || `Request failed (${res.status})`;
    if (Array.isArray(errorMsg)) {
      errorMsg = errorMsg.map(item => item.msg || JSON.stringify(item)).join('; ');
    } else if (typeof errorMsg === 'object') {
      errorMsg = JSON.stringify(errorMsg);
    }
    throw new Error(errorMsg);
  }
  return data;
}

function switchRcTab(tabName, button) {
  document.querySelectorAll('.php-split-nav-btn').forEach(btn => btn.classList.remove('is-active'));
  if (button) button.classList.add('is-active');

  document.querySelectorAll('.rc-panel').forEach(panel => {
    panel.style.display = (panel.dataset.panel === tabName) ? 'block' : 'none';
  });
  if (history.replaceState) {
    history.replaceState(null, '', `${location.pathname}#${tabName}`);
  }
}

function openRcModal(modalId) {
  const modal = document.getElementById(modalId);
  if (modal) modal.classList.remove('hidden');
}

function closeRcModal(modalId) {
  const modal = typeof modalId === 'string' ? document.getElementById(modalId) : modalId.closest('.modal-backdrop');
  if (modal) modal.classList.add('hidden');
}

document.addEventListener('click', (e) => {
  const openTrigger = e.target.closest('[data-action="open-modal"]');
  if (openTrigger) {
    const modalId = openTrigger.getAttribute('data-modal');
    if (modalId) openRcModal(modalId);
    return;
  }
  const closeTrigger = e.target.closest('[data-action="close-modal"]');
  if (closeTrigger) {
    closeRcModal(closeTrigger);
    return;
  }
  if (e.target.classList.contains('modal-backdrop')) {
    e.target.classList.add('hidden');
  }
});

document.addEventListener('DOMContentLoaded', () => {
  if (location.hash) {
    const tab = location.hash.replace('#', '');
    const btn = document.querySelector(`[data-rc-tab="${tab}"]`);
    if (btn) switchRcTab(tab, btn);
  }
});
</script>
