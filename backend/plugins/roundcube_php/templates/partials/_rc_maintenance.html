<div class="rc-panel" id="rc-panel-maintenance" data-panel="maintenance" style="display:none;">
  <div class="php-card">
    <div class="php-card__title">
      <span>Database &amp; Storage</span>
    </div>

    <div style="padding: 18px; display: flex; flex-direction: column; gap: 18px;">
      <div class="php-spec-grid">
        <div class="php-spec-item">
          <span class="php-spec-label">Engine</span>
          <span class="php-spec-value">{{ db_stats.db_type or 'SQLite' }}</span>
        </div>
        <div class="php-spec-item">
          <span class="php-spec-label">Size</span>
          <span class="php-spec-value" id="rc-db-size-val">{{ db_stats.db_size or '0 KB' }}</span>
        </div>
        <div class="php-spec-item">
          <span class="php-spec-label">Users</span>
          <span class="php-spec-value" id="rc-db-users-val">{{ db_stats.users_count or 0 }}</span>
        </div>
        <div class="php-spec-item">
          <span class="php-spec-label">Contacts</span>
          <span class="php-spec-value" id="rc-db-contacts-val">{{ db_stats.contacts_count or 0 }}</span>
        </div>
      </div>

      <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding-top: 6px;">
        <button type="button" class="btn btn--secondary btn--sm" id="rc-vacuum-btn">Optimize Database (VACUUM)</button>
        <button type="button" class="btn btn--secondary btn--sm" id="rc-purge-temp-btn">Purge Temp &amp; Sessions</button>
      </div>
      <div id="rc-maintenance-result" style="font-size: 12px;"></div>
    </div>
  </div>
</div>
