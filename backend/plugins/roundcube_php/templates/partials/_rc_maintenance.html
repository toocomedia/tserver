<div class="rc-tab-pane" id="rc-panel-maintenance" data-panel="maintenance" style="display:none;">
  <div class="rc-card">
    <div class="rc-card-head">
      <h3 class="rc-card-title">Database &amp; Storage</h3>
    </div>

    <div style="padding: 18px; display: flex; flex-direction: column; gap: 18px;">
      <div class="rc-spec-grid">
        <div class="rc-spec-box">
          <span class="rc-spec-lbl">Engine</span>
          <span class="rc-spec-val">{{ db_stats.db_type or 'SQLite' }}</span>
        </div>
        <div class="rc-spec-box">
          <span class="rc-spec-lbl">Size</span>
          <span class="rc-spec-val" id="rc-db-size-val">{{ db_stats.db_size or '0 KB' }}</span>
        </div>
        <div class="rc-spec-box">
          <span class="rc-spec-lbl">Users</span>
          <span class="rc-spec-val" id="rc-db-users-val">{{ db_stats.users_count or 0 }}</span>
        </div>
        <div class="rc-spec-box">
          <span class="rc-spec-lbl">Contacts</span>
          <span class="rc-spec-val" id="rc-db-contacts-val">{{ db_stats.contacts_count or 0 }}</span>
        </div>
      </div>

      <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding-top: 6px;">
        <button type="button" class="btn btn--secondary btn--sm" id="rc-vacuum-btn">Optimize Database (VACUUM)</button>
        <button type="button" class="btn btn--secondary btn--sm" id="rc-purge-temp-btn">Purge Temp &amp; Sessions</button>
      </div>
      <div id="rc-maintenance-result" style="font-size: 12px;"></div>
    </div>
  </div>
</div>
