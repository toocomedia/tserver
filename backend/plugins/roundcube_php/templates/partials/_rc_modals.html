<!-- MODAL: ADD / CONFIGURE WEBMAIL DOMAIN -->
<div class="modal-backdrop hidden" id="rc-modal-add-domain" role="dialog">
  <div class="modal" style="max-width: 440px;">
    <div class="modal__header">
      <h3 class="modal__title">Configure Webmail Domain</h3>
      <button type="button" class="modal__close" data-action="close-modal">&times;</button>
    </div>
    <form id="rc-form-add-domain">
      <div class="modal__body" style="display: flex; flex-direction: column; gap: 12px;">
        <div class="form-group">
          <label class="form-label" for="rc-modal-mail-domain">Mail Domain</label>
          <div class="form-select-wrap">
            <select class="form-select" id="rc-modal-mail-domain" name="mail_domain" required onchange="onRcDomainSelectChange(this.value)">
              <option value="">Select Domain...</option>
              {% for item in domain_rows %}
                {% if not item.site %}
                  <option value="{{ item.domain }}">{{ item.domain }}</option>
                {% endif %}
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="rc-modal-public-host">Hostname (e.g. mm.domain.com)</label>
          <input type="text" class="form-input" id="rc-modal-public-host" name="public_host" placeholder="mm.yourdomain.com" required>
        </div>

        <div class="form-group">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="checkbox" id="rc-modal-manage-dns" name="manage_dns" value="true" checked>
            <span style="font-size: 12px; color: var(--color-text);">Manage DNS A Record automatically</span>
          </label>
        </div>
        <div id="rc-add-site-error" style="display: none; font-size: 12px; color: var(--color-danger);"></div>
      </div>
      <div class="modal__footer">
        <button type="button" class="btn btn--secondary" data-action="close-modal">Cancel</button>
        <button type="submit" class="btn btn--primary" id="rc-submit-add-domain" data-no-loading="true">Save Domain</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL: DELETE WEBMAIL ACCESS -->
<div class="modal-backdrop hidden" id="rc-modal-delete-domain" role="dialog">
  <div class="modal" style="max-width: 400px;">
    <div class="modal__header">
      <h3 class="modal__title">Delete Webmail Access</h3>
      <button type="button" class="modal__close" data-action="close-modal">&times;</button>
    </div>
    <div class="modal__body">
      <p style="font-size: 13px; color: var(--color-text); margin-bottom: 6px;">
        Remove webmail access for <strong id="rc-delete-domain-name" style="color: var(--color-danger);"></strong>?
      </p>
      <p style="font-size: 12px; color: var(--color-muted);">Mailboxes and emails are preserved.</p>
    </div>
    <div class="modal__footer">
      <input type="hidden" id="rc-delete-domain-input">
      <button type="button" class="btn btn--secondary" data-action="close-modal">Cancel</button>
      <button type="button" class="btn btn--danger" id="rc-confirm-delete-btn" onclick="executeDeleteWebmail()">Delete</button>
    </div>
  </div>
</div>

<!-- MODAL: MAIL DIAGNOSTICS -->
<div class="modal-backdrop hidden" id="rc-modal-diagnostics" role="dialog">
  <div class="modal" style="max-width: 420px;">
    <div class="modal__header">
      <h3 class="modal__title">Mail Server Status</h3>
      <button type="button" class="modal__close" data-action="close-modal">&times;</button>
    </div>
    <div class="modal__body">
      <div id="rc-diag-loading" style="text-align: center; padding: 16px; color: var(--color-muted); font-size: 13px;">
        Checking 127.0.0.1:143 &amp; 587…
      </div>
      <div id="rc-diag-content" style="display: none; flex-direction: column; gap: 8px;">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: var(--color-surface-hover); border: 1px solid var(--color-line);">
          <span style="font-size: 12px; font-weight: 600; color: var(--color-text);">IMAP (127.0.0.1:143)</span>
          <span id="rc-diag-imap-val"></span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: var(--color-surface-hover); border: 1px solid var(--color-line);">
          <span style="font-size: 12px; font-weight: 600; color: var(--color-text);">SMTP (127.0.0.1:587)</span>
          <span id="rc-diag-smtp-val"></span>
        </div>
      </div>
    </div>
    <div class="modal__footer">
      <button type="button" class="btn btn--secondary" data-action="close-modal">Close</button>
    </div>
  </div>
</div>
